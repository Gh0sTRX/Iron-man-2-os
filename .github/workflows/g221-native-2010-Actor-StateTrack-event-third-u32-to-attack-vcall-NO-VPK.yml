name: G221 original 2010 StateTrack actual third u32 and AttackType passed Actor C++ virtual attack source NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g221-native-2010-Actor-StateTrack-event-third-u32-to-attack-vcall-NO-VPK.yml"
      - "research/b24_unified/g221_native_event_payload_attack_dispatch/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine_owner_2010_Event_AttackType_to_virtual_ARM_dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate true native C++ ARM/owner 2010 StateData event consumer source
        run: |
          set -euo pipefail
          python3 -m py_compile research/b24_unified/g221_native_event_payload_attack_dispatch/g221_original_2010_AttackType_StateTrack_third_u32_to_virtual_actor_call_SOURCE.py
      - uses: actions/download-artifact@v4
        with:
          name: G213B_ORIGINAL_2010_55_STATESETS_379_ATTACKTYPE_FULL_NATIVE_STATE_READER_NO_VPK
          run-id: 39135273483
          github-token: ${{ github.token }}
          path: /tmp/g221_2010_orig_states
      - uses: actions/download-artifact@v4
        with:
          name: G219_ORIGINAL_2010_STATETRACK_GETEVENT_THIRD_FIELD_ARM_SOURCE_NO_VPK
          run-id: 39137453641
          github-token: ${{ github.token }}
          path: /tmp/g221_true_2010_arm
      - uses: actions/download-artifact@v4
        with:
          name: G220_ORIGINAL_2010_OWNED_ARM_STATETRACK_GETEVENT_CPP_CALLSITE_GRAPH_NO_VPK
          run-id: 39140750863
          github-token: ${{ github.token }}
          path: /tmp/g221_true_2010_callsite
      - name: Prove 2010 native StateData AttackType AND StateTrack event third u32 passed to real Actor virtual C++ callback slot 0x110, no guessed damage
        run: |
          set -euo pipefail
          python3 research/b24_unified/g221_native_event_payload_attack_dispatch/g221_original_2010_AttackType_StateTrack_third_u32_to_virtual_actor_call_SOURCE.py \
            --g213 /tmp/g221_2010_orig_states/G213B_ORIGINAL_2010_55_STATESETS_FULL_ATTACKTYPE_STATETRACK_SOURCE.json \
            --g219 /tmp/g221_true_2010_arm/G219_ORIGINAL_2010_STATETRACK_GETEVENT_THIRD_FIELD_NATIVE_ARM.json \
            --g220 /tmp/g221_true_2010_callsite/G220_OWNER_ORIGINAL_2010_REAL_STATE_TRACK_GETEVENT_ALL_NATIVE_ARM_CALLERS.json \
            --out /tmp/g221_result/G221_TRUE_2010_ATTACKTYPE_NATIVE_EVENT_THIRD_U32_VIRTUAL_CALL_SOURCE.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/g221_result/G221_TRUE_2010_ATTACKTYPE_NATIVE_EVENT_THIRD_U32_VIRTUAL_CALL_SOURCE.json').read_text())
          assert d['source_original_real_actor_AttackType_event_caller_VM']=='0xdb610'
          assert d['source_real_actor_attack_GetEvent_CALL_VM']=='0xdb684'
          assert d['source_original_event_array_third_u32_READ_by_ACTOR_VM']=='0xdb6a4'
          assert d['original_2010_vtable_dynamic_dispatch_VM']=='0xdb6d8'
          assert d['original_2010_vtable_dynamic_method_offset_bytes']==272
          assert d['source_genuine_ARM_exact_instruction_count_verified']>=24
          assert d['source_original_event_third_u32_loaded_in_ARM_r2']
          assert set(d['source_actual_native_2010_event_original_armor_values'])=={'IronMan','IronMan_suitcase','Warmachine','stealth'}
          assert not d['source_native_vtable_slot_0x110_function_identity_PROVEN']
          assert not d['source_original_attack_event_third_u32_means_hitframe_damage_or_missile_ID_PROVEN']
          assert not d['source_any_iOS_attacks_or_damage_executed_in_Vita']
          assert not d['source_G218_live_original_readonly_bridge_changed']
          assert d['NO_VPK']
          print('PASS G221 exact owner native Actor::UpdateStateAttack accepts real attack type+event[INDEX].third-u32 in virtual call; no imaginary hitframe or damage')
          PY
          test -z "$(find . -name '*.vpk' -print -quit)"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: G221_ORIGINAL_2010_ATTACKTYPE_STATETRACK_THIRD_U32_ACTOR_VCALL_SOURCE_NO_VPK
          path: /tmp/g221_result/
          retention-days: 21
          if-no-files-found: error
