name: G65 original 2010 BRES FVF24 true UV RGBA source forensic no VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g65-2010-original-BRES-FVF24-UV-source.yml"
      - "research/b24_unified/b24_g65_original_2010_C1L1_FVF24_uv_rgba_source_audit.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify_native_fvf24:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve successful G64 input HTML without publishing the user IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/g65/g64 /tmp/g65/out
          gh run download 38872391947 --repo "${{ github.repository }}" \
            -n G64_REAL_SOURCE_BRES_20457_NATIVE_UV_PVR_WEBGL2_GLB_JSON_NO_VPK \
            -D /tmp/g65/g64
          test -s /tmp/g65/g64/G64_SOURCE_REAL_UV_PVR_RECOVERED_VIEWER.html
          test -s research/B11_C1L1_Source_Parser.zip
      - name: Native source-only FVF24 BRES vertex format audit
        run: |
          python3 -m pip install -q numpy
          python3 -m py_compile \
            research/b24_unified/b24_g65_original_2010_C1L1_FVF24_uv_rgba_source_audit.py
          python3 research/b24_unified/b24_g65_original_2010_C1L1_FVF24_uv_rgba_source_audit.py \
            --b11zip research/B11_C1L1_Source_Parser.zip \
            --g64html /tmp/g65/g64/G64_SOURCE_REAL_UV_PVR_RECOVERED_VIEWER.html \
            --out /tmp/g65/out/G65_SOURCE_AUTHENTIC_NATIVE_FVF24_UV_RGBA_ONLY.json
      - name: Preserve verified source vs unproven shader boundary
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/g65/out/G65_SOURCE_AUTHENTIC_NATIVE_FVF24_UV_RGBA_ONLY.json'))
          assert d['real_original_UV_plus_PVR_source_faces']==22021
          assert d['counts']['FVF24_meshes']==128
          assert d['counts']['new_source_UV_PVR_faces']==1564
          assert d['counts']['native_constant_UV_sampler_faces']==132
          assert d['counts']['native_vertex_color_only_faces']==288
          assert d['source_triangles']==22919
          assert d['original_iOS_blend_alpha_shader_proven'] is False
          assert not d['new_VPK']
          print('PASS G65 22021 original UV/PVR mesh faces; blending not proven; NO VPK.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G65_REAL_2010_BRES_FVF24_UV_RGBA_NATIVE_SOURCE_EVIDENCE_NO_IPA_NO_VPK
          path: /tmp/g65/out/*
          retention-days: 14
          if-no-files-found: error
