name: G70 Reverse Merge G9 Gameplay plus G68 Real Vita City Source Regression No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g70-reverse-merge-host-regression.yml"
      - "research/b24_unified/g70_reverse_merge/**"
      - "research/b24_unified/b24_gpu_g68_city.*"
      - "research/b24_unified/b24_gpu_g68_collision.*"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify_reverse_merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch owner's prior real Vita-tested G68 map snapshot, read-only
        uses: actions/download-artifact@v4
        with:
          name: IRONMAN2_B24_G68_MARK_V_MEDIA_MAYHEM_SOURCE_CANDIDATE_VPK
          run-id: 38885906487
          github-token: ${{ github.token }}
          path: /tmp/g70_owner_vpk
      - name: Stage exactly G68 original city and original collision
        run: |
          python3 research/b24_unified/g70_reverse_merge/g70_stage_g68_source_scene.py \
            --vpk /tmp/g70_owner_vpk/IronMan2_B24_G68_MarkV_Expo_Combat.vpk \
            --out /tmp/g70_stage/assets
      - name: Test 1910 original B24 collision faces on legacy G9 CPU resolver
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
             research/b24_unified/g70_reverse_merge/test_g70_original_1910_collision_bridge.c \
             research/b24_unified/b24_gpu_g68_collision.c \
             research/b24_unified/b24_c1_original_collision.c -lm -o /tmp/g70_collision
          /tmp/g70_collision /tmp/g70_stage/assets/G66_original_collision.g66c
      - name: Source guard old B24 gameplay owner plus only G68 GPU map replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('research/b24_unified')
          runtime=(root/'b24_gpu_runtime.c').read_text()
          gameplay=(root/'b24_unified.c').read_text()
          scene=(root/'b24_gpu_g68_city.c').read_text()
          merger=(root/'g70_reverse_merge/apply_b24_g70_scene_backend.py').read_text()
          assert '#ifdef B24_G68_CITY_BACKEND' in runtime
          assert 'b24_gpu_owner_scene_g68(&r->owner,&r->g68_city)' in runtime
          assert 'b24_gpu_runtime_sync_model' in runtime
          assert 'b24_runtime_hud_draw' in runtime
          assert 'b24_unified_tick' in gameplay
          assert 'b24_gpu_owner_scene_g68' in scene
          assert 'G68_source_gameplay' not in merger
          assert 'b24_g70_g68_collision_load' in merger
          assert 'b14_world_tick(&world,dt,move_x,move_y,turn,look,ascend)' in merger
          assert 'G68_armor' not in merger
          print('PASS G70 G9/B17/B24 owns input + combat + five suits + 363 animation streams + HUD; G68 supplies city only')
          PY
