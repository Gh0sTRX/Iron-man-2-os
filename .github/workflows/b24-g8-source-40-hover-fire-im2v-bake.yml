name: B24 G8 Bake 40 True Original Hover Direction and Attack IM2V - No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/b24-g8-source-40-hover-fire-im2v-bake.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_only_40:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Confirm authoritative 40 named iOS hover motion states
        run: python3 research/b24_unified/b24_hover_fire_directional_source.py --self-test
      - name: Obtain owner-provided IPA into ephemeral job only
        run: |
          set -euo pipefail
          python3 -m pip install -q numpy scipy gdown
          mkdir -p /tmp/ironman-owner-ipa
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/ironman-owner-ipa/source.ipa
          test "$(wc -c < /tmp/ironman-owner-ipa/source.ipa)" -eq 248613763
      - name: Bake ALL 40 original B13-weighted hover and attack streams
        run: |
          set -euo pipefail
          python3 research/b24_unified/b24_hover_fire_40_original_im2v_bake.py \
            --ipa /tmp/ironman-owner-ipa/source.ipa \
            --out /tmp/b24_g8_original_40_hover
          python3 - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          base=Path('/tmp/b24_g8_original_40_hover')
          m=json.loads((base/'B24_G8_ORIGINAL_40_HOVER_FIRE_MOTION_MANIFEST.json').read_text())
          assert len(m['clips'])==40
          assert len(list(base.glob('*.im2v')))==40
          for row in m['clips']:
              data=(base/row['output']).read_bytes()
              assert struct.unpack_from('<4sIIII',data)==(
                b'IM2V',row['source_original_vertices'],row['frames'],20,row['duration_ms'])
              assert len(data)==20+row['source_original_vertices']*row['frames']*12
              assert hashlib.sha256(data).hexdigest()==row['im2v_sha256']
          print('PASS 40 actual source animations: byte lengths, original timing and SHA256')
          PY
      - name: Upload only derived source motion streams and metadata (NOT A VPK)
        uses: actions/upload-artifact@v4
        with:
          name: B24_G8_2010_Owner_Original_40_Hover_Aim_Attack_IM2V_Source_Only
          path: /tmp/b24_g8_original_40_hover/
          if-no-files-found: error
      - name: Delete private owner original IPA from ephemeral runner
        if: always()
        run: rm -rf /tmp/ironman-owner-ipa /tmp/b24_g8_original_40_hover
