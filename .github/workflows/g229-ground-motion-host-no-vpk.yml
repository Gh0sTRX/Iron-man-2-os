name: G229 Read-Only Ground Motion Window — Host Tests (No VPK)
on:
  push:
    branches:
      - feature/b24-unified-gameplay
    paths:
      - 'research/b24_unified/g227_vita_walk_world_collision_gpu_qa/**'
      - 'research/b24_unified/g229_vita_ground_motion_window/**'
      - '.github/workflows/g229-ground-motion-host-no-vpk.yml'
      - '.github/workflows/g171-2010-source-sculpture-false-wall-ground-walk-G169-full-ARM-NO-VPK.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Required full-game checks precede optional diagnostic delivery
        run: python3 -B research/b24_unified/g229_vita_ground_motion_window/test_g171_optional_diagnostics_order.py
      - name: G228 actual G227 one-frame source classifier regression
        shell: bash
        run: |
          set -euo pipefail
          d=research/b24_unified/g227_vita_walk_world_collision_gpu_qa
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 \
            "$d/test_g227_ground_world_root_qa_C11.c" -lm -o /tmp/test_g228_actual
          /tmp/test_g228_actual
      - name: G229 actual G227 header + 120-frame motion C11 regression
        shell: bash
        run: |
          set -euo pipefail
          d=research/b24_unified/g229_vita_ground_motion_window
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iresearch/b24_unified/g227_vita_walk_world_collision_gpu_qa \
            "$d/test_g229_ground_trajectory_window.c" -lm -o /tmp/test_g229_actual
          /tmp/test_g229_actual
      - name: G229 optional Vita main installer source gate (synthetic fixture only)
        shell: bash
        run: |
          set -euo pipefail
          d=research/b24_unified/g229_vita_ground_motion_window
          python3 -m py_compile "$d/g229_install_window_into_real_vita_main.py" "$d/test_g229_installer.py"
          python3 "$d/test_g229_installer.py"
      - name: Compile and link read-only diagnostic harnesses for Vita ARM (no game or VPK)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            vitasdk/vitasdk@sha256:8227da1b596d981f4513cd9b36bda1e43857f6dae5bcf4312c1cd40167f7d9bb sh -lc '
              set -eu
              arm-vita-eabi-gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 \
                research/b24_unified/g227_vita_walk_world_collision_gpu_qa/test_g227_ground_world_root_qa_C11.c \
                -lm -o /tmp/g227-vita.elf
              arm-vita-eabi-gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 \
                -Iresearch/b24_unified/g227_vita_walk_world_collision_gpu_qa \
                research/b24_unified/g229_vita_ground_motion_window/test_g229_ground_trajectory_window.c \
                -lm -o /tmp/g229-vita.elf
              test -s /tmp/g227-vita.elf
              test -s /tmp/g229-vita.elf
            '
      - name: No hardware or VPK claims
        run: |
          echo "G229 READ-ONLY HOST TESTS and Vita ARM diagnostic harness link; synthetic input, project G227 header. No full game build, ARM test execution, Vita device test or VPK."
