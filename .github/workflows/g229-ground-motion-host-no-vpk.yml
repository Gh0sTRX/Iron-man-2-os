name: G229 Read-Only Ground Motion Window — Host Tests (No VPK)
on:
  push:
    branches:
      - feature/b24-unified-gameplay
    paths:
      - 'research/b24_unified/g229_vita_ground_motion_window/**'
      - '.github/workflows/g229-ground-motion-host-no-vpk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: G228 actual G227 one-frame source classifier regression
        shell: bash
        run: |
          set -euo pipefail
          d=research/b24_unified/g227_vita_walk_world_collision_gpu_qa
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 \
            "$d/test_g227_ground_world_root_qa_C11.c" -lm -o /tmp/test_g228_actual
          /tmp/test_g228_actual
      - name: G229 actual G227 header + 120-frame motion C11 regression
        shell: bash
        run: |
          set -euo pipefail
          d=research/b24_unified/g229_vita_ground_motion_window
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iresearch/b24_unified/g227_vita_walk_world_collision_gpu_qa \
            "$d/test_g229_ground_trajectory_window.c" -lm -o /tmp/test_g229_actual
          /tmp/test_g229_actual
      - name: G229 optional Vita main installer source gate (synthetic fixture only)
        shell: bash
        run: |
          set -euo pipefail
          d=research/b24_unified/g229_vita_ground_motion_window
          python3 -m py_compile "$d/g229_install_window_into_real_vita_main.py" "$d/test_g229_installer.py"
          python3 "$d/test_g229_installer.py"
      - name: No hardware or VPK claims
        run: |
          echo "G229 READ-ONLY HOST TESTS; synthetic input, original project G227 header. No VitaSDK build, no Vita device test and no VPK."
