name: G8 original runtime motion bridge host and Vita ARM strict gate NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/b24-g8-original-motion-runtime-host-gate.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_live_motion:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Strict C11 ASan UBSan dynamic motion selection pose stream continuity
        run: |
          set -euo pipefail
          cd research/b24_unified
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer \
            b24_original_im2v_stream.c b24_hover_pose_blend.c b24_g8_live_original_motion.c \
            test_b24_g8_live_original_motion.c -lm -o /tmp/b24_g8_live_original_test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/b24_g8_live_original_test
      - name: VitaSDK ARMv7 strict C objects only no link and no VPK
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            vitasdk/vitasdk:2026.08 sh -lc '
              set -eu
              for n in b24_original_im2v_stream b24_hover_pose_blend b24_g8_live_original_motion; do
                arm-vita-eabi-gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -c \
                  "research/b24_unified/$n.c" -o "/tmp/$n.o"
                test -s "/tmp/$n.o"
              done
              echo "PASS 3 ARM VitaSDK code objects; no eboot, no link, no VPK"
            '
      - name: Reconstruct G8 current real CPU and GPU gameplay source only
        run: |
          set -euo pipefail
          mkdir -p work
          for zip in source/IronMan2_Vita_GitHub_Ready_CI_R2.zip flight_b4/flight_b4_overlay.zip performance_b5/b5_optimized_renderer.zip skinning_b7/b7_vita_overlay.zip combat_b8/b8_overlay.zip armor_b9/b9_overlay.zip profile_b10/b10_overlay.zip; do unzip -oq "$zip" -d work; done
          cat animation_b13/b13-overlay.part?? >/tmp/b13-overlay.zip
          echo 'ec9b66b9b48ecf223fddd0b33e8c3889027de36be789516e721c9e1cc1fb0c13  /tmp/b13-overlay.zip' | sha256sum -c -
          unzip -oq /tmp/b13-overlay.zip -d work
          unzip -oq third_person_b14/b14_overlay.zip -d work
          unzip -oq mechanics_b15/b15_overlay.zip -d work
          for i in 00 01 02 03 04 05; do cat "combat_b16/b16-overlay.part${i}"; done >/tmp/b16-overlay.zip
          echo 'c6d8393fd0cf5e93302fffe0351319bb9b9a2bc41ff185d021e32163ad39993b  /tmp/b16-overlay.zip' | sha256sum -c -
          unzip -oq /tmp/b16-overlay.zip -d work
          python3 research/b17/apply_b17.py
          python3 research/b24_unified/assemble_b24_modules.py
          python3 research/b24_unified/apply_b24.py
          python3 research/b24_unified/apply_b24_c1.py
          python3 research/b24_unified/apply_b24_c2_fix.py
          python3 research/b24_unified/apply_b24_right_arm_source_only.py
          python3 research/b24_unified/apply_b24_gpu_main_source_only.py
          python3 research/b24_unified/apply_b24_g5_gameplay_source_only.py
          python3 research/b24_unified/apply_b24_g6_controls_source_only.py
          python3 research/b24_unified/apply_b24_g7_original_collisions_source_only.py
          python3 research/b24_unified/apply_b24_g8_original_world_bounds_source_only.py
          python3 research/b24_unified/apply_b24_g8_original_motion_source_only.py
      - name: Verify G8 single tick, original 59 fallback and exact source integration ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('work/src/main.c').read_text()
          c=Path('work/CMakeLists.txt').read_text()
          a=Path('work/animations')
          assert len(list(a.glob('*.im2v')))==59
          assert t.count('b24_g8_motion_tick(')==1
          assert t.count('b24_gpu_runtime_draw(')==1
          assert t.count('b14_world_tick(')==1
          assert t.count('b14_pose_tick_ex(')==1
          assert t.index('b14_pose_tick_ex(')<t.index('b24_g8_motion_tick(')<t.index('b16_apply_attack(&attack,&model,now)')<t.index('b24_gpu_runtime_draw(')
          assert '# G8_HOST_SOURCE_ORIGINAL_304_MOTION_SINGLE_OWNER' in c
          assert 'app0:animations' in t
          assert all((Path('work/b24/b24_unified')/n).is_file() for n in
              ('b24_g8_live_original_motion.c','b24_hover_pose_blend.c','b24_original_im2v_stream.c'))
          print('PASS exact REAL G8 patch: 1 B14 world tick -> 1 original clip stream -> existing B16 right arm -> existing VitaGL, unchanged 59 baseline')
          print('NO IPA, NO NEW ASSETS, NO EXECUTABLE/VPK (new sources need future staged stream files)')
          PY
