name: Iron Man 2 G10 TEST four true armor animation trees + real C1L1 floor + permanent L target
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/b24-gpu-g10-four-armors-immortal-target-real-floor-test.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private sources
        uses: actions/checkout@v4
      - name: Fetch previously verified original 397 source motion bank - never commit owner IPA
        uses: actions/download-artifact@v4
        with:
          name: G8_397_Sourced_Player_Motion_Files_Not_VPK
          run-id: 38607065765
          github-token: ${{ github.token }}
          path: /tmp/g9_verified_owner_motion
      - name: Fetch verified War Machine six IM2K original source weapon bone streams
        uses: actions/download-artifact@v4
        with:
          name: G8_WM_2010_Source_Gun01_04_Keyframes_And_Original_Scene_Parent_Proof
          run-id: 38612044624
          github-token: ${{ github.token }}
          path: /tmp/g9_verified_wm_gun
      - name: Fetch 744 VERIFIED original IronMan clips independently rigged to source MarkIV Stealth and Suitcase
        uses: actions/download-artifact@v4
        with:
          name: G10_All_744_Original_2010_Mark4_Stealth_Suitcase_Animation_IM2V_Source_Not_VPK
          run-id: 38637615568
          github-token: ${{ github.token }}
          path: /tmp/g10_verified_three_suit_744
      - name: Combine known-good viewer and original animation B7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          unzip -oq source/IronMan2_Vita_GitHub_Ready_CI_R2.zip -d work
          unzip -oq flight_b4/flight_b4_overlay.zip -d work
          unzip -oq performance_b5/b5_optimized_renderer.zip -d work
          unzip -oq skinning_b7/b7_vita_overlay.zip -d work
          unzip -oq combat_b8/b8_overlay.zip -d work
          unzip -oq armor_b9/b9_overlay.zip -d work
          unzip -oq profile_b10/b10_overlay.zip -d work
          cat animation_b13/b13-overlay.part?? > /tmp/b13-overlay.zip
          echo 'ec9b66b9b48ecf223fddd0b33e8c3889027de36be789516e721c9e1cc1fb0c13  /tmp/b13-overlay.zip' | sha256sum -c -
          unzip -oq /tmp/b13-overlay.zip -d work
          unzip -oq third_person_b14/b14_overlay.zip -d work
          unzip -oq mechanics_b15/b15_overlay.zip -d work
          for i in 00 01 02 03 04 05; do cat "combat_b16/b16-overlay.part${i}"; done > /tmp/b16-overlay.zip
          echo 'c6d8393fd0cf5e93302fffe0351319bb9b9a2bc41ff185d021e32163ad39993b  /tmp/b16-overlay.zip' | sha256sum -c -
          unzip -oq /tmp/b16-overlay.zip -d work
          python3 research/b17/apply_b17.py
          python3 research/b24_unified/assemble_b24_modules.py
          python3 research/b24_unified/apply_b24.py
          # Authentic original C1L1 geometry: 22,919 original triangles (no demo Mark VI).
          python3 research/b24_unified/build_c1l1_map.py --output work/maps/C1L1_environment.im2map --manifest work/maps/c1l1_map_manifest.json
          python3 research/b24_unified/apply_b24_c1.py
          python3 research/b24_unified/apply_b24_c2_fix.py
          python3 research/b24_unified/apply_b24_right_arm_source_only.py
          python3 -m pip install -q numpy
          # Reuse B17/B24 gameplay+animations. Sole scene+armor+HUD GPU owner.
          python3 research/b24_unified/export_b24_c1_gpu_mesh.py --out work/maps/C1L1_environment.c1g2 --manifest /tmp/C1G2_GPU_MANIFEST.json
          python3 research/b24_unified/recover_c1l1_original_uv.py --out work/maps/C1L1_environment.c1uv --manifest /tmp/C1UV_GPU_MANIFEST.json
          python3 research/b24_unified/recover_c1l1_triangle_materials.py --out work/maps/C1L1_environment.c1ma --manifest /tmp/C1MA_GPU_MANIFEST.json
          python3 research/b24_unified/apply_b24_gpu_main_source_only.py
          # Actual G4 physical Vita report: 60FPS, noninteractive pause and drifting sight.
          python3 research/b24_unified/apply_b24_g5_gameplay_source_only.py
          python3 research/b24_unified/apply_b24_g6_controls_source_only.py
          python3 research/b24_unified/apply_b24_g7_original_collisions_source_only.py
          python3 research/b24_unified/apply_b24_g8_original_world_bounds_source_only.py
          # G9: REAL B14 -> owner original 304 IM2V -> B16 -> ONE VitaGL draw.
          # WM six 2010 rigid-gun streams remain source diagnostic only.
          python3 research/b24_unified/apply_b24_g8_original_motion_source_only.py
          python3 research/b24_unified/apply_b24_g10_ground_visual_source_only.py
          python3 research/b24_unified/apply_b24_g10_practice_target_source_only.py
          python3 research/b24_unified/apply_b24_g10_four_suit_original_motion_source_only.py
          python3 - <<'PY'
          from pathlib import Path
          import json,shutil,struct
          bank=Path('/tmp/g9_verified_owner_motion')
          manifest=json.loads((bank/'G8_PLUS_ORIGINAL_COMPLETE_SOURCE_BANK_MANIFEST.json').read_text())
          assert manifest['counts_by_tier']=={
            'G8_BASELINE_59':59,'ORIGINAL_2010_PLAYER_304':304,
            'UNDERWATER_34_PARTIALLY_SKINNED':34}
          dest=Path('work/animations')
          assert len(list(dest.glob('*.im2v')))==59
          for entry in manifest['clips']:
            if entry['tier']!='ORIGINAL_2010_PLAYER_304':continue
            path=bank/'animations'/entry['asset']
            assert path.is_file() and path.stat().st_size==entry['bytes']
            shutil.copyfile(path,dest/entry['asset'])
          assert len(list(dest.glob('*.im2v')))==363
          original_gun=Path('/tmp/g9_verified_wm_gun/WM_2010_Gun01_04_Original_IM2K')
          original_gun_manifest=json.loads(
            (original_gun/'G8_WM_2010_ORIGINAL_GUN01_04_IM2K_SOURCE_MANIFEST.json').read_text())
          assert len(original_gun_manifest['clips'])==6
          for clip in original_gun_manifest['clips']:
            f=original_gun/clip['output']
            magic,n,frames,fps,duration=struct.unpack_from('<4sIIII',f.read_bytes())
            assert magic==b'IM2K' and n==6 and fps==20
            assert duration==clip['duration_ms'] and frames==clip['frames']
            shutil.copyfile(f,dest/clip['output'])
          assert len(list(dest.glob('*.im2k')))==6
          # Hard requirement: neither partial Underwater suit/34 IM2V nor
          # original owner IPA are distributed in this G9 gameplay candidate.
          assert len(list(dest.glob('uw_original_*.im2v')))==0
          print('PASS G9 intended beta source: G8 59 retained + genuine 304 clips + 6 WM weapon node streams')
          PY
          # G10: all three alternate Iron Man skins baked from their own
          # ORIGINAL 2010 BRES rigs. DO NOT attach 802v Mark VI to 629v suitcase.
          python3 - <<'PY'
          import json,hashlib,shutil,struct
          from pathlib import Path
          root=Path('/tmp/g10_verified_three_suit_744')
          meta=json.loads((root/'G10_MARK4_STEALTH_SUITCASE_ALL_248_ORIGINAL_SKIN_ANIMATIONS.json').read_text())
          dest=Path('work/animations')
          assert len(list(dest.glob('*.im2v')))==363
          vertices={'mark4':802,'stealth':802,'suitcase':629}
          for suit,group in meta['outfits'].items():
              assert group['vertices']==vertices[suit]
              assert group['inverse_bind_error']<2e-4
              assert len(group['records'])==248
              for clip in group['records']:
                  source=root/clip['asset']
                  b=source.read_bytes()
                  magic,n,frames,fps,duration=struct.unpack_from('<4sIIII',b)
                  assert magic==b'IM2V' and n==vertices[suit]
                  assert frames==clip['frames'] and fps==20 and duration==clip['duration_ms']
                  assert len(b)==clip['bytes']
                  assert hashlib.sha256(b).hexdigest()==clip['im2v_sha256']
                  shutil.copyfile(source,dest/clip['asset'])
          assert len(list(dest.glob('*.im2v')))==1107
          assert len(list(dest.glob('*.im2k')))==6
          print('PASS G10 authentic 2010 per-BRES suit reskin 59 baseline+304 owner+744 MarkIV Stealth Suitcase =1107 packaged IM2V-ready streams')
          PY
          python3 research/b24_unified/export_b24_authentic_original_collision.py \
            --out work/maps/C1L1_original_collision.c1wc \
            --manifest /tmp/G7_2010_ORIGINAL_C1WC.json
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          b=Path('work/maps/C1L1_original_collision.c1wc').read_bytes()
          assert struct.unpack_from('<4sIIII',b)==(b'C1WC',1,1908,2,40)
          assert len(b)==76340
          meta=json.loads(Path('/tmp/G7_2010_ORIGINAL_C1WC.json').read_text())
          assert meta['triangles']==1908 and meta['steep_candidates']==1690
          print('PASS G7 authentic original 1908 CPU triangle collision source loaded by B14: independent of GPU')
          PY
          # User-owned original iOS IPA (provided Drive file ID). Original IPA
          # is ephemeral: only the verified 512px C1L1 vehicles texture is
          # included in owner's test VPK; never commit or upload full archive.
          python3 -m pip install -q gdown texture2ddecoder
          mkdir -p /tmp/b24g7-owner
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/b24g7-owner/original.ipa
          test "$(wc -c < /tmp/b24g7-owner/original.ipa)" -eq 248613763
          python3 research/b24_unified/convert_original_ipa_vehicles_c1tx.py \
            --ipa /tmp/b24g7-owner/original.ipa \
            --out work/maps/C1L1_Vehicles.c1tx \
            --manifest /tmp/G7_2010_ORIGINAL_VEHICLES.json
          rm -rf /tmp/b24g7-owner
          python3 - <<'PY'
          import struct
          from pathlib import Path
          b=Path('work/maps/C1L1_Vehicles.c1tx').read_bytes()
          assert len(b)==1048596
          assert struct.unpack_from('<4sIIII',b)==(b'C1TX',1,512,512,0)
          print('PASS G7 REAL original C1L1_Vehicles texture from the user-owned 2010 IPA')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json
          t=Path('work/src/main.c').read_text()
          cm=Path('work/CMakeLists.txt').read_text()
          m=json.loads(Path('/tmp/C1G2_GPU_MANIFEST.json').read_text())
          assert 'b24_gpu_runtime_draw(&b24_gpu_rt,&model,&camera,&b24_game,idx)' in t
          assert 'option(B24_ENABLE_GPU' in cm
          assert (m['vertices'],m['triangles'])==(37946,22919)
          assert Path('work/maps/C1L1_environment.c1uv').stat().st_size==303954
          assert Path('work/maps/C1L1_environment.c1ma').stat().st_size>53000
          print('GPU G2 scene+armor+native HUD+stage pitch bank source and original map UV/material assets present')
          PY
          # Preserve all previous title IDs; GPU G1 installs separately.
          sed -i -e 's/IM2L00011/IM2G00035/g' -e 's/IronMan2_Combat_B16.vpk/IronMan2_GPU_B24_G10_TEST.vpk/g' -e 's/Iron Man 2 - Combat B16/Iron Man 2 - GPU B24 G10 TEST/g' work/CMakeLists.txt
          python3 -m pip install -q numpy
          python3 work/tools/check_assets.py
          python3 - <<'PY'
          from pathlib import Path
          import struct
          base=Path('work/animations')
          files={'mark6_hover':802,'mark6_walk':802,'mark6_land':802,
                 'warmachine_hover':1292,'warmachine_walk':1292,'warmachine_fly':1292}
          for name,nv in files.items():
              b=(base/(name+'.im2v')).read_bytes()
              magic,n,frames,fps,duration=struct.unpack_from('<4s4I',b)
              assert magic==b'IM2V' and n==nv and frames>2 and fps==20
              assert len(b)==20+frames*n*12 and duration>=500
              print(name,'frames',frames,'vertices',n,'duration',duration)
          PY
          # Replace the base link list with a group: SDL2's Vita backends pull
          # in vitaGL / GXM / C++ / mathneon / taiHEN libraries transitively.
          # GNU ld only resolves static references left-to-right unless grouped.
          cat >> work/CMakeLists.txt <<'CMAKE'
          if(DEFINED ENV{VITASDK})
            set_property(TARGET im2_beta PROPERTY LINK_LIBRARIES "")
            set(b7_vita_libs)
            foreach(lib
              SDL2 vitaGL vitashark SceShaccCgExt
              stdc++ mathneon m
              taihen_stub
              SceAppMgr_stub SceAppUtil_stub SceAudio_stub
              SceAudioIn_stub SceAudioOut_stub SceCtrl_stub
              SceCommonDialog_stub SceDisplay_stub SceGxm_stub
              SceShaccCg_stub SceSysmodule_stub ScePower_stub
              SceTouch_stub SceVshBridge_stub SceKernelDmacMgr_stub
              SceMotion_stub SceIme_stub SceMsgDialog_stub SceHid_stub
              SceSharedFb_stub SceGxmInternalForVsh_stub SceLibKernel_stub
              SceLibcBridge_stub SceFios2_stub SceDisplayUser_stub
              )
              if(EXISTS "$ENV{VITASDK}/arm-vita-eabi/lib/lib${lib}.a")
                list(APPEND b7_vita_libs ${lib})
              elseif(NOT lib MATCHES "^Sce" AND NOT lib STREQUAL "taihen_stub")
                message(FATAL_ERROR "Required Vita library not found: ${lib}")
              endif()
            endforeach()
            target_link_libraries(im2_beta "-Wl,--start-group" ${b7_vita_libs} "-Wl,--end-group")
            message(STATUS "B7 grouped Vita libraries: ${b7_vita_libs}")
          endif()
          CMAKE
          python3 - <<'PY'
          import json,struct,hashlib
          from pathlib import Path
          rows=json.loads(Path('work/docs/B13_ANIMATION_MANIFEST.json').read_text())
          assert len(rows)==19
          for e in rows:
              b=(Path('work/animations')/(e['asset']+'.im2v')).read_bytes()
              magic,nv,frames,fps,duration=struct.unpack_from('<4s4I',b)
              assert magic==b'IM2V' and nv==e['vertices'] and frames==e['frames']
              assert fps==20 and duration==e['duration_ms'] and len(b)==20+nv*frames*12
              assert hashlib.sha256(b).hexdigest()==e['sha256']
          print('19 B13 original motion clips validated by digest')
          PY
          python3 - <<'PY'
          import json,hashlib,struct,zipfile
          from pathlib import Path
          manifest=json.loads(Path('work/docs/B15_NEW_MOTION_MANIFEST.json').read_text())
          assert len(manifest)==5
          expected={'mark6_air_move','suitcase_air_move','suitcase_ground_idle','warmachine_ground_idle','warmachine_run_retarget'}
          assert {x['asset'] for x in manifest}==expected
          for entry in manifest:
              b=(Path('work/animations')/(entry['asset']+'.im2v')).read_bytes()
              magic,n,frames,fps,duration=struct.unpack_from('<4s4I',b)
              assert magic==b'IM2V' and n==entry['vertices'] and frames==entry['frames']
              assert duration==entry['duration_ms'] and fps==20
              assert len(b)==20+n*frames*12
              assert hashlib.sha256(b).hexdigest()==entry['sha256']
          print('Verified B15 original-authored five motion streams and hashes')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,struct
          d=json.loads(Path('work/docs/B16_ANIMATION_MANIFEST.json').read_text())
          assert len(d['animations'])==23 and len(d['palm_anchors'])==3
          for e in d['animations']:
              b=(Path('work/animations')/(e['asset']+'.im2v')).read_bytes()
              magic,nv,frames,fps,ms=struct.unpack_from('<4s4I',b)
              assert magic==b'IM2V' and nv==e['vertices'] and frames==e['frames']
              assert ms==e['duration_ms'] and fps==20 and len(b)==20+nv*frames*12
              assert hashlib.sha256(b).hexdigest()==e['sha256']
          for prefix,n in [('mark6',802),('suitcase',629),('warmachine',1292)]:
              raw=(Path('work/animations')/(prefix+'_arm_mask.im2m')).read_bytes()
              magic,verts=struct.unpack_from('<4sI',raw)
              assert magic==b'IM2M' and verts==n and len(raw)==8+n
              assert len(d['palm_anchors'][prefix])==2
          print('B16 verify: 23 authentic-skinned clips and 3 mask files')
          PY
          grep -q IM2G00035 work/CMakeLists.txt
          test -s work/models/suitcase.im2t
      - name: G4 source preflight and robust GPU boot markers
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -DB24_GPU_BOOT_TRACE=1 \
            '-DB24_GPU_TRACE_PATH="/tmp/B24_G3_TRACE_TEST.txt"' \
            research/b24_unified/b24_gpu_boot_trace.c \
            research/b24_unified/test_b24_gpu_boot_trace.c \
            -o /tmp/b24-g3-boot-test
          /tmp/b24-g3-boot-test
          python3 - <<'PY'
          from pathlib import Path
          cb=Path('work/b24/b24_unified/b24_gpu_runtime.c').read_text()
          assert 'r->frame_pose.pitch,r->frame_pose.roll' in cb
          src=Path('work/src/main.c').read_text()
          assert 'b24_gpu_boot_trace_reset' in src
          owner=Path('work/b24/b24_unified/b24_gpu_owner_vitagl.c').read_text()
          assert '(void)vglInit(0x1000000)' in owner
          assert 'if(!vglInit(' not in owner
          assert '32 VITAGL_INIT_RETURNED_NOT_HEALTH_PROOF' in owner
          cm=Path('work/CMakeLists.txt').read_text()
          assert 'B24_ENABLE_GPU_BOOT_TRACE' in cm
          print('PASS G5 source crash triage: real original B24, six-field armor, durable boot markers')
          PY
      - name: Exact upstream vitaGL G3 diagnostic return semantics regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          c=Path('research/b24_unified/b24_gpu_owner_vitagl.c').read_text()
          mock=Path('research/b24_unified/test_b24_gpu_owner_mock.c').read_text()
          assert 'if(!vglInit(' not in c
          assert '(void)vglInit(0x1000000);' in c
          assert 'return GL_FALSE;' in mock, 'Mock must simulate real 960x544 no fallback'
          print('PASS G5: do not treat vglInit GL_FALSE (no resolution fallback) as init failure')
          PY
      - name: Verify G6 natural analog and 14m Z-up real projection source regressions
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            research/b24_unified/b24_gpu_camera.c \
            research/b24_unified/test_b24_gpu_camera.c \
            -lm -o /tmp/b24-g6-shoulder-view
          /tmp/b24-g6-shoulder-view
          python3 - <<'PY'
          from pathlib import Path
          source=Path('work/src/main.c').read_text()
          camera=Path('work/b24/b24_unified/b24_gpu_runtime.c').read_text()
          assert 'int invert_move_x=0;' in source
          assert 'b24_c1_original_collision_resolve(&b24_original_walls' in source
          assert 'b24_c1_original_collision_load(&b24_original_walls' in source
          assert 'B24_G7_GENUINE_CPU_WALLS_SOURCE' in Path('work/CMakeLists.txt').read_text()
          assert 'move_x+=(invert_move_x?-1.0f:1.0f)*deadzone(' in source
          assert 'camera.invert_x=invert_move_x;' in source
          assert 'b24_gpu_camera_apply_shoulder(&cam,rx,ry,1.05f*shoulder)' in camera
          assert '1.f-g->camera_base.shoulder_to_chase' in camera
          assert 'const float cx=240.f,cy=136.f;' in Path('work/b24/b24_unified/b24_gpu_hud_native.c').read_text()
          print('PASS G6 actual compiled B24 natural left-stick X, dynamic left-actor shoulder and fixed HUD crosshair')
          PY
      - name: G8 original C1L1 full movement and flight altitude real host dynamics gate
        run: |
          set -euo pipefail
          cat > /tmp/g8_city_bounds_real.c <<'C'
          #include "b14_world.h"
          #include <assert.h>
          #include <math.h>
          #include <stdio.h>
          int main(void){
            B14World w;
            b14_world_init(&w);
            for(int i=0;i<140;i++) b14_world_tick(&w,.1f,1.f,0.f,0.f,0.f,0.f);
            assert(w.x>21.f); /* Old B14 demo cage had stopped at +20. */
            for(int i=0;i<140;i++) b14_world_tick(&w,.1f,0.f,1.f,0.f,0.f,0.f);
            assert(w.y>21.f);
            w.x=272.99f;
            b14_world_tick(&w,.1f,1.f,0.f,0.f,0.f,0.f);
            assert(w.x<=273.001f);
            w.flying=1;
            for(int i=0;i<250;i++) b14_world_tick(&w,.1f,0.f,0.f,0.f,0.f,1.f);
            assert(w.z>31.f && w.target_z>34.f && w.target_z<=36.001f);
            puts("PASS G8 original world x+y > 20 meters, authentic-boundary clamp and fly > 33.925 source roof height");
            return 0;
          }
          C
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
              -Iwork/src work/src/b14_world.c /tmp/g8_city_bounds_real.c \
              -lm -o /tmp/g8_city_bounds_real
          /tmp/g8_city_bounds_real
          python3 - <<'PY'
          from pathlib import Path
          src=Path("work/src/b14_world.c").read_text()
          assert '-270.f,273.f' in src and '-297.f,191.f' in src
          assert '36.f' in src
          assert '-20,20' not in src
          owner=Path('work/src/main.c').read_text()
          assert 'b24_c1_original_collision_resolve(&b24_original_walls' in owner
          print('PASS G8 original true city boundaries retain independent source BDAE collision and full camera')
          PY
      - name: Genuine 3D armor flight pitch/bank GPU root regression on desktop
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iresearch/b24_unified/mock_gpu -Iresearch/b24_unified \
            research/b24_unified/b24_gpu_suit_vitagl.c \
            research/b24_unified/test_b24_gpu_suit_mock.c \
            -lm -o /tmp/b24-g2-armor-matrix
          /tmp/b24-g2-armor-matrix
          python3 - <<'PY'
          from pathlib import Path
          src=Path('work/b24/b24_unified/b24_gpu_runtime.c').read_text()
          h=Path('work/b24/b24_unified/b24_gpu_suit.h').read_text()
          assert 'g->visual_root.visual_pitch_rad' in src
          assert 'g->visual_root.visual_roll_rad' in src
          assert 'heading,pitch,roll' in h
          print('PASS actual B24 animated original suit ROOT gets stage2/rush pitch+roll; CPU B14 world stays single authority')
          PY
      - name: B24 G6 preserved HUD and interactive pause event regression
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iresearch/b24_unified/mock_gpu -Iresearch/b24_unified \
            -Iwork/src -Iwork/b24/b22_flight -Iwork/b24/b22_camera \
            -Iwork/b24/b21_controls -Iwork/b24/b22_hud \
            -Iwork/b24/b23_missile_lock -Iwork/b24/b22_4_6 \
