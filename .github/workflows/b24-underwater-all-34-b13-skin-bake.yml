name: B24 Underwater Full 34 Original BRES 811 Skin IM2V QA - No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/b24-underwater-all-34-b13-skin-bake.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner_source_inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout vetted inventory tools
        uses: actions/checkout@v4
      - name: Retrieve exactly owner-provided original IPA via share URL into ephemeral runner
        run: |
          set -euo pipefail
          python3 -m pip install -q gdown
          mkdir -p /tmp/ironman-owner-ipa
          cd /tmp/ironman-owner-ipa
          # Only explicit owner-supplied 2026-10-14 exact Drive file ID.
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O source_v1.0.0.ipa
          test "$(wc -c < source_v1.0.0.ipa)" -eq 248613763
          echo "PASS exact owner-supplied original archive length; original archive NEVER uploaded as artifact"
      - name: Verify source 811-weight original 2010 rig animations for ALL 34 underwater character clips
        run: |
          set -euo pipefail
          python3 -m pip install -q numpy scipy
          python3 research/b24_unified/b24_underwater_source_34_im2v_bake.py \
            --ipa /tmp/ironman-owner-ipa/source_v1.0.0.ipa \
            --out /tmp/b24_underwater_34_original_skinned_frames \
            --manifest /tmp/b24_underwater_b13_34_motion_manifest.json
          python3 - <<'PY'
          import json,hashlib,struct,numpy as np
          from pathlib import Path
          d=json.loads(Path('/tmp/b24_underwater_b13_34_motion_manifest.json').read_text())
          assert len(d['source_motion_clips'])==34
          assert d['skinned_vertices']==811 and d['static_unbound_auxiliary_vertices']==29
          assert d['verified_rest_bind_error']<2e-4
          for x in d['source_motion_clips']:
              path=Path('/tmp/b24_underwater_34_original_skinned_frames')/x['im2v']
              b=path.read_bytes()
              assert struct.unpack_from('<4sIIII',b)==(b'IM2V',840,x['frames'],20,x['duration_ms'])
              assert len(b)==20+840*x['frames']*12
              assert hashlib.sha256(b).hexdigest()==x['im2v_sha256']
          print('PASS 34 real user-owned original Underwater 840vertex streamed IM2V frames (811 skinned, 29 UNBOUND). No game runtime/Vita FPS claim')
          PY
      - name: Clean private original owner assets from build runner
        if: always()
        run: rm -rf /tmp/ironman-owner-ipa /tmp/b24_underwater_34_original_skinned_frames
