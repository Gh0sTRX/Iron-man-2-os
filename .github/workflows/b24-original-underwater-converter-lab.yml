name: B24 Underwater Original Armor Conversion Readiness - No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/b24-original-underwater-converter-lab.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner_source_inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout vetted inventory tools
        uses: actions/checkout@v4
      - name: Retrieve exactly owner-provided original IPA via share URL into ephemeral runner
        run: |
          set -euo pipefail
          python3 -m pip install -q gdown
          mkdir -p /tmp/ironman-owner-ipa
          cd /tmp/ironman-owner-ipa
          # Only explicit owner-supplied 2026-10-14 exact Drive file ID.
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O source_v1.0.0.ipa
          test "$(wc -c < source_v1.0.0.ipa)" -eq 248613763
          echo "PASS exact owner-supplied original archive length; original archive NEVER uploaded as artifact"
      - name: Verify exact underwater, real original animation and B9 Vita conversion toolchain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,sys,hashlib
          sys.path.insert(0,"research/b24_unified")
          from b24_owner_pack_extract import decode,get_exact
          with zipfile.ZipFile('/tmp/ironman-owner-ipa/source_v1.0.0.ipa') as z:
              source={name:z.read('Payload/IronMan2.app/'+name) for name in ('models','textures','anims')}
          pack={key:decode(blob,'.bdae' if key=='models' else '.tga' if key=='textures' else '.anim')
                for key,blob in source.items()}
          for kind,entries in pack.items():
              print('VALIDATED_SOURCE_PACK',kind,len(entries))
          for kind,pattern in (('models','UnderWater'),('textures','UnderWater'),('anims','Underwater')):
              candidates=[r.name for r in pack[kind] if pattern.casefold() in r.name.casefold()]
              print('ORIGINAL_UNDERWATER',kind,len(candidates),candidates[:65])
          names=('LC_MC_UnderWater.bdae','MC_UnderWater.tga','body_reflection_UnderWater.tga')
          for key,name in zip(('models','textures','textures'),names):
              b=get_exact(source[key],pack[key],name)
              magic=b[:4].hex()
              print('ORIGINAL_AUTHENTIC_ASSET',name,'bytes',len(b),'magic',magic,
                    'sha256',hashlib.sha256(b).hexdigest())
          anim_names=[r.name for r in pack['anims'] if r.name.startswith('Underwater_')]
          assert len(anim_names)>10
          for name in anim_names[:5]:
              b=get_exact(source['anims'],pack['anims'],name)
              print('ORIGINAL_PLAYER_ANIMATION',name,len(b))
          with zipfile.ZipFile('armor_b9/b9_overlay.zip') as z:
              names=z.namelist()
              print('B9_CONVERTER_FILES',[x for x in names if x.endswith('.py')][:55])
          print('PASS real original underwater source model, tex and usable anim name records proven, no Vita game release')
          PY
      - name: Clean original source
        if: always()
        run: rm -rf /tmp/ironman-owner-ipa
