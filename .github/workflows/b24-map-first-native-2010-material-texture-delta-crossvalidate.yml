name: MAP FIRST Original C1L1 native material+TGA cross-file delta and unsafe ordinal mapping discovery NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/b24-map-first-native-2010-material-texture-delta-crossvalidate.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_original_author_constraints:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compare authentic original 2010 texture and shader dictionary differences across all 10 BRES
        run: |
          python3 research/b24_unified/b24_map_first_authored_pairwise_material_texture_delta.py \
            --out /tmp/C1L1_SOURCE_2010_CROSS_MODEL_AUTHORED_MATERIAL_TEXTURE_CONSTRAINTS.json
      - name: Reject unverified material ordinal-to-TGA assumptions and assert actual pair files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/C1L1_SOURCE_2010_CROSS_MODEL_AUTHORED_MATERIAL_TEXTURE_CONSTRAINTS.json').read_text())
          assert d['source_2010_original_BRES_model_count']==10
          assert len(d['comparisons']['urban_sources'])==6
          assert d['not_a_valid_final_diffuse_material_map']
          print('PASS original 2010 four city BRES subsource cross-file relationships analyzed. Original material→PVR authority still required, no VPK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MAP_FIRST_2010_C1L1_BRES_Original_Material_SourceAtlas_Crossfile_Constraints
          path: /tmp/C1L1_SOURCE_2010_CROSS_MODEL_AUTHORED_MATERIAL_TEXTURE_CONSTRAINTS.json
          if-no-files-found: error
