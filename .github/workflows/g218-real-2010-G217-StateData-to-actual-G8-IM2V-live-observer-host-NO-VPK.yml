name: G218 original 2010 G217 776 StateData connected to actual loaded G8 IM2V single animator source NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g218-real-2010-G217-StateData-to-actual-G8-IM2V-live-observer-host-NO-VPK.yml"
      - "research/b24_unified/g218_source_live_state_bridge/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  true_original_2010_loaded_G8_to_StateData_C11_host:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Source original 2010 G218 live main integration syntax and original C11 diagnostics
        run: |
          set -euo pipefail
          python3 -m py_compile research/b24_unified/g218_source_live_state_bridge/g218_attach_G217_native_source_state_to_REAL_G8_animation_owner_NO_VPK.py
      - uses: actions/download-artifact@v4
        with:
          name: G217_ORIGINAL_2010_4_SUITS_776_MOVEMENT_ATTACK_STATES_C11_SOURCE_PNG_NO_VPK
          run-id: 39135629451
          github-token: ${{ github.token }}
          path: /tmp/g218_verified_2010_owner_authored
      - name: Exact source original G217 all 4 suits 194 native StateData x genuine loaded G8/G169 clips to original raw track markers, C11 host
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -I/tmp/g218_verified_2010_owner_authored \
            -Iresearch/b24_unified/g218_source_live_state_bridge \
            -Iresearch/b24_unified/g197_source2010_attack_dispatch \
            research/b24_unified/g218_source_live_state_bridge/test_g218_exact_original_2010_loaded_G8_to_G217_StateData_host.c \
            -o /tmp/g218_real_2010_source_data_bridge
          /tmp/g218_real_2010_source_data_bridge
      - name: G305 ensure original native ARM G197 dispatch table is present and source-only observer copied safely
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('research/b24_unified/g218_source_live_state_bridge/g218_attach_G217_native_source_state_to_REAL_G8_animation_owner_NO_VPK.py').read_text()
          h=Path('research/b24_unified/g218_source_live_state_bridge/b24_g218_live_authentic_2010_state_observer.h').read_text()
          assert 'shutil.copyfile(ORIGINAL_ARM_DISPATCH,D/ORIGINAL_ARM_DISPATCH_HEADER)' in p
          assert 'b24_g197_original_source_attack_entry' in h
          assert 'if(newly_loaded_clip)++obs->native_raw_attack_event_rows_observed;' in h
          assert not list(Path('.').rglob('*.vpk'))
          print('G305 original G197 authenticated ARM dispatch read-only, G8 event log deduplicated per source clip edge, no VPK')
          PY
      - name: Verify G218 source observer is passive, never creates second physics or combat event or Vita VPK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('research/b24_unified/g218_source_live_state_bridge/b24_g218_live_authentic_2010_state_observer.h').read_text()
          patch=Path('research/b24_unified/g218_source_live_state_bridge/g218_attach_G217_native_source_state_to_REAL_G8_animation_owner_NO_VPK.py').read_text()
          assert s.count('b24_g218_observe_actually_loaded_G8_clip(')==1
          assert 'actual_2010_melee_hit_or_projectile_event_PROVEN=0;' in s
          assert 'actual_2010_StateMgr_runtime_state_PROVEN=0;' in s
          assert patch.count('b24_g218_observe_actually_loaded_G8_clip(')>=1
          assert 'b24_original_motion.selected' in patch
          assert 'b24_original_motion.active' in patch
          assert 'b24_original_motion.missing' in patch
          assert 'b14_world_tick(&world,dt,move_x,move_y,turn,look,ascend)' in patch
          assert 'B24_G218_SOURCE_STATE_OBSERVER' in patch
          assert not list(Path('.').rglob('*.vpk'))
          print('G218 original StateData bound only to real G8 source loaded clip and not a made-up 2010 input selection or damage event; no VPK')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: G218_SOURCE_2010_G217_ACTUAL_G8_LOADED_IM2V_STATE_OBSERVER_HOST_NO_VPK
          path: research/b24_unified/g218_source_live_state_bridge/
          retention-days: 21
          if-no-files-found: error
