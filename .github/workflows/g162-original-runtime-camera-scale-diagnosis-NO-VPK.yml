      - "research/b24_unified/g142_original_2010_native_sound_id_semantics/**"
      - "research/b24_unified/g144_original_level1_real_pcm_channels/**"
      - "research/b24_unified/g145_full_B24_source_audio_g137/**"
      - "research/b24_unified/g146_QTE_original_level1_scene/**"
      - "research/b24_unified/g147_genuine_2010_tutorial_ui_gate/**"
