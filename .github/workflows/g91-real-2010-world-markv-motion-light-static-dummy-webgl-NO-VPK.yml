name: G91 GENUINE 2010 BRES PVR MARKV IM2V LIGHT AND STATIC DUMMY OFFLINE HTML NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g91-real-2010-world-markv-motion-light-static-dummy-webgl-NO-VPK.yml"
      - "research/b24_unified/g91_offline_integrated_preview/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_source_g91_host_stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install original source host stream decoder dependencies
        run: python3 -m pip install -q numpy pillow gdown texture2ddecoder
      - name: Recover real G58 already verified original BRES PVR sun host HTML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g91/g58 /tmp/g91/out
          ID="$(gh run list -w g58a-original-bres-pvr-host-lighting.yml -b feature/b24-unified-gameplay -L 15 --json databaseId,conclusion --jq '[.[] | select(.conclusion=="success")][0].databaseId')"
          test -n "$ID" && test "$ID" != "null"
          echo "G91 verified original G58 run $ID"
          gh run download "$ID" --repo "${{ github.repository }}" \
            -n G58A_2010_NATIVE_C1L1_G55_PVR_UV_HOST_DAY_EVENING_LIGHTING_NO_VPK \
            -D /tmp/g91/g58
          test -s /tmp/g91/g58/G58A_ORIGINAL_C1L1_BRES_PVR_DAY_EVENING_HTML.html
      - name: Restore all actual 248 original iOS Mark V 629v IM2V source clips
        uses: actions/download-artifact@v4
        with:
          name: G85_2010_ORIGINAL_SUITCASE_MARKV_248_FULL_SOURCE_IM2V_NO_VPK
          run-id: 38949763439
          github-token: ${{ github.token }}
          path: /tmp/g91/g85
      - name: Fetch private owner original iOS IPA transiently for Mark V TRUE mesh face topology
        run: |
          set -euo pipefail
          mkdir -p /tmp/g91/private
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g91/private/original.ipa ||
           gdown '131--LA4lrPKxpieS6LFKftIpkMY8YWsA' -O /tmp/g91/private/original.ipa
          test "$(wc -c </tmp/g91/private/original.ipa)" -eq 248613763
      - name: Execute REAL C G83 source movement flight and aim routes on host
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -I research/b24_unified \
            research/b24_unified/b24_g8_melee_source_chain.c \
            research/b24_unified/g76_original_combat/b24_g76_original_native_damage_math.c \
            research/b24_unified/g77_original_weapon_db/b24_g77_melee_source_radius.c \
            research/b24_unified/g82_original_combat/b24_g82_original_combat_coordinator.c \
            research/b24_unified/g83_full_motion_aim/b24_g83_unified_movement_aim.c \
            research/b24_unified/g91_offline_integrated_preview/g91_export_real_g83_host_routes.c \
            -lm -o /tmp/g91_source_G83_route_export
          /tmp/g91_source_G83_route_export > /tmp/g91/out/G91_ACTUAL_C_G83_SOURCE_ROUTING.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/g91/out/G91_ACTUAL_C_G83_SOURCE_ROUTING.json').read_text())
          assert j['G83_selector_called_from_original_C'] is True
          assert len(j['source_routes'])==40
          assert j['NO_VPK'] is True
          print('PASS actual C11 source G83 movement/flight/aim 40 route query combinations')
          PY
      - name: Build real original BRES plus PVR and Mark V source pose plus light plus static dummy
        run: |
          set -euo pipefail
          python3 research/b24_unified/g91_offline_integrated_preview/g91_build_genuine_markv_world_host_viewer.py \
            --g58-html /tmp/g91/g58/G58A_ORIGINAL_C1L1_BRES_PVR_DAY_EVENING_HTML.html \
            --ipa /tmp/g91/private/original.ipa \
            --anims /tmp/g91/g85/g85_real_markv_animations \
            --routes /tmp/g91/out/G91_ACTUAL_C_G83_SOURCE_ROUTING.json \
            --out /tmp/g91/out/G91_ACTUAL_2010_SOURCE_MARKV_MOVEMENT_COMBAT_LIGHT_STATIC_DUMMY_OFFLINE.html \
            --report /tmp/g91/out/G91_ACTUAL_SOURCE_FIDELITY_HOST_QA.json
      - name: Original source 2010 accuracy trust boundary and JS static QA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('/tmp/g91/out')
          j=json.loads((root/'G91_ACTUAL_SOURCE_FIDELITY_HOST_QA.json').read_text())
          assert j['original_owner_C1L1_source_BRES_triangles']==22441
          assert j['original_owner_C1L1_parented_meshes']==296
          assert j['original_owner_PVR_diffuse_atlases']==24
          assert j['MarkV_authentic_2010_weighted_skin_vertices']==629
          assert j['MarkV_authentic_original_source_triangles']>100
          assert j['original_MarkV_atlas_MCSuitCase_PVR_512x512'] is True
          assert j['original_MarkV_629_vertex_authored_uv_used'] is True
          assert j['MarkV_original_2010_20hz_clips_renderable']>=14
          assert j['real_G83_C_router_directly_used']
          assert j['practice_dummy_static_infinite_health']
          assert not j['2010_attack_hitframes_and_damage_known']
          assert not j['VPK_generated']
          txt=(root/'G91_ACTUAL_2010_SOURCE_MARKV_MOVEMENT_COMBAT_LIGHT_STATIC_DUMMY_OFFLINE.html').read_text()
          assert len(txt)>4500000
          assert txt.count('id="g91overlay"')==1
          m=re.search(r'<script>\s*"use strict";(.*?)</script>',txt,re.S)
          assert m
          (root/'g91_source_viewer_syntax.js').write_text('"use strict";'+m.group(1))
          print('PASS G91 original C1L1+MarkV source and no fake original 2010 damage evidence')
          PY
          node --check /tmp/g91/out/g91_source_viewer_syntax.js
          test -z "$(find . /tmp/g91/out -type f -name '*.vpk' -print -quit)"
      - name: Actually run original 2010 source WebGL2 city PVR sun and MarkV 629 rig in headless Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable)"
          echo "Source WEBGL2 diagnostic in actual browser: $CHROME"
          npm install -s --no-audit --no-fund --prefix /tmp/g91/browser playwright-core@1.56.1
          G91_CHROME="$CHROME" node research/b24_unified/g91_offline_integrated_preview/g91_browser_render_smoke.cjs \
            /tmp/g91/out/G91_ACTUAL_2010_SOURCE_MARKV_MOVEMENT_COMBAT_LIGHT_STATIC_DUMMY_OFFLINE.html \
            /tmp/g91/out/G91C_REAL_OWNER_SOURCE_WEBGL2_RUNTIME_SCREENSHOT_HOST_NOT_VITA.png
          test -s /tmp/g91/out/G91C_REAL_OWNER_SOURCE_WEBGL2_RUNTIME_SCREENSHOT_HOST_NOT_VITA.png
      - name: Securely delete full private original iOS IPA and extracted full Mark V bank
        if: always()
        run: rm -rf /tmp/g91/private /tmp/g91/g85
      - name: Upload downloadable standalone genuine 2010 source world WebGL with dummy NO VPK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: G91_2010_REAL_STARK_EXPO_MARKV_MOVEMENT_COMBAT_SUN_STATIC_DUMMY_BROWSER_PREVIEW_NO_VPK
          path: |
            /tmp/g91/out/G91_ACTUAL_2010_SOURCE_MARKV_MOVEMENT_COMBAT_LIGHT_STATIC_DUMMY_OFFLINE.html
            /tmp/g91/out/G91_ACTUAL_SOURCE_FIDELITY_HOST_QA.json
            /tmp/g91/out/G91_ACTUAL_C_G83_SOURCE_ROUTING.json
            /tmp/g91/out/G91C_REAL_OWNER_SOURCE_WEBGL2_RUNTIME_SCREENSHOT_HOST_NOT_VITA.png
          if-no-files-found: error
          retention-days: 14
