name: G112 REAL ORIGINAL Iron Man 2 2010 iOS touchHLE GDB Native Combat Runtime NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g112-original-iron-man-2-2010-touchhle-linux-GDB-source-capture-NO-VPK.yml"
      - "research/b24_unified/g112_real_touchhle_gameplay_trace/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual_2010_game_under_original_ios_arm_touchhle_GDB_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_GL_VERSION_OVERRIDE: "2.1"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Preflight original touchHLE tracing Python syntax and pure script source BEFORE huge owner IPA or emulator downloads
        run: |
          set -euo pipefail
          python3 -m py_compile research/b24_unified/g112_real_touchhle_gameplay_trace/g112_run_2010_real_game_touchhle_gdb.py
          test -z "$(find . -name '*.vpk' -print -quit)"
      - name: Install actual ARM-v6 GDB remote debugger, virtual screen and screenshot tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb-multiarch xvfb scrot libgl1-mesa-dri libasound2t64 libfuse2t64
          python3 -m pip install -q gdown
      - name: Fetch external OPEN SOURCE touchHLE v0.3.0 Linux 64 bit AppImage
        run: |
          set -euo pipefail
          mkdir -p /tmp/g112_real_tools
          curl --fail --location --retry 4 \
            'https://github.com/pkgforge-dev/TouchHLE-AppImage/releases/download/v0.3.0%402026-10-01_1790876273/touchHLE-v0.3.0-anylinux-x86_64.AppImage' \
            -o /tmp/g112_real_tools/touchHLE.AppImage
          test "$(wc -c </tmp/g112_real_tools/touchHLE.AppImage)" -eq 32703718
          chmod +x /tmp/g112_real_tools/touchHLE.AppImage
          file /tmp/g112_real_tools/touchHLE.AppImage
      - name: Download user-provided decrypted original 2010 Iron Man 2 IPA into EPHEMERAL runner only
        run: |
          set -euo pipefail
          mkdir -p /tmp/g112_original_PRIVATE
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g112_original_PRIVATE/owner.ipa ||
             gdown '131--LA4lrPKxpieS6LFKftIpkMY8YWsA' -O /tmp/g112_original_PRIVATE/owner.ipa
          test "$(wc -c </tmp/g112_original_PRIVATE/owner.ipa)" -eq 248613763
          mkdir -p /tmp/g112_original_PRIVATE/real_app
          unzip -q /tmp/g112_original_PRIVATE/owner.ipa 'Payload/IronMan2.app/*' -d /tmp/g112_original_PRIVATE/real_app
          test -s /tmp/g112_original_PRIVATE/real_app/Payload/IronMan2.app/IronMan2
          test -s /tmp/g112_original_PRIVATE/real_app/Payload/IronMan2.app/Info.plist
      - name: Execute original 2010 native game in touchHLE GDB and record source combat function callbacks
        run: |
          set -euo pipefail
          mkdir -p /tmp/g112_public_report
          timeout 115s xvfb-run -a -s '-screen 0 1280x768x24' \
            python3 research/b24_unified/g112_real_touchhle_gameplay_trace/g112_run_2010_real_game_touchhle_gdb.py \
            --app /tmp/g112_original_PRIVATE/real_app/Payload/IronMan2.app \
            --touchhle /tmp/g112_real_tools/touchHLE.AppImage \
            --out /tmp/g112_public_report --seconds 45
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/g112_public_report/G112_REAL_2010_GAME_TOUCHHLE_BRK_RESULT_NO_VPK.json')
          q=json.loads(p.read_text())
          assert q['VPK_generated'] is False
          assert not q['original_ARM_binary_ever_published']
          print('G112 truthful real original game ARM emulator result',q)
          PY
      - name: Ensure original owned IPA and decrypted executable never leave ephemeral GitHub runner
        if: always()
        run: |
          rm -rf /tmp/g112_original_PRIVATE
          test -z "$(find . -type f -name '*.vpk' -print -quit)"
      - name: Share only original game dynamic ARM source register callbacks and host diagnostic screenshots NO IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G112_2010_TOUCHHLE_REAL_ORIGINAL_GAME_ARM_GDB_COMBAT_TRACE_NO_VPK_NO_IPA
          path: |
            /tmp/g112_public_report/G112_REAL_2010_GAME_TOUCHHLE_BRK_RESULT_NO_VPK.json
            /tmp/g112_public_report/G112_REAL_ORIGINAL_TOUCHHLE_HOST_LOG.txt
            /tmp/g112_public_report/G112_REAL_ORIGINAL_ARM_GDB_NATIVE_FUNCTION_CALLS.txt
            /tmp/g112_public_report/G112_REAL_2010_GDB_HOST_PROCESS_STATUS.txt
            /tmp/g112_public_report/G112_touchHLE_host_real_game_T*.png
            /tmp/g112_public_report/G112_touchHLE_host_final.png
          retention-days: 14
          if-no-files-found: warn
