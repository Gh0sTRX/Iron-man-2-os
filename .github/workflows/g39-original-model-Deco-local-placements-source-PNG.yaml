name: G39 2010 original 53 Deco native source model triangles and actual authored local scene positions PNG NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g39-original-model-Deco-local-placements-source-PNG.yaml"
      - "research/b24_unified/b24_g39_original_C1L1_53_Deco_authentic_meshes_local_placement_map.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_source_model_and_actor_geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Authentic original mesh reader requirements
        run: python3 -m pip install -q numpy pillow gdown
      - name: Owner original IPA temporary, private source
        run: |
          mkdir -p /tmp/g39
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g39/owner.ipa
          test "$(wc -c </tmp/g39/owner.ipa)" -eq 248613763
      - name: Decode exact native BRES model geometry in Deco and original 0x005C authored local poses
        run: |
          python3 research/b24_unified/b24_g39_original_C1L1_53_Deco_authentic_meshes_local_placement_map.py --ipa /tmp/g39/owner.ipa --out /tmp/g39/G39_ORIGINAL_DECO_NATIVE_MODEL_PLACEMENT_PROOF.json --png /tmp/g39/G39_ORIGINAL_C1L1_53_DECO_MODEL_PLACEMENT_SOURCE_PREVIEW.png
      - name: Verify genuine 2010 source geometry, no invented model or world parent
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/g39/G39_ORIGINAL_DECO_NATIVE_MODEL_PLACEMENT_PROOF.json').read_text())
          assert d['native_2010_original_model_pack_count']==207
          assert d['original_CLARA_Deco_model_bindings']==53
          assert d['original_distinct_model_resources_used_in_Deco']==25
          assert d['source_original_2010_BRES_370_environment_meshes']==370
          assert d['source_original_2010_BRES_22919_environment_faces']==22919
          assert d['unproven_real_game_parent_scene_root_camera_shader']
          assert d['no_VPK_no_performance_changes']
          assert Path('/tmp/g39/G39_ORIGINAL_C1L1_53_DECO_MODEL_PLACEMENT_SOURCE_PREVIEW.png').stat().st_size>10000
          print('PASS source original 2010 BDAE actor mesh and actual level1 CLARA pose composite, not full world, no VPK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G39_ORIGINAL_2010_DECO_53_NATIVE_BRES_MODELS_LOCAL_XYZ_GEOMETRY_MAP_PNG_NO_VPK
          path: |
            /tmp/g39/G39_ORIGINAL_DECO_NATIVE_MODEL_PLACEMENT_PROOF.json
            /tmp/g39/G39_ORIGINAL_C1L1_53_DECO_MODEL_PLACEMENT_SOURCE_PREVIEW.png
          if-no-files-found: error
          retention-days: 14
      - name: Remove original owner IPA
        if: always()
        run: rm -rf /tmp/g39/owner.ipa
