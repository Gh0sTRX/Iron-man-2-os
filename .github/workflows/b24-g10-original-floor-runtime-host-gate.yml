name: G12 original 2010 C1L1 source atlas vitaGL 94 material shader strict ARM regression QA NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/b24-g10-original-floor-runtime-host-gate.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact B14 B16 G9 native CPU/GPU render source without owner IPA or Vita package
        run: |
          set -euo pipefail
          mkdir -p work
          for zip in source/IronMan2_Vita_GitHub_Ready_CI_R2.zip flight_b4/flight_b4_overlay.zip performance_b5/b5_optimized_renderer.zip skinning_b7/b7_vita_overlay.zip combat_b8/b8_overlay.zip armor_b9/b9_overlay.zip profile_b10/b10_overlay.zip; do unzip -oq "$zip" -d work; done
          cat animation_b13/b13-overlay.part?? >/tmp/b13-overlay.zip
          echo 'ec9b66b9b48ecf223fddd0b33e8c3889027de36be789516e721c9e1cc1fb0c13  /tmp/b13-overlay.zip' | sha256sum -c -
          unzip -oq /tmp/b13-overlay.zip -d work
          unzip -oq third_person_b14/b14_overlay.zip -d work
          unzip -oq mechanics_b15/b15_overlay.zip -d work
          for i in 00 01 02 03 04 05; do cat "combat_b16/b16-overlay.part${i}"; done >/tmp/b16-overlay.zip
          echo 'c6d8393fd0cf5e93302fffe0351319bb9b9a2bc41ff185d021e32163ad39993b  /tmp/b16-overlay.zip' | sha256sum -c -
          unzip -oq /tmp/b16-overlay.zip -d work
          python3 research/b17/apply_b17.py
          python3 research/b24_unified/assemble_b24_modules.py
          python3 research/b24_unified/apply_b24.py
          python3 research/b24_unified/apply_b24_c1.py
          python3 research/b24_unified/apply_b24_c2_fix.py
          python3 research/b24_unified/apply_b24_right_arm_source_only.py
          python3 research/b24_unified/apply_b24_gpu_main_source_only.py
          python3 research/b24_unified/apply_b24_g5_gameplay_source_only.py
          python3 research/b24_unified/apply_b24_g6_controls_source_only.py
          python3 research/b24_unified/apply_b24_g7_original_collisions_source_only.py
          python3 research/b24_unified/apply_b24_g8_original_world_bounds_source_only.py
          python3 research/b24_unified/apply_b24_g8_original_motion_source_only.py
          python3 research/b24_unified/apply_b24_g10_ground_visual_source_only.py
          python3 research/b24_unified/apply_b24_g10_practice_target_source_only.py
          python3 research/b24_unified/apply_b24_g10_four_suit_original_motion_source_only.py
          python3 research/b24_unified/apply_b24_g11_combat_policy_source_only.py
          python3 research/b24_unified/apply_b24_g11_camera_combat_focus_source_only.py
          python3 research/b24_unified/apply_b24_g11_authentic_unibeam_and_hover_idle_source_only.py
          python3 research/b24_unified/apply_b24_g11_practice_hit_feedback_source_only.py
          python3 research/b24_unified/apply_b24_g11_wm_reset_weapon_on_suit_source_only.py
          python3 research/b24_unified/apply_b24_map_first_original_material_batch_runtime_source_only.py
          python3 research/b24_unified/apply_b24_g12_true_2010_original_C1L1_diffuse_vitagl_source_only.py
          python3 - <<'PY'
          from pathlib import Path
          c=Path('work/b24/b24_unified/b24_gpu_runtime.c').read_text()
          main=Path('work/src/main.c').read_text()
          cm=Path('work/CMakeLists.txt').read_text()
          assert c.count('b24_g10_foot_visual_source_offset(')==1
          assert 'b24_g10_practice_target_draw(&r->practice_target)' in c
          assert 'b24_g10_practice_target.c' in cm
          assert 'B24_G10_PRACTICE_LOCK=1' in cm
          assert 'B24_G10_PRACTICE_TARGET_ID' in main
          assert c.count('cam.eye.z+=g10_original_foot_dz;')==1
          assert c.count('cam.target.z+=g10_original_foot_dz;')==1
          assert 'c->player_z+g10_original_foot_dz' in c
          assert 'b24_c1_true_source_floor.c' in cm
          assert 'b24_g10_original_foot_contact.c' in cm
          assert 'b24_c1_original_collision_resolve(&b24_original_walls' in main
          assert 'b24_g8_motion_tick(' in main
          source=Path('work/b24/b24_unified/b24_g8_live_original_motion.c').read_text()
          assert 'g10_alt_iron_source_name' in source
          assert 'suit==4&&nv!=629u' in source
          assert 'b24_wm_rigid_sync_tick(' in main
          assert main.count('b24_gpu_runtime_draw(')==1
          print('PASS G10 true C1L1 visual face-ground contact in real G9 GPU world/armor transform; original G9 combat unchanged')
          PY
      - name: Compile & run strict host original armor sole to actual B11 ground support test
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iwork/src -Iwork/b24/b24_unified \
            research/b24_unified/b24_c1_true_source_floor.c \
            research/b24_unified/b24_g10_original_foot_contact.c \
            research/b24_unified/test_b24_g10_original_foot_contact.c \
            -lm -o /tmp/g10_source_real_suit_foot_sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/g10_source_real_suit_foot_sanitized
      - name: G10 original 2010 four suits actual streaming C selection host test (no synthetic source retarget)
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iwork/b24/b24_unified \
            research/b24_unified/test_b24_g10_four_suit_original_motion.c \
            work/b24/b24_unified/b24_g8_live_original_motion.c \
            work/b24/b24_unified/b24_g8_melee_source_chain.c \
            work/b24/b24_unified/b24_original_im2v_stream.c \
            work/b24/b24_unified/b24_hover_pose_blend.c \
            work/b24/b24_unified/b24_g11_original_unibeam_sequence.c \
            -lm -o /tmp/g10_four_author_original_armor_route
          /tmp/g10_four_author_original_armor_route
      - name: G10 physical centered target lock on nonmissile weapon and authored C1L1 height C sanitizer gate
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            research/b24_unified/b24_g10_practice_target.c \
            research/b24_unified/test_b24_g10_practice_target.c \
            -lm -o /tmp/g10_practice_target_host
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/g10_practice_target_host
          python3 - <<'PY'
          from pathlib import Path
          main=Path('work/src/main.c').read_text()
          target=Path('work/b24/b24_unified/b24_gpu_runtime.c').read_text()
          lock=Path('work/b24/b23_missile_lock/b23_missile_lock.c').read_text()
          hud=Path('work/b24/b24_unified/b24_gpu_hud_native.c').read_text()
          assert main.count('b24_obs.target_id=B24_G10_PRACTICE_TARGET_ID')==1
          assert 'b24_g10_practice_target_draw(&r->practice_target)' in target
          assert 'b24_c1_true_floor_at(&r->city,0.f,10.f' in target
          assert 'B24_G10_PRACTICE_TARGET_ID' in lock
          assert 'B24_G10_PRACTICE_TARGET_ID' in hud
          print('PASS G10 actual original scene 3D practice actor connected to real B23 L-held lock on any selected weapon; no HP loss')
          PY
      - name: Check fixed sprint and repulsor state policy with real G10 B14 B16 source
        run: |
          set -eu
          cc -std=c11 -O1 -Wall -Wextra -Werror -pedantic research/b24_unified/b24_g11_combat_stage_policy.c research/b24_unified/test_b24_g11_combat_stage_policy.c -lm -o /tmp/g11_fire_stage_host
          /tmp/g11_fire_stage_host
          grep -q 'b24_g11_stage_allows_hand_attack(world.flying,world.flight_stage)' work/src/main.c
          grep -q 'ground_run=b24_gate.is_ground_running' work/src/main.c
          grep -q 'b24_g11_combat_stage_policy.c' work/CMakeLists.txt
          echo "PASS patched G10 B14/B16 real source and stage R rules no VPK"
      - name: Check true G11 target-camera orbit and manual stick controller in host unit C11
        run: |
          set -eu
          cc -std=c11 -O1 -Wall -Wextra -Werror -pedantic research/b24_unified/b24_g11_target_camera_follow.c research/b24_unified/test_b24_g11_target_camera_follow.c -lm -o /tmp/g11_camera_focus_host
          /tmp/g11_camera_focus_host
          grep -q 'b24_g11_target_camera_follow(&camera_focus_in' work/src/main.c
          grep -q 'idx!=2' work/src/main.c
          grep -q 'b24_g11_target_camera_follow.c' work/CMakeLists.txt
          echo "PASS G11 actual G10 B14 camera L-focus and 4 iron body combos restored; no VPK"
      - name: Verify actual original 2010 three-stage BEAM, passive hover and WM first-event
        run: |
          set -eu
          cc -std=c11 -O1 -Wall -Wextra -Werror -pedantic research/b24_unified/b24_g11_original_unibeam_sequence.c research/b24_unified/test_b24_g11_original_unibeam_sequence.c -lm -o /tmp/g11_true_unibeam_source
          /tmp/g11_true_unibeam_source
          grep -q 'b24_g11_unibeam_clip(suit,hovering' work/b24/b24_unified/b24_g8_live_original_motion.c
          grep -q 'const uint32_t source_age=neutral_float' work/b24/b24_unified/b24_g8_live_original_motion.c
          grep -q 'b24_g8_motion_unibeam_trigger(&b24_original_motion' work/src/main.c
          grep -q 'b24_g11_original_unibeam_sequence.c' work/CMakeLists.txt
          echo "PASS G11 original source Beam1 Beam2 Beam3, WM source first repulsor persisted, neutral hover nonflap, no VPK"
      - name: Test user practice target B16 original dummy mismatch is resolved with immortal glow
        run: |
          set -eu
          cc -std=c11 -O1 -Wall -Wextra -Werror -pedantic research/b24_unified/b24_g10_practice_target.c research/b24_unified/b24_g11_practice_melee_feedback.c research/b24_unified/test_b24_g11_practice_melee_feedback.c -lm -o /tmp/g11_real_practice_feedback_host
          /tmp/g11_real_practice_feedback_host
          grep -q 'b24_g11_practice_melee_hit(' work/src/main.c
          grep -q 'b24_g11_practice_hit_flash(' work/src/main.c
          grep -q 'b24_g11_practice_melee_feedback.c' work/CMakeLists.txt
          test "$(grep -c 'combat.mode=B16_REPULSOR;combat.combo_step=0;' work/src/main.c)" -eq 2
          echo "PASS authentic C1L1 real 3D permanent practice dummy melee hit reaction, no VPK"
      - name: G11 actual immortal 3D target C11 valid near swing and temporary GPU hit flash
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -Wall -Wextra -Werror -pedantic \
            research/b24_unified/b24_g10_practice_target.c \
            research/b24_unified/b24_g11_practice_melee_feedback.c \
            research/b24_unified/test_b24_g11_practice_melee_feedback.c \
            -lm -o /tmp/g11_real_3d_practice_melee
          /tmp/g11_real_3d_practice_melee
          python3 - <<'PY'
          from pathlib import Path
          main=Path('work/src/main.c').read_text()
          gpu=Path('work/b24/b24_unified/b24_g10_practice_target_vitagl.c').read_text()
          cm=Path('work/CMakeLists.txt').read_text()
          assert 'b24_g11_practice_melee_hit(&b24_practice_hits' in main
          assert 'b24_gpu_rt.practice_target.hit_flash=' in main
          assert 'if(t->hit_flash>0.f)' in gpu
          assert 'b24_g11_practice_melee_feedback.c' in cm
          assert main.index('b24_g11_practice_melee_hit(&b24_practice_hits')<main.index('b24_gpu_runtime_draw(')
          print("PASS G11 one real B14 native actor hitbox, 190ms GOLD impact visual on immortal test dummy, true BRES combo preserved, NO VPK")
          PY
      - name: Validate authentic C1L1 per-material CPU-once Vita GPU runtime source and 22919 triangle index buckets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('work/b24/b24_unified/b24_gpu_runtime.h').read_text()
          c=Path('work/b24/b24_unified/b24_gpu_runtime.c').read_text()
          cm=Path('work/CMakeLists.txt').read_text()
          assert 'B24C1MaterialBatchPlan city_draw_material_plan;' in h
          assert 'b24_c1_material_batches_build(&r->city_draw_material_plan' in c
          assert c.count('b24_c1_material_batches_free(&r->city_draw_material_plan)')==3
          assert 'b24_c1_material_batches.c' in cm
          assert 'b24_gpu_owner_scene_material(&r->owner,&r->city' in c
          assert '39' not in c
          print('PASS exact G10 VitaGL runtime 22919 2010 owner source triangles prepared CPU-once by C1MA original material; no fake original atlas or extra render passes')
          PY
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iwork/b24/b24_unified \
            -c work/b24/b24_unified/b24_c1_material_batches.c \
            -o /tmp/2010_source_true_city_material_plan.o
          test -s /tmp/2010_source_true_city_material_plan.o
      - name: G12 actual original 2010 C1L1 shader source bank real single Vita GPU draw source assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('work/b24/b24_unified/b24_gpu_runtime.c').read_text()
          owner=Path('work/b24/b24_unified/b24_gpu_owner_2010_material.c').read_text()
          shader=Path('work/b24/b24_unified/b24_gpu_c1_2010_textured_material_vitagl.c').read_text()
          cm=Path('work/CMakeLists.txt').read_text()
          assert main.count('b24_gpu_owner_scene_original_2010(')==1
          assert main.count('b24_gpu_owner_scene_material(')==1
          assert main.count('b24_gpu_c1_2010_diffuse_upload(')==1
          assert 'r->city_textured_ready' in main
          assert 'r->city_draw_material_plan' in main
          assert 'b24_gpu_c1_draw_original_2010_world' in owner
          assert 'for(unsigned b=0;b<plan->nbuckets;b++)' in shader
          assert 'q->group==3u?-1' in shader
          assert 'b24_c1_2010_diffuse_bank.c' in cm
          assert 'b24_gpu_c1_2010_diffuse_upload.c' in cm
          assert 'b24_gpu_c1_2010_textured_material_vitagl.c' in cm
          assert main.count('b24_gpu_owner_present(')==1
          print('PASS actual G10 Vita GPU 2010 BRES shader source material 94 index buckets, real C1MT 39 bank, 1 scene, 1 armor, 1 HUD, 1 swap, correct untextured UV-less lights fallback NO VPK')
          PY
      - name: Compile actual G12 VitaGL world source shaders and single original material runtime owner strict VitaARM C11 objects
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            vitasdk/vitasdk:2026.08 sh -lc '
              set -eu
              for n in b24_c1_2010_diffuse_bank b24_gpu_c1_2010_diffuse_upload b24_gpu_c1_2010_textured_material_vitagl b24_gpu_owner_2010_material; do
                arm-vita-eabi-gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
                  -Iwork/src -Iwork/b24/b24_unified \
                  -c "work/b24/b24_unified/$n.c" -o "/tmp/$n.o"
                test -s "/tmp/$n.o"
              done
              echo "PASS G12 4 original 2010 map VitaGL shader PVR atlas and source original material GPU owner ARM objects, NO VPK"
            '
      - name: Strict Vita ARM objects for both C1L1 original ground/source foot modules only
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            vitasdk/vitasdk:2026.08 sh -lc '
              set -eu
              for n in b24_c1_true_source_floor b24_g10_original_foot_contact b24_g11_combat_stage_policy b24_g11_target_camera_follow b24_g11_original_unibeam_sequence b24_g11_practice_melee_feedback b24_c1_material_batches; do
                arm-vita-eabi-gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
                  -Iwork/src -Iwork/b24/b24_unified \
                  -c "research/b24_unified/$n.c" -o "/tmp/$n.o"
                test -s "/tmp/$n.o"
              done
              echo "PASS G11 six exact Vita ARM modules: original C1L1 ground, feet, shot-stage, lock-camera, unibeam, immortal combat feedback. NO VPK"
            '
