name: G47 actual owner original 2010 PVR UV 3D Level1 ground-on versus lower city PNG NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g47-original-C1L1-ground-city-PVR3D-authentic-PNG.yml"
      - "research/b24_unified/b24_g47_source_original_2010_BRES_UV_PVR_threeD_ground_vs_city_viewer_PNG.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_source_3D_layers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Exact original 2010 BRES PVR PVRTC source dependencies
        run: python3 -m pip install -q numpy pillow texture2ddecoder gdown
      - name: Stage private owner original source only for this CI job
        run: |
          mkdir -p /tmp/g47
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g47/original.ipa
          test "$(wc -c </tmp/g47/original.ipa)" -eq 248613763
      - name: Recreate actual owner G32 all 370 source geometry and 24 original PVR UV atlas bytes
        run: |
          python3 research/b24_unified/b24_g32_original_2010_BRES_PVR_UV_real_textured_WebGL2.py             --ipa /tmp/g47/original.ipa --html /tmp/g47/G32_real_original_source.html --report /tmp/g47/g32.json
      - name: Recreate exact owner 5 authentic source-level negative Z PositionDummies
        run: |
          python3 research/b24_unified/b24_g46_original_C1L1_negative_Z_PositionDummy_native_urban_BRES_proximity.py             --ipa /tmp/g47/original.ipa --out /tmp/g47/G46
      - name: Draw actual original BRES PVR 3D source geometry with ground layer shown and diagnostic-hidden in same view
        run: |
          python3 research/b24_unified/b24_g47_source_original_2010_BRES_UV_PVR_threeD_ground_vs_city_viewer_PNG.py             --g32-html /tmp/g47/G32_real_original_source.html             --g46-json /tmp/g47/G46/G46_original_2010_low_Z_PD_vs_BRES_city.json             --out /tmp/g47/G47
      - name: No fake mesh movement or original runtime visibility claims
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/g47/G47')
          r=json.loads((p/'G47_ORIGINAL_2010_TWO_LAYER_3D_PROVENANCE.json').read_text())
          assert r['source_original_BRES_meshes']==370
          assert r['source_original_triangles']==22919
          assert r['source_native_ground_triangles']==3280
          assert r['source_authentic_original_PVRs']==24
          assert r['source_native_PD_negative_Z_count']==5
          assert r['original_source_vertices_relocated'] is False
          assert r['original_runtime_visibility_claimed'] is False
          assert r['no_VPK_and_no_performance_changes']
          assert (p/'G47_C1L1_2010_ORIGINAL_BRES_PVR_3D_GROUND_ON_OFF.png').stat().st_size>120000
          print('PASS G47 original owner game source 3D models + PVR atlas samples two layer PNG no VPK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G47_2010_C1L1_ORIGINAL_BRES_PVR_TRUE_GROUND_ON_OFF_3D_PNG_NO_VPK
          path: /tmp/g47/G47/
          retention-days: 14
          if-no-files-found: error
      - if: always()
        run: rm -rf /tmp/g47/original.ipa /tmp/g47/G32_real_original_source.html
