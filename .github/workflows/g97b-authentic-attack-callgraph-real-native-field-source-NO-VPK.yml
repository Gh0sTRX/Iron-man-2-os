name: G97B REAL 2010 attack entity native call graph field provenance NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g97b-authentic-attack-callgraph-real-native-field-source-NO-VPK.yml"
      - "research/b24_unified/g97_source_attack_hit/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_2010_native_method_function_flow_and_fields:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reuse authentic original 2010 IPA G97 native ARM analysis evidence no full IPA
        uses: actions/download-artifact@v4
        with:
          name: G97_ORIGINAL_2010_ATTACKENTITY_PROJECTILE_HIT_DAMAGE_REAL_ARM_METADATA_ONLY_NO_VPK
          run-id: 38968856782
          github-token: ${{ github.token }}
          path: /tmp/g97_native_authenticated
      - name: Produce real AttackEntity/Projectile/Actor native C++ call graph and field xrefs
        run: |
          set -euo pipefail
          python3 research/b24_unified/g97_source_attack_hit/g97b_original_attack_method_edges_and_fields.py \
            --metadata /tmp/g97_native_authenticated/G97_AUTHENTIC_2010_ATTACK_ENTITY_PROJECTILE_HIT_DAMAGE_ARM_PROVENANCE.json \
            --out /tmp/g97b/G97B_ORIGINAL_NATIVE_COMBAT_CALL_GRAPH_AND_UNKNOWN_DAMAGE_FIELDS.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/g97b/G97B_ORIGINAL_NATIVE_COMBAT_CALL_GRAPH_AND_UNKNOWN_DAMAGE_FIELDS.json').read_text())
          assert len(d['original_iOS_2010_combat_call_flow_source_only'])>=10
          assert d['exact_melee_attack_damage_float_values_proven'] is False
          assert d['exact_attack_window_frame_start_end_proven'] is False
          assert d['original_source_PSVita_AI_NPC_damage_integrated'] is False
          assert d['NO_VPK'] is True
          print('PASS source original 2010 native method inter-call graph and exact register-memory-offset evidence no fake combat')
          PY
          test -z "$(find . /tmp/g97b -type f -name '*.vpk' -print -quit)"
      - name: Upload real source native method metadata ONLY
        uses: actions/upload-artifact@v4
        with:
          name: G97B_ORIGINAL_2010_ATTACK_DAMAGE_NATIVE_CALL_GRAPH_REGISTER_FIELDS_SOURCE_ONLY
          path: /tmp/g97b/G97B_ORIGINAL_NATIVE_COMBAT_CALL_GRAPH_AND_UNKNOWN_DAMAGE_FIELDS.json
          retention-days: 14
          if-no-files-found: error
