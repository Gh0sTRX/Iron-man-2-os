name: G56 C1L1 74 original special light missing-pivot source classification NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g56-original-2010-C1L1-special-light-74-source-audit.yml"
      - "research/b24_unified/b24_g56_C1L1_special_light_missing_pivot_raw_source_geometry_audit.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit_exact_original_special_light_geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install original BRES mesh reader only
        run: python3 -m pip install -q numpy
      - name: Test origin versus baked center classification
        run: |
          python3 -m py_compile research/b24_unified/b24_g56_C1L1_special_light_missing_pivot_raw_source_geometry_audit.py
          python3 research/b24_unified/b24_g56_C1L1_special_light_missing_pivot_raw_source_geometry_audit.py --self-test
      - name: Audit 74 unresolved special light meshes in original BRES
        run: |
          python3 research/b24_unified/b24_g56_C1L1_special_light_missing_pivot_raw_source_geometry_audit.py \
            --zip research/B11_C1L1_Source_Parser.zip \
            --out /tmp/g56/G56_C1L1_74_SPECIAL_LIGHT_NATIVE_MESH_PROVENANCE_NO_GUESSED_POSITIONS.json
      - name: Assert native provenance and no VPK
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/g56/G56_C1L1_74_SPECIAL_LIGHT_NATIVE_MESH_PROVENANCE_NO_GUESSED_POSITIONS.json'))
          c=d['counts']
          assert c['G55_source_parent_pivot_links']==296
          assert c['unresolved_special_meshes']==74
          assert c['unresolved_original_triangles']==478
          assert c['canonical_node_present']==74
          assert c['source_bbox_origin_centered']==49
          assert c['source_bbox_baked_nonzero']==25
          assert d['no_speculative_special_light_mesh_placement']
          assert d['NO_VPK_OR_VITA_DEVICE_TEST']
          print('PASS G56 real original scene special mesh raw geometry classes; parent-only placement not assumed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G56_REAL_C1L1_74_SPECIAL_LIGHT_RAW_CENTER_CLASSES_NO_VPK
          path: /tmp/g56/*.json
          retention-days: 14
          if-no-files-found: error
