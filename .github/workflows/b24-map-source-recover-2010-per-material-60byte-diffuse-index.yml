name: MAP FIRST 2010 real 60B property original TGA atlas exact links with default material bypass NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/b24-map-source-recover-2010-per-material-60byte-diffuse-index.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_true_sampler:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read original 2010 material 60byte property source and compare to original TGA bank including B12 known car
        run: |
          python3 research/b24_unified/b24_map_first_2010_source_60byte_material_texture_index_recovery.py \
           --out /tmp/C1L1_TRUE_ORIGINAL_PER_MATERIAL_TGA_SOURCE_TEXTURE_INDEX.json
      - name: Independently validate all source materials ground buildings and B12 vehicle atlas consistency
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/C1L1_TRUE_ORIGINAL_PER_MATERIAL_TGA_SOURCE_TEXTURE_INDEX.json').read_text())
          assert len(d['source_10_original_2010_BRES_files'])==10
          print('MAP FIRST true original author material property count',len(d['author_60byte_per_mat_records']))
          print('MAP FIRST verified original B12 vehicle source shader true link',d['verified_original_B12_car_matches'])
          print('MAP FIRST cross-original urban material TGA contradictions',len(d['same_original_material_across_original_urban_source_inconsistencies']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Original2010_MAP_First_BRES_Shader88_Material60_PVR20_Per_Material_Diffuse_Index
          path: /tmp/C1L1_TRUE_ORIGINAL_PER_MATERIAL_TGA_SOURCE_TEXTURE_INDEX.json
          if-no-files-found: error
