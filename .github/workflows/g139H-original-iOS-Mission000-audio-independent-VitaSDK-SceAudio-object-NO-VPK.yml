name: G139H original 2010 Mission000 exact Lua audio dispatch C11 and real VitaSDK SceAudio ARM module NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g139H-original-iOS-Mission000-audio-independent-VitaSDK-SceAudio-object-NO-VPK.yml"
      - "research/b24_unified/g139_vita_native_audio_music/**"
      - "research/b24_unified/g137_original_Mission000_native_boot/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verified_native_audio_and_owner_2010_real_Lua_calls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Obtain existing 2010 original 1035 Lua calls source from previous authenticated CI only
        uses: actions/download-artifact@v4
        with:
          name: G27_ORIGINAL_C1L1_71_LUA_1035_CALLS_MC_CAMERA_NODE_ID_STATIC_SOURCE_NO_VPK
          run-id: 38750892057
          github-token: ${{ github.token }}
          path: /tmp/g139H_authored_source
      - name: Compile EXACT 24 original 2010 Mission000 events to native source and test BGM backend errors/ack PC3
        run: |
          set -euo pipefail
          python3 -m py_compile research/b24_unified/g139_vita_native_audio_music/g139_patch_original_Mission000_PauseMusic_with_real_Vita_SceAudio_NO_VPK.py
          mkdir -p /tmp/g139H_generated
          python3 research/b24_unified/g137_original_Mission000_native_boot/g137_emit_original_Mission000_lua_prefix_from_G27.py \
            --g27 /tmp/g139H_authored_source/original_lua_calls.json \
            --out /tmp/g139H_generated/b24_g137_mission000_owner_original_generated.c
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -I research/b24_unified/g137_original_Mission000_native_boot \
            -I research/b24_unified/g139_vita_native_audio_music \
            research/b24_unified/g137_original_Mission000_native_boot/b24_g137_source_mission000_intro.c \
            /tmp/g139H_generated/b24_g137_mission000_owner_original_generated.c \
            research/b24_unified/g139_vita_native_audio_music/b24_g139_original_mission_music_bridge.c \
            research/b24_unified/g139_vita_native_audio_music/test_g139_real_source_Mission000_native_music_group.c \
            -o /tmp/g139H_source_music_backend
          /tmp/g139H_source_music_backend
          test -z "$(find . -name '*.vpk' -print -quit)"
      - name: VitaSDK native SceAudioOut BGM C module ARM compile (no game assets/no VPK)
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace vitasdk/vitasdk:2026.08 sh -lc '
            set -eu
            mkdir -p /tmp/g139H_vita_arm
            arm-vita-eabi-gcc -std=c11 -O2 -Wall -Wextra -Werror \
               -DB24_G139_REAL_VITA_AUDIO_OUT=1 \
               -Iresearch/b24_unified/g137_original_Mission000_native_boot \
               -Iresearch/b24_unified/g139_vita_native_audio_music \
               -c research/b24_unified/g139_vita_native_audio_music/b24_g139_original_mission_music_bridge.c \
               -o /tmp/g139H_vita_arm/g139_original_music_arm.o
            test -s /tmp/g139H_vita_arm/g139_original_music_arm.o
            arm-vita-eabi-nm /tmp/g139H_vita_arm/g139_original_music_arm.o | grep -q sceAudioOutOpenPort
            arm-vita-eabi-nm /tmp/g139H_vita_arm/g139_original_music_arm.o | grep -q sceAudioOutSetVolume
            echo PASS G139 native Vita ARM object uses REAL SceAudioOut BGM open port/volume, source Lua PC3 error gates in host, NO VPK
          '
