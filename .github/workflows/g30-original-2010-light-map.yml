name: G30 first level original Light native source audit
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: ['.github/workflows/g30-original-2010-light-map.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_light:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q gdown numpy pillow
      - run: |
          mkdir -p /tmp/g30
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g30/owner.ipa
          test "$(wc -c </tmp/g30/owner.ipa)" -eq 248613763
      - run: |
          python3 research/b24_unified/b24_g30_original_C1L1_four_Sun_Light_source_native_fields.py --ipa /tmp/g30/owner.ipa --out /tmp/g30/lights.json --png /tmp/g30/geometry.png --html /tmp/g30/lights.html
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/g30/lights.json').read_text())
          assert d['native_classed_2010_Light_source_node_count']==4
          assert d['source_original_Light_nodes_with_unique_native_transform']==4
          assert d['source_real_BRES_city_triangles']==22919
          assert not d['source_light_color_type_intensity_in_2010_engine_PROVEN']
          assert not d['source_lightmap_gpu_renderer_verified']
          assert d['NO_VPK']
          assert Path('/tmp/g30/lights.html').stat().st_size>60000
          print('PASS original 2010 4 Light source nodes; NO VPK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G30_2010_ORIGINAL_LIGHT_SOURCE_MAP_HTML_PNG_NO_VPK
          path: |
            /tmp/g30/lights.json
            /tmp/g30/geometry.png
            /tmp/g30/lights.html
          retention-days: 14
      - if: always()
        run: rm -rf /tmp/g30/owner.ipa
