name: G26 2010 CLARA 71 original Lua5.1 scripts authenticated typed scene owner source ONLY NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g26-original-2010-71-lua51-clara-scripts.yml"
      - "research/b24_unified/b24_g26_original_level1_71_embedded_lua51_typed_scene_callbacks.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_scene_scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Temporary source archival original user-owned game
        run: |
          python3 -m pip install -q gdown
          mkdir -p /tmp/g26
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g26/original.ipa
          test "$(wc -c </tmp/g26/original.ipa)" -eq 248613763
      - name: Decode complete authentic original Lua5.1 chunks and owner class crosslinks
        run: |
          python3 research/b24_unified/b24_g26_original_level1_71_embedded_lua51_typed_scene_callbacks.py --ipa /tmp/g26/original.ipa --out /tmp/g26/source_lua.json
      - name: Verify 71 native chunks classed original source and no engine execution claims
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/g26/source_lua.json').read_text())
          assert a['original_level1_bytes']==339733
          assert a['source_authentic_embedded_Lua5_1_chunks']==71
          assert a['source_parsed_Lua5_1_chunks']==71
          assert a['source_all_callbacks_matched_exact_original_classed_CLARA_entity_ID']
          assert a['source_actual_callback_owner_native_class_counts']=={'Mission':45,'Trigger':17,'InteractiveObj':5,'SpawnPoint':4}
          assert not a['original_2010_source_lua_programs_ran']
          assert not a['original_2010_exact_control_flow_and_cutscene_timeline_proven']
          assert a['no_gameplay_or_VPK_changes']
          print('PASS original 2010 exact Lua5.1 static script 71/71 and classed owner ID; no port or VPK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G26_ORIGINAL_2010_C1L1_71_REAL_LUA51_TYPED_CLASS_EVENT_CALLBACKS_NO_VPK
          path: /tmp/g26/source_lua.json
          retention-days: 14
          if-no-files-found: error
      - name: Remove original user's source IPA
        if: always()
        run: rm -rf /tmp/g26/original.ipa
