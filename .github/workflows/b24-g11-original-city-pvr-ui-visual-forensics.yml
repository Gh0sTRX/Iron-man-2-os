name: G11 original C1L1 complete 39 native PVRTC plus accurate RGBA4444 minimap NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/b24-g11-original-city-pvr-ui-visual-forensics.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner_true_2010_diffuse_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Temporary authenticated original source backup and decoder libraries
        run: |
          set -euo pipefail
          python3 -m pip install -q numpy pillow texture2ddecoder gdown
          mkdir -p /tmp/g11_only_owner
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g11_only_owner/game.ipa
          test "$(wc -c </tmp/g11_only_owner/game.ipa)" -eq 248613763
      - name: Decode exact 2010 C1L1 native diffuse images and original UI source images for visual matching
        run: |
          set -euo pipefail
          python3 research/b24_unified/b24_g11_original_2010_city_texture_and_window_ui_contact.py \
            --ipa /tmp/g11_only_owner/game.ipa \
            --out /tmp/G11_AUTHENTIC_2010_C1L1_AND_UI_PREVIEW
      - name: Check authentic records, no fabricated atlas and no black-box mapping assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/G11_AUTHENTIC_2010_C1L1_AND_UI_PREVIEW')
          d=json.loads((root/'G11_CITY_PVR_AND_IOS_SOURCE_UI_AUTHENTIC_PREVIEW_REPORT.json').read_text())
          assert d['city_source_tga_total']>=35
          assert d['city_source_decoded']>=25
          assert len(d['ui_original_png_meta'])==23
          assert d['authoritative_material_to_diffuse_link_proven'] is False
          assert d['original_crosshair_sprite_identity_proven'] is False
          for path in ('G11_ORIGINAL_2010_C1L1_CITY_TEXTURE_ATLAS_CONTACT.png',
                       'G11_ORIGINAL_2010_IOS_WINDOW_UI_23_SPRITES_CONTACT.png'):
              assert (root/path).stat().st_size>1000
          print('PASS original 2010 C1L1 source PVR + 23 individual PNG authored UI visual sheets, no guessed city material or crosshair, NO VPK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G11_2010_Original_C1L1_Genuine_Road_Building_Sky_PVR_And_UI23_Source_PNG_Preimages
          path: /tmp/G11_AUTHENTIC_2010_C1L1_AND_UI_PREVIEW/
          if-no-files-found: error
          compression-level: 6
          retention-days: 15
      - name: Erase private IPA even when failure
        if: always()
        run: rm -rf /tmp/g11_only_owner
