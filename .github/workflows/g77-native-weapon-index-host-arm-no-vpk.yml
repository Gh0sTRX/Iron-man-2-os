name: G77 Proven Native WeaponDB Index Host and Vita ARM Source Tests No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g77-native-weapon-index-host-arm-no-vpk.yml"
      - "research/b24_unified/g77_original_weapon_db/b24_g77_native_weapon_db_index.*"
      - "research/b24_unified/g77_original_weapon_db/test_b24_g77_native_weapon_db_index.c"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test original ARM WeaponDB bounds and pointer selection as host CPU reference
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -I research/b24_unified/g77_original_weapon_db \
            research/b24_unified/g77_original_weapon_db/b24_g77_native_weapon_db_index.c \
            research/b24_unified/g77_original_weapon_db/test_b24_g77_native_weapon_db_index.c \
            -o /tmp/g77_weapon_index_test
          /tmp/g77_weapon_index_test
      - name: Cross compile reference source as Vita ARM CPU object only
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace vitasdk/vitasdk:2026.08 sh -lc '
            set -eu
            arm-vita-eabi-gcc -std=c11 -O2 -Wall -Wextra -Werror \
              -I research/b24_unified/g77_original_weapon_db \
              -c research/b24_unified/g77_original_weapon_db/b24_g77_native_weapon_db_index.c \
              -o /tmp/g77_native_weapon_index.o
            test -s /tmp/g77_native_weapon_index.o
            echo "PASS G77 original WeaponDB index semantics Vita ARM source object, NO VPK"
          '
