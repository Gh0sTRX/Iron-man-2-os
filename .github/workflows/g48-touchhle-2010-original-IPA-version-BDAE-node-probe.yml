name: G48 ORIGINAL 2010 owner Iron Man 2 IPA version vs touchHLE and Gameloft BDAE native node PIVOT forensic NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g48-touchhle-2010-original-IPA-version-BDAE-node-probe.yml"
      - "research/b24_unified/b24_g48_touchHLE_original_owner_IPA_version_and_new_BDAE_node_TRS_probe.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual_owner_version_and_original_bdae_nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Source byte fingerprint dependencies
        run: python3 -m pip install -q numpy gdown
      - name: Retrieve owner-owned original 2010 IPA temporarily (do not publish IPA)
        run: |
          mkdir -p /tmp/g48
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g48/original.ipa
          test "$(wc -c </tmp/g48/original.ipa)" -eq 248613763
      - name: Compare owned IPA exact app version with documented touchHLE report and 2010 BRES node/PIVOT bytes
        run: |
          python3 research/b24_unified/b24_g48_touchHLE_original_owner_IPA_version_and_new_BDAE_node_TRS_probe.py             --ipa /tmp/g48/original.ipa             --source-bdae-zip research/B11_C1L1_Source_Parser.zip             --out /tmp/g48/G48_ORIGINAL_OWNER_APP_VERSION_AND_10_BRES_NODE_PIVOT_TRS_EVIDENCE.json
      - name: Strict original source and external version-difference guards
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/g48/G48_ORIGINAL_OWNER_APP_VERSION_AND_10_BRES_NODE_PIVOT_TRS_EVIDENCE.json'))
          assert d['source_2010_static_BRES_files_analyzed']==10
          assert len(d['native_original_BRES_node_name_PIVOT_probe'])==10
          assert d['original_user_2010_iron_man_2_CFBundleIdentifier']
          assert d['original_user_2010_iron_man_2_executable']
          assert not d['external_node_layout_claim_applies_unchanged_to_2010_BRES_0_0_0_133']
          assert not d['source_binary_node_hierarchy_semantics_verified_from_C1L1']
          assert not d['actual_original_2010_runtime_OpenGL_drawing_captured']
          assert not d['original_BRES_polygons_moved_or_shader_guess_applied']
          assert d['NO_VPK']
          print('PASS original IPA Info.plist verified; BDAE 779 node layout is still only a hypothesis for BRES 133')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G48_2010_ORIGINAL_OWNED_IPA_VERSION_vs_TOUCHHLE_10_BRES_NATIVE_PIVOT_NODE_FINGERPRINTS_NO_VPK
          path: /tmp/g48/G48_ORIGINAL_OWNER_APP_VERSION_AND_10_BRES_NODE_PIVOT_TRS_EVIDENCE.json
          retention-days: 14
      - if: always()
        run: rm -rf /tmp/g48/original.ipa
