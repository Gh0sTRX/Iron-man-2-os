name: C1L1 MAP FIRST original 2010 Gameloft BDAE material declaration and texture property v779 template validation
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/b24-g11-map-first-2010-material-definitions-v779-template-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_material_definition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Decode real 2010 C1L1 native separate material definition pointers and authored headers
        run: |
          set -euo pipefail
          python3 research/b24_unified/b24_map_first_2010_material_property_dictionary_recovery.py \
             --out /tmp/G11_SOURCE_C1L1_AUTHOR_MATERIAL_PROPERTY_GRAPH.json
      - name: Check only original 10 BRES scene sources; never infer material by label
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/G11_SOURCE_C1L1_AUTHOR_MATERIAL_PROPERTY_GRAPH.json').read_text())
          assert len(d['original_2010_BRES_material_declaration_reference_graph'])==10
          assert not d['authoritative_diffuse_material_tex_pair_confirmed']
          print('PASS exact original iOS 2010 BRES material-definition reference locations, no guessed diffuse binding')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: C1L1_MapFirst_2010_Source_BRES_Material_Definition_Pointer_Graph
          path: /tmp/G11_SOURCE_C1L1_AUTHOR_MATERIAL_PROPERTY_GRAPH.json
          if-no-files-found: error
