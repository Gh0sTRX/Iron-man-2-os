name: G280 Vita3K official pinned Linux emulator CI smoke - existing G161 optional, NO NEW VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g280-vita3k-isolated-emulator-smoke-NO-NEW-VPK.yml"
      - "research/b24_unified/g280_vita3k_ci/**"
  workflow_dispatch:
    inputs:
      existing_g161_archive:
        description: "Optional: attempt the already-built G161 VPK in private repo artifacts. This will NOT rebuild VPK."
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  isolated_official_emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      G280_LOGS: ${{ runner.temp }}/g280-logs
    steps:
      - name: Checkout only original research repository code
        uses: actions/checkout@v4
      - name: Install open-source Linux X11 virtual display and Mesa libs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth mesa-vulkan-drivers libgl1 libegl1 libvulkan1
          mkdir -p "$RUNNER_TEMP/g280-emulator-home" "$G280_LOGS"
          test -z "$(find research/b24_unified/g280_vita3k_ci -type f -name '*.vpk' -print -quit)"
      - name: Test exact official release contract and SHA256 pin validation logic
        shell: bash
        run: python3 research/b24_unified/g280_vita3k_ci/test_g280_vita3k_bootstrap_contract.py
      - name: Fetch OFFICIAL Vita3K Build 4206 AppImage (SHA256 verified before running)
        shell: bash
        run: |
          set -euo pipefail
          python3 research/b24_unified/g280_vita3k_ci/g280_prepare_pinned_vita3k.py \
            --out "$RUNNER_TEMP/g280-official-vita3k" \
            | tee "$G280_LOGS/g280_download_verify.txt"
          test -x "$RUNNER_TEMP/g280-official-vita3k/squashfs-root/AppRun"
          cp "$RUNNER_TEMP/g280-official-vita3k/g280_metadata.json" "$G280_LOGS/"
      - name: Validate emulator binary CLI under software GPU/Xvfb, no firmware, no game
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/g280-emulator-home"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/g280-xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          APP="$RUNNER_TEMP/g280-official-vita3k/squashfs-root/AppRun"
          xvfb-run -a -s '-screen 0 960x544x24' \
            timeout --signal=TERM 35s "$APP" --version \
            >"$G280_LOGS/g280_version.log" 2>&1
          xvfb-run -a -s '-screen 0 960x544x24' \
            timeout --signal=TERM 35s "$APP" --help \
            >"$G280_LOGS/g280_help.log" 2>&1
          test -s "$G280_LOGS/g280_version.log"
          test -s "$G280_LOGS/g280_help.log"
          grep -Ei 'Vita3K|version' "$G280_LOGS/g280_version.log" | head -3
          grep -Eq -- '--console|--installed-path|content-path' "$G280_LOGS/g280_help.log"
          echo 'G280_EMULATOR_BINARY_CLI_SMOKE_PASS. GAMEPLAY/FPS/HARDWARE UNVERIFIED' \
            | tee "$G280_LOGS/g280_classification.txt"
      - name: Retrieve OLD G161 original authorized private VPK only by manual opt-in
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.existing_g161_archive }}
        uses: actions/download-artifact@v4
        with:
          run-id: 39053725183
          name: G161_IronMan2_iOS_Original_StarkExpo_G160_Road_G156_Walls_G106_Sky_Flight_OneDevice_TEST_VPK
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/g280-existing-G161
      - name: Explore one PREVIOUS G161 package in Vita3K; no new Vita SDK build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.existing_g161_archive }}
        shell: bash
        run: |
          set -euo pipefail
          python3 research/b24_unified/g280_vita3k_ci/g280_existing_vpk_optional_probe.py \
            --app "$RUNNER_TEMP/g280-official-vita3k/squashfs-root/AppRun" \
            --folder "$RUNNER_TEMP/g280-existing-G161" \
            --output "$G280_LOGS"
          test -s "$G280_LOGS/g280_emulator_result.json"
          echo 'OLD G161 VPK attempt NOT a game boot/FPS/hardware pass without proper firmware, graphics and frames.' \
            >> "$G280_LOGS/g280_classification.txt"
      - name: Explicitly preserve no VPK or private assets in diagnostic logs
        if: always()
        shell: bash
        run: |
          mkdir -p "$G280_LOGS"
          test -z "$(find "$G280_LOGS" -type f \( -name '*.vpk' -o -name '*.ipa' -o -name '*.pup' \) -print -quit)"
          echo 'G280: Vita3K CLI smoke != original iOS engine port, rendered game, input correctness or physical Vita play test.' \
            >> "$G280_LOGS/README_STATUS.txt"
      - name: Upload ONLY emulator log files, never original game asset bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G280_OFFICIAL_VITA3K_CLI_AND_OPTIONAL_OLD_G161_LOGS_NO_VPK
          path: ${{ runner.temp }}/g280-logs/
          if-no-files-found: warn
          retention-days: 7
