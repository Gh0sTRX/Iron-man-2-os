name: G76 Original 2010 IPA Combat Hurt Animation Raw Channel and Native ARM Method Decode NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g76-original-combat-native-research-no-vpk.yml"
      - "research/b24_unified/g76_original_combat/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real_ipa_combat:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install original ARMv7 disassembly plus 2010 asset decoder dependencies
        run: python3 -m pip install -q gdown capstone
      - name: Retrieve user-provided original 2010 game privately and only ephemerally
        run: |
          set -euo pipefail
          mkdir -p /tmp/g76_private
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g76_private/owner_original.ipa ||
            gdown '131--LA4lrPKxpieS6LFKftIpkMY8YWsA' -O /tmp/g76_private/owner_original.ipa
          test "$(wc -c < /tmp/g76_private/owner_original.ipa)" -eq 248613763
      - name: Decode all original 2010 real combat/damage source ANIM channels and timing
        run: |
          python3 research/b24_unified/g76_original_combat/g76_2010_combat_animation_binary_forensics.py \
           --ipa /tmp/g76_private/owner_original.ipa --out /tmp/g76_public_metadata
      - name: Trace actual 2010 native iPhone ARM C++ combat projectile HP/weapon symbol bodies
        run: |
          python3 research/b24_unified/g76_original_combat/g76_2010_native_arm_combat_method_provenance.py \
           --ipa /tmp/g76_private/owner_original.ipa --out /tmp/g76_public_metadata
      - name: Decode original 2010 native C++ battle functions full bounded call graph and untyped damage scalar evidence
        run: |
          python3 research/b24_unified/g76_original_combat/g76b_arm_damage_call_graph_and_literals.py \
            --ipa /tmp/g76_private/owner_original.ipa --out /tmp/g76_public_metadata
      - name: Decode original 2010 combat state Lua and combat weapon effects/sfx metadata
        run: |
          python3 research/b24_unified/g76_original_combat/g76c_real_2010_lua_combat_states_weapon_sound.py \
            --ipa /tmp/g76_private/owner_original.ipa --out /tmp/g76_public_metadata
      - name: Decode exact original 2010 Actor Damage and combo native ARM instruction operands for HP formula work
        run: |
          python3 research/b24_unified/g76_original_combat/g76d_native_actor_damage_instructions.py \
            --ipa /tmp/g76_private/owner_original.ipa --out /tmp/g76_public_metadata
      - name: Remove copyrighted source archive before artifact upload
        run: rm -rf /tmp/g76_private
      - uses: actions/upload-artifact@v4
        with:
          name: G76_2010_Source_Combat_Anim_BoneTime_Hurt_And_ARM_Symbol_CodeEvidence_NO_VPK
          path: |
            /tmp/g76_public_metadata/G76_TRUE_2010_COMBAT_HURT_ANIM_SOURCE_CHANNEL_REPORT.json
            /tmp/g76_public_metadata/G76_ORIGINAL_ATTACK_DAMAGE_CLIP_TIMELINES.csv
            /tmp/g76_public_metadata/G76_TRUE_ORIGINAL_2010_ARM_NATIVE_COMBAT_METHOD_SYMBOLS.json
            /tmp/g76_public_metadata/G76B_ORIGINAL_2010_NATIVE_DAMAGE_COMBAT_DIRECT_CALL_GRAPH.json
            /tmp/g76_public_metadata/G76C_ORIGINAL_2010_STATES_WEAPON_EFFECT_SOUND_SOURCE_METADATA.json
            /tmp/g76_public_metadata/G76D_ORIGINAL_NATIVE_DAMAGE_HP_COMBO_ARM_INSTRUCTION_TRACE.json
          retention-days: 14
          if-no-files-found: error
      - name: Scrub private owner archive even after failure
        if: always()
        run: rm -rf /tmp/g76_private
