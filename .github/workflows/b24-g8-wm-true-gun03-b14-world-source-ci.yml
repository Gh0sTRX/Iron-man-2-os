name: G8 WM Original 2010 Gun03 Rigid Axis Into Authoritative B14 World Host ARM No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/b24-g8-wm-true-gun03-b14-world-source-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual_world_marker:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Run strict C11 ASan UBSan exact G8 third-person actor transform regression
        run: |
          set -euo pipefail
          cd research/b24_unified
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
             -fsanitize=address,undefined -fno-omit-frame-pointer \
             b24_wm_2010_gun_stream.c b24_wm_original_marker_g8_world.c \
             test_b24_wm_original_marker_g8_world.c -lm -o /tmp/g8_wm_true_B14_world_test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/g8_wm_true_B14_world_test
      - name: Retrieve already verified six-node original 2010 rigid-gun source only
        uses: actions/download-artifact@v4
        with:
          name: G8_WM_2010_Source_Gun01_04_Keyframes_And_Original_Scene_Parent_Proof
          run-id: 38612044624
          github-token: ${{ github.token }}
          path: /tmp/g8_real_source_gun
      - name: Run real 2010 owner-authored movement to B14 world integration smoke
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
             research/b24_unified/b24_wm_2010_gun_stream.c \
             research/b24_unified/b24_wm_original_marker_g8_world.c \
             research/b24_unified/b24_wm_original_actor_world_real_source_smoke.c \
             -lm -o /tmp/g8_wm_authentic_rig_actor_world_smoke
          /tmp/g8_wm_authentic_rig_actor_world_smoke \
             /tmp/g8_real_source_gun/WM_2010_Gun01_04_Original_IM2K
      - name: Strict VitaSDK portable C object compile for source-only B14 world transforms
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            vitasdk/vitasdk:2026.08 sh -lc '
              set -eu
              arm-vita-eabi-gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
                -c research/b24_unified/b24_wm_original_marker_g8_world.c \
                -o /tmp/b24_wm_B14_actual_world.o
              test -s /tmp/b24_wm_B14_actual_world.o
              echo "PASS Vita ARM original WM rigid-gun-to-B14-world marker helper, no VPK/no main executable"
            '
