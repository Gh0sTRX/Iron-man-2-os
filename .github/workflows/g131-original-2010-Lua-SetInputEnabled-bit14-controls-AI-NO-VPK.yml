name: G131 genuine 2010 SetInputEnabled lua callback and luaX_setinput ARM bitmask NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/g131-original-2010-Lua-SetInputEnabled-bit14-controls-AI-NO-VPK.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual_owner_2010_Lua_input_callback_original_ARM:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: G130_OWNER_2010_iOS_MARKV_Level1_Flight_Ability_InputBit14_ARM_Methods_NO_VPK
          run-id: 39024647915
          github-token: ${{ github.token }}
          path: /tmp/g131
      - name: Audit ACTUAL 2010 native SetInputEnabled opcode control switch and first mission 14 False 2 True 6 True
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          inp=Path('/tmp/g131/G130_ORIGINAL_2010_LEVEL1_MARKV_SUITCASE_FLIGHT_GATING_INPUT_MISSION_NATIVE_ARM.json')
          d=json.loads(inp.read_text())
          candidates=[f for f in d['original_native_flight_Calls_bounded_ARM']
              if f['source_cpp_function'] in ('SetInputEnabled(lua_State*)','luaX_setinput')]
          assert len(candidates)>=2
          for f in candidates:
            print('G131 ORIGINAL METHOD',f['source_cpp_function'],f['2010_address_hex'])
            for row in f['source_native_raw_ARM_control_flow']:
              print('G131 ORIGINAL ARM',row['pc'],row['mnemonic'],row['registers_or_operands'])
          calls=[x for x in d['real_original_level1_Mission_SetInputEnabled_and_SetState_calls']
              if x['original_native_level1_Lua_callback']=='Mission000_OnStart'
                 and x['call']=='SetInputEnabled']
          print('G131 original mission actual scene Lua CALLs',calls)
          assert {tuple(x['source_literal_args']) for x in calls}=={
           (14.0,False),(2.0,True),(6.0,True)}
          print('G131 source Lua original callback signatures verified; BIT14 flight permission still NOT proven until native control bitmask semantics')
          Path('/tmp/g131/GA131_OWNER_2010_ORIGINAL_SetInputEnabled_14_False_2_6_True_ARM.json').write_text(json.dumps({
           'source_original_Lua_SetInputEnabled_2010_native_ARM':candidates,
           'source_original_first_Mission000_SetInputEnabled_calls':calls,
           'native_flight_permission_decoded_or_enabled':False,
           'VPK_created':False},ensure_ascii=False,indent=2)+'\n')
          PY
          test -z "$(find . -name '*.vpk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: G131_REAL_ORIGINAL_iOS_MarkV_First_Mission_ControlBits_SetInputEnabled_14_2_6_ARM_ONLY
          path: /tmp/g131/GA131_OWNER_2010_ORIGINAL_SetInputEnabled_14_False_2_6_True_ARM.json
          retention-days: 14
