name: B24 Underwater Actual Bone Weight Descriptor Source Audit - No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/b24-original-underwater-skin-descriptors.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner_source_inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout vetted inventory tools
        uses: actions/checkout@v4
      - name: Retrieve exactly owner-provided original IPA via share URL into ephemeral runner
        run: |
          set -euo pipefail
          python3 -m pip install -q gdown
          mkdir -p /tmp/ironman-owner-ipa
          cd /tmp/ironman-owner-ipa
          # Only explicit owner-supplied 2026-10-14 exact Drive file ID.
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O source_v1.0.0.ipa
          test "$(wc -c < source_v1.0.0.ipa)" -eq 248613763
          echo "PASS exact owner-supplied original archive length; original archive NEVER uploaded as artifact"
      - name: Audit true 2010 BRES skin descriptors instead of assuming B9 bone table topology
        run: |
          set -euo pipefail
          python3 -m pip install -q numpy
          python3 - <<'PY'
          import sys,zipfile,struct,numpy as np
          sys.path.insert(0,'research/b24_unified')
          from b24_owner_pack_extract import decode,get_exact
          with zipfile.ZipFile('/tmp/ironman-owner-ipa/source_v1.0.0.ipa') as z:
              packed=z.read('Payload/IronMan2.app/models')
          records=decode(packed,'.bdae')
          for name in ('LC_MC_UnderWater.bdae','underwater02.bdae'):
              raw=get_exact(packed,records,name)
              print('AUTHENTIC_UNDERWATER_BRES',name,len(raw))
              hits=[]
              for o in range(0,len(raw)-40,4):
                  nb,pnames,nm,pm,nw,pw,nv,pc,nidx,pi=struct.unpack_from('<10I',raw,o)
                  if nv not in (811,840,29):continue
                  valid_names=(nb>0 and nb<256 and pnames+4*nb<len(raw))
                  valid_matrix=(nm==nb*16 and pm+4*nm<len(raw))
                  valid_weight=(0<nw<5000 and pw+4*nw<len(raw))
                  valid_count=(0<pc<len(raw) and 0<nidx<20000 and pi+2*nidx<len(raw))
                  row=(hex(o),nb,nm,nw,nv,nidx,valid_names,valid_matrix,valid_weight,valid_count)
                  hits.append(row)
              print('UNFILTERED_NVERT_SKIN_POINTER_CANDIDATES',name,len(hits),hits[:35])
              target=b'Bip01-node\0'
              offs=[]
              pos=0
              while True:
                  at=raw.find(target,pos)
                  if at<0:break
                  pos=at+1
                  refs=[]
                  for ref in range(0,len(raw)-72,4):
                      if struct.unpack_from('<I',raw,ref)[0]==at:
                          cnt,child=struct.unpack_from('<II',raw,ref+52)
                          if cnt<32 and (cnt==0 or child+72*cnt<=len(raw)):
                              refs.append((ref,cnt))
                  offs.append((at,repr(raw[max(0,at-3):at+16]),refs))
              print('ACTUAL_BIP01_ROOT_OFFSETS',name,offs)
          print('PASS exact original Underwater BRES skin + root descriptor forensic diagnostic; no new playable suit claim')
          PY
      - name: Clear user IPA after source inspection
        if: always()
        run: rm -rf /tmp/ironman-owner-ipa
