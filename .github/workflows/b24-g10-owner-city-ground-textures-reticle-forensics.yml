name: G10 ORIGINAL C1L1 Ground plus 37 actual atlas metadata pointer forensic and HUD reticle NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/b24-g10-owner-city-ground-textures-reticle-forensics.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_ground_and_textures:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Fetch only original owner source into transient runner
        run: |
          python3 -m pip install -q numpy gdown
          mkdir -p /tmp/b24_g10_owner
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/b24_g10_owner/source.ipa
          test "$(wc -c </tmp/b24_g10_owner/source.ipa)" -eq 248613763
      - name: Probe original 3D source mesh physical ground triangles and game texture names
        run: |
          python3 research/b24_unified/b24_g9_city_ground_and_texture_forensic.py \
            --ipa /tmp/b24_g10_owner/source.ipa \
            --out /tmp/B24_G10_ORIGINAL_C1L1_GROUND_AND_RETICLE_SOURCE_REPORT.json
      - name: Identify exact original BDAE-to-texture strings and 2010 HUD crosshair asset families
        run: |
          python3 research/b24_unified/b24_g10_city_material_pointer_and_cross_source.py \
            --ipa /tmp/b24_g10_owner/source.ipa \
            --out /tmp/B24_G10_ORIGINAL_BDAE_MATERIAL_TGA_AND_UI_REPORT.json
      - uses: actions/upload-artifact@v4
        with:
          name: G10_Genuine_C1L1_Ground_Coverage_And_Original_Reticle_Texture_Names
          path: |
            /tmp/B24_G10_ORIGINAL_C1L1_GROUND_AND_RETICLE_SOURCE_REPORT.json
            /tmp/B24_G10_ORIGINAL_BDAE_MATERIAL_TGA_AND_UI_REPORT.json
          if-no-files-found: error
      - name: Clean owner backup
        if: always()
        run: rm -rf /tmp/b24_g10_owner
