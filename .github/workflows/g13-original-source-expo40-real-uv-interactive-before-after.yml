name: G13 C1L1 true 2010 Expo PVR per-pixel 3D owner-before-after PNG and interactive HTML no VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/g13-original-source-expo40-real-uv-interactive-before-after.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_png_html:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install iOS 2010 original GLB UV sampler and true per-pixel host 3D CPU screenshot
        run: python3 -m pip install -q 'numpy<2.4' numba pillow texture2ddecoder gdown
      - name: Owner original game used TEMPORARILY to resolve real PVR source colors
        run: |
          mkdir -p /tmp/G13_owner
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/G13_owner/owner.ipa
          test "$(wc -c </tmp/G13_owner/owner.ipa)" -eq 248613763
      - name: Render source original 2010 206 Expo faces before and after adding exact omitted PVR, per-pixel depth tested
        run: |
          python3 research/b24_unified/b24_g13_original_expo40_true_UV_host_before_after.py \
            --ipa /tmp/G13_owner/owner.ipa --out /tmp/G13_owner/preview
      - name: Strict compare exactly same original BRES geometry and UV while adding only 1 genuine Expo PVR image
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          r=Path('/tmp/G13_owner/preview')
          j=json.loads((r/'G13_2010_EXPO_PER_PIXEL_REAL_SOURCE_DIFFERENCE_REPORT.json').read_text())
          assert j['source_2010_shader_material']=='orig_07___Default'
          assert j['exact_source_original_faces_corrected']==206
          assert j['source_geometry_UV_bitidentical_before_after']
          assert j['source_g10_before']['not_real_vita_screenshot']
          assert j['source_g13_after']['not_real_vita_screenshot']
          assert Image.open(r/'G13_2010_EXPO_GENUINE_40TH_PVR_AFTER.png').size==(1280,760)
          assert len(list(r.glob('*.png')))==3
          assert (r/'G13_2010_EXPO_BEFORE_AFTER_SOURCE_UV_COMPARE.html').stat().st_size>1000
          print('PASS original 2010 owner C1L1 Expo 206-face UV source atlas before-after HTML and PNG comparison; changed visible scene pixel count',j['source_color_pixel_changes_in_scene_not_header'],'NO VPK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G13_Original_2010_Expo_PVR40_TRUE_BRES_3D_UV_BEFORE_AFTER_HTML_PNG
          path: /tmp/G13_owner/preview/
          if-no-files-found: error
          retention-days: 14
      - name: Remove original full game backup
        if: always()
        run: rm -rf /tmp/G13_owner/owner.ipa
