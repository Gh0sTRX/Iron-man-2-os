name: G44 2010 source BRES C1L1 real ground versus urban Z geometry map source PNG NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g44-original-C1L1-city-below-ground-raw-z-evidence.yml"
      - "research/b24_unified/b24_g44_original_C1L1_370_mesh_ground_vs_city_native_z_spatial_audit.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_BRES_z_ground:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Original B11 recovered source geometry
        run: python3 -m pip install -q numpy pillow
      - name: Audit original source 370 meshes 22919 faces and urban height with source ground raster footprint
        run: |
          python3 research/b24_unified/b24_g44_original_C1L1_370_mesh_ground_vs_city_native_z_spatial_audit.py --out /tmp/g44/report
      - name: Strict genuine original authored XYZ/face totals not reconstructed world
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/g44/report')
          r=json.loads((p/'G44_NATIVE_2010_GROUND_URBAN_HEIGHT_AND_XY.json').read_text())
          assert r['original_2010_C1L1_BRES_370_meshes']==370
          assert r['original_2010_C1L1_BRES_22919_faces']==22919
          assert r['original_source_urban_centroids_below_Z0']==11048
          assert r['original_source_urban_triangle_centroids_total']==11141
          assert r['original_engine_internal_BRES_node_root_matrix_recovered'] is False
          assert r['original_game_camera_render_depth_compositing_OR_terrain_contact_PROVEN'] is False
          assert r['no_mesh_repositioning_and_no_VPK']
          assert (p/'G44_ORIGINAL_LEVEL1_KAYNAK_GEOMETRI_YUKSEKLIK_16_9.png').stat().st_size>50000
          print('PASS original 2010 city raw centroid below ground, no arbitrary offset or VPK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G44_2010_C1L1_BRES_11048_CITY_BELOW_Z0_370_MESH_SOURCE_3D_GROUND_FOOTPRINT_PNG_NO_VPK
          path: /tmp/g44/report/
          retention-days: 14
          if-no-files-found: error
