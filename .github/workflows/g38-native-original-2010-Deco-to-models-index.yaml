name: G38 original iOS 2010 CLARA Deco resource values versus exact native models archive index NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g38-native-original-2010-Deco-to-models-index.yaml"
      - "research/b24_unified/b24_g38_original_models_pack_index_to_CLARA_deco_exact_binding.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_clara_model_native_id_join:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Original owner game only inside temporary CI
        run: |
          python3 -m pip install -q gdown
          mkdir -p /tmp/g38
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g38/original.ipa
          test "$(wc -c </tmp/g38/original.ipa)" -eq 248613763
      - name: Compare actual original models packed source order to 53 typed CLARA Deco resources
        run: |
          python3 research/b24_unified/b24_g38_original_models_pack_index_to_CLARA_deco_exact_binding.py --ipa /tmp/g38/original.ipa --out /tmp/g38/G38_original_source_native_models_53_Deco_index_links.json --csv /tmp/g38/G38_original_53_Deco_native_model_links.csv
      - name: Verify original-source inventory and expose only genuinely proven ID links
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/g38/G38_original_source_native_models_53_Deco_index_links.json').read_text())
          assert j['owner_original_2010_native_models_archive_entries']>50
          assert j['original_source_Deco_node_count']==53
          assert all(len(x['proof'])==9 for x in j['source_nine_independent_native_Deco_resource_to_named_BRES_correspondence_tests'])
          assert not j['source_original_instance_world_parent_matrix_AND_runtime_visibility_PROVEN']
          assert not j['source_original_material_shader_and_alpha_reconstructed']
          assert j['no_VPK_or_performance_changes']
          print('PASS original source archive actual order, unambiguous indexed Deco model bindings only when source directly confirms')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G38_NATIVE_ORIGINAL_2010_53_DECO_MODELS_ID_ORDER_PROVENANCE_NO_VPK
          path: |
            /tmp/g38/G38_original_source_native_models_53_Deco_index_links.json
            /tmp/g38/G38_original_53_Deco_native_model_links.csv
          retention-days: 14
          if-no-files-found: error
      - name: Delete temporary owner's original archival IPA
        if: always()
        run: rm -rf /tmp/g38/original.ipa
