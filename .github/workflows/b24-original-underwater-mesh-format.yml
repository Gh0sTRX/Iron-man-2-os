name: B24 Underwater BRES Mesh and Vita IM2T Format Research - No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/b24-original-underwater-mesh-format.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner_source_inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout vetted inventory tools
        uses: actions/checkout@v4
      - name: Retrieve exactly owner-provided original IPA via share URL into ephemeral runner
        run: |
          set -euo pipefail
          python3 -m pip install -q gdown
          mkdir -p /tmp/ironman-owner-ipa
          cd /tmp/ironman-owner-ipa
          # Only explicit owner-supplied 2026-10-14 exact Drive file ID.
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O source_v1.0.0.ipa
          test "$(wc -c < source_v1.0.0.ipa)" -eq 248613763
          echo "PASS exact owner-supplied original archive length; original archive NEVER uploaded as artifact"
      - name: Install numpy for original B11 2010 BRES source parser
        run: python3 -m pip install -q numpy
      - name: Decode real underwater BRES geometry and inspect exact Vita model loader
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,struct,sys,collections
          from pathlib import Path
          sys.path.insert(0,'research/b24_unified')
          from b24_owner_pack_extract import decode,get_exact
          with zipfile.ZipFile('/tmp/ironman-owner-ipa/source_v1.0.0.ipa') as z:
              packed={n:z.read('Payload/IronMan2.app/'+n) for n in ('models','textures','anims')}
          model=get_exact(packed['models'],decode(packed['models'],'.bdae'),'LC_MC_UnderWater.bdae')
          with zipfile.ZipFile('research/B11_C1L1_Source_Parser.zip') as z:
              code=z.read('bdae_scene_parser.py').decode()
          ns={'__name__':'real_2010_bres_parser','__file__':'bdae_scene_parser.py'}
          exec(compile(code,'bdae_scene_parser.py','exec'),ns)
          try:
              parts,meta=ns['parse'](model)
              print('UNDERWATER_SOURCE_BRES',len(parts),'components',sum(len(p['positions']) for p in parts),'vertices',
                  sum(len(p['faces'])//3 for p in parts),'triangles', 'material_count',sum(len(p['submeshes']) for p in parts))
              for m in parts[:9]:
                  print('AUTHENTIC_UNDERWATER_PART',m.get('name'),len(m['positions']),len(m['faces'])//3,
                     [(x.get('material'),len(x['faces'])//3) for x in m['submeshes'][:5]])
          except Exception as e:
              print('UNDERWATER_BRES_PARSER_NEEDS_SKIN_SUPPORT',type(e).__name__,str(e)[:240])
          import zipfile
          with zipfile.ZipFile('armor_b9/b9_overlay.zip') as b9:
              print('B9_OVERLAY_ENTRY_NAMES',b9.namelist()[:60])
              im2t=[n for n in b9.namelist() if n.endswith('.im2t')]
              if im2t:
                  raw=b9.read(im2t[0])
                  print('KNOWN_REAL_VITA_IM2T_HEADER',im2t[0],len(raw),raw[:80].hex())
          with zipfile.ZipFile('source/IronMan2_Vita_GitHub_Ready_CI_R2.zip') as base:
              print('VITA_MODEL_READER_SOURCES',[x for x in base.namelist() if 'model' in x.lower()][:25])
          for zpath in ('research/B6_Animation_Decoder_Runtime.zip','research/B13_Original_Armor_Animation_Audit.zip'):
              with zipfile.ZipFile(zpath) as z:
                  print('AVAILABLE_CONVERTERS',zpath,[x for x in z.namelist() if x.endswith('.py')][:30])
          PY
      - name: Ephemeral owner original IPA cleanup
        if: always()
        run: rm -rf /tmp/ironman-owner-ipa
