name: G281 Vita3K existing genuine G161 archive first actual boot probe NO NEW VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - '.github/workflows/g281-vita3k-existing-g161-real-archive-boot-probe-NO-NEW-VPK.yml'
      - 'research/b24_unified/g281_vita3k_real_archive_probe/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual_existing_G161_binary_attempt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      G281_LOGS: g281-diagnostics
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display graphics dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers libgl1 libegl1 libvulkan1
          mkdir -p "$G281_LOGS"
      - name: Verify Vita3K fixed upstream binary and original historical archive checker
        run: |
          set -euo pipefail
          python3 research/b24_unified/g280_vita3k_ci/test_g280_vita3k_bootstrap_contract.py
          python3 research/b24_unified/g280_vita3k_ci/test_g280_existing_archive_validation.py
          python3 research/b24_unified/g280_vita3k_ci/g280_prepare_pinned_vita3k.py --out "$RUNNER_TEMP/g281-vita3k" | tee "$G281_LOGS/pinned_emulator_sha256.txt"
          test -x "$RUNNER_TEMP/g281-vita3k/squashfs-root/AppRun"
      - name: Fetch PREVIOUS G161 user-authorized package from private existing artifact (never a new VPK)
        uses: actions/download-artifact@v4
        with:
          run-id: 39053725183
          name: G161_IronMan2_iOS_Original_StarkExpo_G160_Road_G156_Walls_G106_Sky_Flight_OneDevice_TEST_VPK
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/g281-old-G161
      - name: Attempt to load THE HISTORIC G161 VPK in official Vita3K under Xvfb
        run: |
          set -euo pipefail
          python3 research/b24_unified/g280_vita3k_ci/g280_existing_vpk_optional_probe.py \
            --app "$RUNNER_TEMP/g281-vita3k/squashfs-root/AppRun" \
            --folder "$RUNNER_TEMP/g281-old-G161" \
            --output "$G281_LOGS"
          test -s "$G281_LOGS/g280_emulator_result.json"
          cat "$G281_LOGS/g280_emulator_result.json"
          echo 'G281: only FIRST ATTEMPT. No official firmware installed, gameplay boot must not be inferred from duration or process code.'
      - name: Retain bounded text diagnosis only, never upload VPK/IPA or proprietary assets
        if: always()
        run: |
          mkdir -p "$G281_LOGS"
          test -z "$(find "$G281_LOGS" -type f \( -name '*.vpk' -o -name '*.ipa' -o -name '*.pup' \) -print -quit)"
          echo 'G281 historic G161 Vita3K exploratory boot. Previous build only. No NEW VPK, no firmware, no physical Vita test.' > "$G281_LOGS/README.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G281_OLD_G161_VITA3K_EMULATOR_PROBE_TEXT_ONLY_NO_NEW_VPK
          path: g281-diagnostics/
          if-no-files-found: warn
          retention-days: 7
