name: G209 genuine original 2010 StateDatabase StateSetData native loader to AttackType records NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g209-original-2010-native-StateDatabase-379-attacktype-source-loader-NO-VPK.yml"
      - "research/b24_unified/g209_original_2010_state_database_loader/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_iOS_2010_state_database_loaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Validate original 2010 owner source state loader and ARM decoder script
        run: |
          set -euo pipefail
          python3 -m py_compile research/b24_unified/g209_original_2010_state_database_loader/g209_2010_native_StateDatabase_StateSetData_asset_binary_loader_methods.py
          python3 -m pip install -q capstone gdown
      - uses: actions/download-artifact@v4
        with:
          name: G207_ORIGINAL_2010_379_ATTACKTYPE_RAW_U32_SOURCE_VALUES_NO_VPK
          run-id: 39128015289
          github-token: ${{ github.token }}
          path: /tmp/g209_original_source_values
      - name: Read owner original iOS 2010 IPA in private ephemeral GitHub Actions runner
        run: |
          set -euo pipefail
          mkdir -p /tmp/g209_private_original
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g209_private_original/owner.ipa ||
            gdown '131--LA4lrPKxpieS6LFKftIpkMY8YWsA' -O /tmp/g209_private_original/owner.ipa
          test "$(wc -c </tmp/g209_private_original/owner.ipa)" -eq 248613763
      - name: Source native 2010 StateDatabase and StateSetData ARM loader inventory typed original 379 AttackType key/value prerequisite
        run: |
          set -euo pipefail
          python3 research/b24_unified/g209_original_2010_state_database_loader/g209_2010_native_StateDatabase_StateSetData_asset_binary_loader_methods.py \
            --ipa /tmp/g209_private_original/owner.ipa \
            --g207 /tmp/g209_original_source_values/G207_ORIGINAL_2010_ATTACKTYPE_379_U32_SOURCE_VALUES.json \
            --out /tmp/g209_source/G209_ORIGINAL_2010_STATEDATABASE_STATESETDATA_NATIVE_LOADER_SYMBOLS.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/g209_source/G209_ORIGINAL_2010_STATEDATABASE_STATESETDATA_NATIVE_LOADER_SYMBOLS.json').read_text())
          assert d['source_2010_AttackType_379_u32_literals_verified']
          assert d['original_native_state_database_class_symbol_count']>5
          assert len(d['original_real_state_loader_candidate_methods'])>2
          assert not d['source_native_state_loader_puts_original_379_strings_into_StateData_proven']
          assert not d['original_touchscreen_input_and_selector_ALL_PROVEN']
          assert d['Vita_gameplay_logic_unchanged']
          assert d['NO_VPK']
          print('PASS G209 original iOS StateData native methods and loader candidates verified; no unsupported original file reader claim')
          PY
          test -z "$(find . -name '*.vpk' -print -quit)"
      - name: Erase user original source IPA regardless of job status
        if: always()
        run: rm -rf /tmp/g209_private_original
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: G209_ORIGINAL_2010_STATEDATABASE_STATESETDATA_CPP_LOADER_SOURCE_NO_VPK
          path: /tmp/g209_source/
          retention-days: 21
          if-no-files-found: error
