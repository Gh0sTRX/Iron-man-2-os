name: B17 Inspect Reconstructed Game Source and 304 Original Clips
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-b17.yml", "research/b17/**"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current B16E source for read-only audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          for z in source/IronMan2_Vita_GitHub_Ready_CI_R2.zip flight_b4/flight_b4_overlay.zip performance_b5/b5_optimized_renderer.zip skinning_b7/b7_vita_overlay.zip combat_b8/b8_overlay.zip armor_b9/b9_overlay.zip profile_b10/b10_overlay.zip third_person_b14/b14_overlay.zip mechanics_b15/b15_overlay.zip; do
            if [[ "$z" == "third_person_b14/b14_overlay.zip" ]]; then
              cat animation_b13/b13-overlay.part?? > /tmp/b13.zip
              echo "ec9b66b9b48ecf223fddd0b33e8c3889027de36be789516e721c9e1cc1fb0c13  /tmp/b13.zip" | sha256sum -c -
              unzip -oq /tmp/b13.zip -d work
            fi
            unzip -oq "$z" -d work
          done
          cat combat_b16/b16-overlay.part?? > /tmp/b16.zip
          echo "c6d8393fd0cf5e93302fffe0351319bb9b9a2bc41ff185d021e32163ad39993b  /tmp/b16.zip" | sha256sum -c -
          unzip -oq /tmp/b16.zip -d work
      - name: Print source map, controls, animation names and relevant code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          base=Path('work')
          print('===SOURCE INVENTORY===')
          for p in sorted((base/'src').glob('*')):
              if p.is_file():print(p.name,p.stat().st_size)
          print('===ANIMATION IM2V NAMES===')
          for p in sorted((base/'animations').glob('*.im2v')):print(p.stem)
          print('===RESEARCH B15 ZIP MEMBERS===')
          r=Path('research/B15_Original_All_Mechanics_Audit.zip')
          if r.exists():
              with zipfile.ZipFile(r) as z:
                  for n in z.namelist():print(n)
                  for n in z.namelist():
                      if n.endswith('.md') and ('304' in n or 'COMBAT' in n or 'MECHANIC' in n or 'README' in n):
                          b=z.read(n)
                          if len(b)<80000:
                              print('===RESEARCH===',n);print(b.decode('utf-8','replace')[:35000])
          for n in ['src/main.c','src/b16_action.c','src/b16_action.h','src/b14_world.c','src/b14_world.h','src/b14_pose.c','src/b14_pose.h','src/b13_motion.c','src/b13_motion.h','src/renderer.h','src/renderer.c','docs/B16_README_TR.md']:
              p=base/n
              if p.exists():
                  print('===SOURCE===',n,'bytes',p.stat().st_size)
                  for i,s in enumerate(p.read_text(errors='replace').splitlines(),1):
                      if n=='src/renderer.c' and i>160:break
                      print('%04d'%i,s)
          PY
