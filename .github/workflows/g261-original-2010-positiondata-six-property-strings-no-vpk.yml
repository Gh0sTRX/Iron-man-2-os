name: G261 Original 2010 PositionData Six CLARA Property Strings ARM No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - "research/b24_unified/g261_original_PositionData_six_property_keys/**"
      - ".github/workflows/g261-original-2010-positiondata-six-property-strings-no-vpk.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine_2010_PositionData_c_string_literals:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate original source typed six property decoder syntax
        run: python3 -m py_compile research/b24_unified/g261_original_PositionData_six_property_keys/g261_original_iOS2010_PositionData_getter_ARM_literal_property_keys.py
      - name: Install original ARM metadata parser and owner source retrieve
        run: python3 -m pip install -q capstone gdown
      - uses: actions/download-artifact@v4
        with:
          name: G260_ORIGINAL_2010_POSITIONDATA_CPP_WORLD_MATRIX_METHODS_NO_VPK
          run-id: 39262527719
          github-token: ${{ github.token }}
          path: /tmp/g261_genuine_previous
      - name: Fetch user-owned original 2010 iOS game transiently
        run: |
          set -euo pipefail
          mkdir -p /tmp/g261_original_private
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g261_original_private/owner.ipa ||
            gdown '131--LA4lrPKxpieS6LFKftIpkMY8YWsA' -O /tmp/g261_original_private/owner.ipa
          test "$(wc -c </tmp/g261_original_private/owner.ipa)" -eq 248613763
      - name: Prove original 2010 six position rotation scale parent raw scene properties
        run: |
          set -euo pipefail
          python3 research/b24_unified/g261_original_PositionData_six_property_keys/g261_original_iOS2010_PositionData_getter_ARM_literal_property_keys.py \
            --ipa /tmp/g261_original_private/owner.ipa \
            --g260 /tmp/g261_genuine_previous/G260_TRUE_2010_POSITIONDATA_WORLD_MATRIX_CPP_METHODS.json \
            --out /tmp/g261_sourcereport/G261_TRUE_ORIGINAL_2010_POSITIONDATA_SIX_NATIVE_PROPERTY_STRINGS.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/g261_sourcereport/G261_TRUE_ORIGINAL_2010_POSITIONDATA_SIX_NATIVE_PROPERTY_STRINGS.json').read_text())
          assert x['actual_2010_native_PositionData_LoadFromFile_VM']=='0xc815c'
          assert len(x['true_original_native_six_2010_typed_Transform_parameters'])==6
          assert not x['original_MC_runtime_ground_spawn_position_proven']
          assert not x['vita_physics_source_modified']
          assert x['NO_VPK']
          print('G261 genuine original 2010 PositionData six C++ property source keys proved; no fake Vita foot position')
          PY
          test -z "$(find . -name '*.vpk' -print -quit)"
      - name: Erase copyrighted original IPA from runner
        if: always()
        run: rm -rf /tmp/g261_original_private
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: G261_GENUINE_2010_POSITIONDATA_SIX_LITERAL_PROPERTIES_NO_VPK
          path: /tmp/g261_sourcereport/
          retention-days: 21
          if-no-files-found: error
