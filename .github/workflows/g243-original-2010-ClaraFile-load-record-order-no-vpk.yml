name: G243 Original 2010 ClaraFile Load RAM Order ARM No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - "research/b24_unified/g243_original_ClaraFile_Load_RAM_record_order/**"
      - ".github/workflows/g243-original-2010-ClaraFile-load-record-order-no-vpk.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_2010_native_loader:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate native original ClaraFile::Load parser syntax
        run: python3 -m py_compile research/b24_unified/g243_original_ClaraFile_Load_RAM_record_order/g243_2010_original_ClaraFile_Load_BufferStream_source_ARM.py
      - name: Install source disassembly dependencies
        run: python3 -m pip install -q capstone gdown
      - uses: actions/download-artifact@v4
        with:
          name: G242_ORIGINAL_2010_CLARAFILE_INDEXED_ENTITYDATA_SOURCE_NO_VPK
          run-id: 39225661749
          github-token: ${{ github.token }}
          path: /tmp/g243_prev
      - name: Read original owner 2010 IPA only on private disposable Actions runner
        run: |
          set -euo pipefail
          mkdir -p /tmp/g243_original
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g243_original/owner.ipa ||
            gdown '131--LA4lrPKxpieS6LFKftIpkMY8YWsA' -O /tmp/g243_original/owner.ipa
          test "$(wc -c </tmp/g243_original/owner.ipa)" -eq 248613763
      - name: Verify 2010 ClaraFile Load BufferStream native source and conservative order limits
        run: |
          set -euo pipefail
          python3 research/b24_unified/g243_original_ClaraFile_Load_RAM_record_order/g243_2010_original_ClaraFile_Load_BufferStream_source_ARM.py \
            --ipa /tmp/g243_original/owner.ipa \
            --g242 /tmp/g243_prev/G242_ORIGINAL_2010_CLARAFILE_ENTITYDATA_INDEXED_NATIVE_SOURCE.json \
            --out /tmp/g243_source/G243_REAL_ORIGINAL_CLARAFILE_NATIVE_BUFFERSTREAM_LOADER.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('/tmp/g243_source/G243_REAL_ORIGINAL_CLARAFILE_NATIVE_BUFFERSTREAM_LOADER.json').read_text())
          assert d['original_native_method_cpp']=='ClaraFile::Load(BufferStream&)'
          assert d['native_original_method_VM']=='0xd5a94'
          assert d['original_method_native_ARM_instruction_count']>=60
          assert d['original_native_GetEntityData_stride_bytes']==36
          assert not d['original_native_Clara_Ram_order_equals_C1L1_disk_order_PROVEN']
          assert not d['original_WM_missile_or_Attack_type0_WeaponDB_index_named_PROVEN']
          assert not d['original_Vita_gameplay_modified']
          assert d['NO_VPK']
          print('G243 PASS true original 2010 ClaraFile Load native ARM source; no invented index order')
          PY
          test -z "$(find . -name '*.vpk' -print -quit)"
      - name: Delete original copyrighted original app copy after use
        if: always()
        run: rm -rf /tmp/g243_original
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: G243_REAL_ORIGINAL_CLARAFILE_BUFFERSTREAM_ARM_SOURCE_NO_VPK
          path: /tmp/g243_source/
          retention-days: 21
          if-no-files-found: error
