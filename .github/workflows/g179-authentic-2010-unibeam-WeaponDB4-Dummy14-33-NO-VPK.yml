name: G179 ORIGINAL iOS UniBeam WeaponDB index4 dummy selection int14 int33 real ARM proof NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g179-authentic-2010-unibeam-WeaponDB4-Dummy14-33-NO-VPK.yml"
      - "research/b24_unified/g179_original_beam_attachment_args/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real_2010_original_unibeam_values_4_14_33:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: G177_REAL_ORIGINAL_2010_UNIBEAM_ATTACK_INDEX4_NATIVE_ARM_PROVEN_NO_VPK
          run-id: 39108312594
          github-token: ${{ github.token }}
          path: /tmp/g179_original_index
      - uses: actions/download-artifact@v4
        with:
          name: G178_2010_OWNER_DOATTACK_UNIBEAM_3_SOURCE_ARM_CALLS_NO_VPK
          run-id: 39108481599
          github-token: ${{ github.token }}
          path: /tmp/g179_original_branches
      - name: Prove exact 2010 iOS original three UniBeam native dummy int arguments no fabricated chest socket
        run: |
          set -euo pipefail
          python3 -m py_compile research/b24_unified/g179_original_beam_attachment_args/g179_2010_real_unibeam_attack_index4_and_dummy_selection14_33.py
          python3 research/b24_unified/g179_original_beam_attachment_args/g179_2010_real_unibeam_attack_index4_and_dummy_selection14_33.py \
            --g177 /tmp/g179_original_index/G177_AUTHENTIC_2010_UNIBEAM_WEAPONDB_INDEX4_DUMMY_PARAM_ARM.json \
            --g178 /tmp/g179_original_branches/G178_ORIGINAL_2010_MAINCHARACTER_DOATTACK_THREE_UNIBEAM_CALLSITE_ARM.json \
            --out /tmp/g179_source/G179_ORIGINAL_2010_UNIBEAM_WeaponDB4_DUMMY14_14_33_NATIVE_PROOF.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/g179_source/G179_ORIGINAL_2010_UNIBEAM_WeaponDB4_DUMMY14_14_33_NATIVE_PROOF.json').read_text())
          assert d['original_UniBeam_WeaponDB_Attack_index_proven']==4
          assert d['original_DoAttack_to_UniBeam_arg0_native_integer_values']==[14,14,33]
          assert len(d['original_three_exact_native_callsite_proofs'])==3
          assert not d['original_dummy_index14_actual_original_bone_or_scene_node_PROVEN']
          assert not d['original_dummy_index33_actual_original_bone_or_scene_node_PROVEN']
          assert d['B24_game_weapon_or_Actor_state_modified'] is False
          assert d['NO_VPK']
          print('PASS G179 real original 2010 weapon DB index4 and native dummy argument 14/14/33, no invented socket or VPK')
          PY
          test -z "$(find . -name '*.vpk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: G179_ORIGINAL_2010_UNIBEAM_INDEX4_14_33_ARM_NATIVE_ARG_PROVEN_NO_VPK
          path: /tmp/g179_source/G179_ORIGINAL_2010_UNIBEAM_WeaponDB4_DUMMY14_14_33_NATIVE_PROOF.json
          retention-days: 14
          if-no-files-found: error
