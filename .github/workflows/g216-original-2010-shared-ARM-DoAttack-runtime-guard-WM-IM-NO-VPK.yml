name: G216 original iOS 2010 shared IronMan WarMachine DoAttack ARM runtime guards NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g216-original-2010-shared-ARM-DoAttack-runtime-guard-WM-IM-NO-VPK.yml"
      - "research/b24_unified/g216_original_native_attack_branch_runtime_guards/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_2010_arm_source_wm_im_runtime_attack_guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Source-only original 2010 ARM guard analysis syntax check
        run: |
          set -euo pipefail
          python3 -m py_compile research/b24_unified/g216_original_native_attack_branch_runtime_guards/g216_source_2010_IronMan_WM_shared_ARM_attack_branch_runtime_guard_dataflow.py
      - uses: actions/download-artifact@v4
        with:
          name: G196_ORIGINAL_2010_NATIVE_UNIBEAM_14_33_GUARD_CFG_SOURCE_PNG_NO_VPK
          run-id: 39124662533
          github-token: ${{ github.token }}
          path: /tmp/g216_source_arm2010
      - uses: actions/download-artifact@v4
        with:
          name: G214_ORIGINAL_2010_4_PLAYER_SUIT_ATTACKTYPE_SOURCE_COMPARE_PNG_NO_VPK
          run-id: 39133010389
          github-token: ${{ github.token }}
          path: /tmp/g216_source_suit2010
      - name: Prove original iOS 2010 shared DoAttack branches are guarded by real runtime actor state and current weapon code
        run: |
          set -euo pipefail
          python3 research/b24_unified/g216_original_native_attack_branch_runtime_guards/g216_source_2010_IronMan_WM_shared_ARM_attack_branch_runtime_guard_dataflow.py \
            --g196 /tmp/g216_source_arm2010/G196_ORIGINAL_2010_UNIBEAM_CHEST_FOOT_NATIVE_DISPATCH_CFG.json \
            --g214 /tmp/g216_source_suit2010/G214_ORIGINAL_2010_4_PLAYER_SUIT_ATTACKTYPE_SOURCE_COMPARISON.json \
            --out /tmp/g216_public/G216_ORIGINAL_2010_ARM_RUNTIME_MODE_WEAPON_GUARD_IM_WM_SOURCE.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/g216_public/G216_ORIGINAL_2010_ARM_RUNTIME_MODE_WEAPON_GUARD_IM_WM_SOURCE.json').read_text())
          assert d['exact_source_asserted_original_ARM_instructions']>=35
          assert len(d['source_original_2010_armor_different_AttackType_but_shared_Cpp_switch_entry'])==2
          assert d['real_2010_shared_case_1_18_honors_native_runtime_object_member_at_R4_plus_0x5e4']
          assert d['real_2010_shared_case_1_18_branches_source_R6_runtime_values_0_1_2']
          assert d['source_real_2010_shared_case_1_18_calls_orig_weapon_manager_get_current']
          assert d['source_2010_native_shared_case_2_25_calls_CurrentWeapon_and_virtual_0x128']
          assert not d['original_Cpp_meaning_of_R4_plus_0x5e4_or_0x10_0x16_suit_weapon_identified']
          assert not d['source_original_native_cpp_method_at_virtual_0x128_or_weapon_ID_proven']
          assert not d['original_source_same_branch_proves_same_weapon_effect_output']
          assert not d['Vita_G83_G169_original_animation_owner_or_input_modified']
          assert d['NO_VPK']
          print('PASS G216 true 2010 native IM/WM branch guards; same original switch case is not same weapon, no invented Aim_M/rocket mapping')
          PY
          test -z "$(find . -name '*.vpk' -print -quit)"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: G216_REAL_2010_IM_WM_SHARED_BRANCH_RUNTIME_GUARDS_ARM_NO_VPK
          path: /tmp/g216_public/
          retention-days: 21
          if-no-files-found: error
