name: G8 True Original WM Suit Plus 2010 Gun01-04 Rigid Markers Host Screens NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/b24-g8-wm-original-body-gun-overlay-host-screens.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine_suit_gun_overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reuse VERIFIED original G8 397 motion source bank without new owner IPA download
        uses: actions/download-artifact@v4
        with:
          name: G8_397_Sourced_Player_Motion_Files_Not_VPK
          run-id: 38607065765
          github-token: ${{ github.token }}
          path: /tmp/g8-original-player-source
      - name: Reuse VERIFIED true source 6-node IM2K War Machine gun motion streams
        uses: actions/download-artifact@v4
        with:
          name: G8_WM_2010_Source_Gun01_04_Keyframes_And_Original_Scene_Parent_Proof
          run-id: 38612044624
          github-token: ${{ github.token }}
          path: /tmp/g8-original-gun-source
      - name: Reconstruct exact G8 original textured CPU renderer source without VPK
        run: |
          set -euo pipefail
          mkdir -p work
          for file in source/IronMan2_Vita_GitHub_Ready_CI_R2.zip flight_b4/flight_b4_overlay.zip performance_b5/b5_optimized_renderer.zip skinning_b7/b7_vita_overlay.zip combat_b8/b8_overlay.zip armor_b9/b9_overlay.zip profile_b10/b10_overlay.zip; do unzip -oq "$file" -d work; done
          cat animation_b13/b13-overlay.part?? >/tmp/b13-overlay.zip
          echo 'ec9b66b9b48ecf223fddd0b33e8c3889027de36be789516e721c9e1cc1fb0c13  /tmp/b13-overlay.zip' | sha256sum -c -
          unzip -oq /tmp/b13-overlay.zip -d work
          unzip -oq third_person_b14/b14_overlay.zip -d work
          unzip -oq mechanics_b15/b15_overlay.zip -d work
          for i in 00 01 02 03 04 05; do cat "combat_b16/b16-overlay.part${i}"; done >/tmp/b16-overlay.zip
          echo 'c6d8393fd0cf5e93302fffe0351319bb9b9a2bc41ff185d021e32163ad39993b  /tmp/b16-overlay.zip' | sha256sum -c -
          unzip -oq /tmp/b16-overlay.zip -d work
          python3 research/b17/apply_b17.py
          python3 research/b24_unified/assemble_b24_modules.py
          python3 research/b24_unified/apply_b24.py
          python3 research/b24_unified/apply_b24_c1.py
          python3 research/b24_unified/apply_b24_c2_fix.py
          test -s work/models/warmachine.im2t
          test -s /tmp/g8-original-player-source/animations/warmachine_warmachine_aim_float_move_r_att.im2v
          test -s /tmp/g8-original-gun-source/WM_2010_Gun01_04_Original_IM2K/warmachine_aim_float_move_r_att.im2k
      - name: Compile actual G8 CPU model raster + original body/gun source stream synchronized overlay
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -Wno-error=unused-function \
             -Iwork/src -Iresearch/b24_unified -Iwork/b24/b24_unified \
             research/b24_unified/b24_g8_wm_original_gun_on_suit_host.c \
             work/src/renderer.c work/b24/b24_unified/b24_c1l1_map.c \
             research/b24_unified/b24_original_im2v_stream.c \
             research/b24_unified/b24_wm_2010_gun_stream.c \
             -lm -o /tmp/g8_wm_original_suit_guns_host
          mkdir -p /tmp/G8_ORIGINAL_WM_TRUE_SUIT_GUN_2010_MARKER_SCREENSHOTS
          (cd work && /tmp/g8_wm_original_suit_guns_host \
             models/warmachine.im2t \
             /tmp/g8-original-player-source/animations \
             /tmp/g8-original-gun-source/WM_2010_Gun01_04_Original_IM2K \
             /tmp/G8_ORIGINAL_WM_TRUE_SUIT_GUN_2010_MARKER_SCREENSHOTS)
      - name: Produce contact sheet from 18 true CPU suit + 2010 gun source diagnostic overlays
        run: |
          set -euo pipefail
          python3 -m pip install -q pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json
          out=Path('/tmp/G8_ORIGINAL_WM_TRUE_SUIT_GUN_2010_MARKER_SCREENSHOTS')
          frames=sorted(out.glob('*.ppm'))
          assert len(frames)==18,len(frames)
          mid=[p for p in frames if '_k' in p.stem]
          proof=[]
          board=Image.new('RGB',(3*480,6*309+62),(11,18,30))
          d=ImageDraw.Draw(board)
          d.text((16,15),'ORIGINAL G8 WAR MACHINE IM2T + SYNCHRONIZED ORIGINAL 2010 BODY/GUN NODES (6 x 3)',fill='white')
          for k,p in enumerate(frames):
              im=Image.open(p).convert('RGB')
              assert im.size==(480,272)
              variety=len(set(im.resize((40,30)).getdata()))
              assert variety>15
              x=(k%3)*480;y=62+(k//3)*309
              board.paste(im,(x,y))
              d.text((x+8,y+277),p.stem,fill=(242,246,255))
              im.save(p.with_suffix('.png'))
              p.unlink()
              proof.append({'frame':p.stem,'source_color_variety':variety,
                            'real_source_body_IM2V':True,'source_gun_IM2K':True,
                            'source_marker_is_verified_muzzle':False})
          out.joinpath('G8_WM_ORIGINAL_SUIT_SOURCE_GUN01_04_18_FRAME_CONTACT.png').parent.mkdir(parents=True,exist_ok=True)
          board.save(out/'G8_WM_ORIGINAL_SUIT_SOURCE_GUN01_04_18_FRAME_CONTACT.png')
          (out/'G8_WM_SOURCE_GUN_ON_SUIT_CAPTURE_PROOF.json').write_text(
              json.dumps({'real_G8_IM2T_CPU_render':True,
                          'original_2010_synchronized_body_and_rigid_guns':True,
                          'verified_muzzle_emitter':False,
                          'Vita_GPU_screenshot':False,
                          'source_sample_count':18,'frames':proof},indent=2))
          print('PASS 18 G8 TRUE ORIGINAL TEXTURED WAR MACHINE plus original 2010 rigid gun source synchronized screens, diagnostic-only, NO VPK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G8_WM_Original_IM2V_IM2K_Suit_Animated_Gun_Marker_19_PNG_Host_Gallery
          path: /tmp/G8_ORIGINAL_WM_TRUE_SUIT_GUN_2010_MARKER_SCREENSHOTS/
          if-no-files-found: error
          retention-days: 14
