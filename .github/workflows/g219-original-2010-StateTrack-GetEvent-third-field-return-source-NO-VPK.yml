name: G219 original 2010 StateTrack GetEvent all ARM opcodes third-field semantics source NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g219-original-2010-StateTrack-GetEvent-third-field-return-source-NO-VPK.yml"
      - "research/b24_unified/g219_original_statetrack_event_semantics/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_source_2010_original_state_event_return_semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - name: Validate original iOS ARM StateTrack exact method source parser
        run: |
          set -euo pipefail
          python3 -m py_compile research/b24_unified/g219_original_statetrack_event_semantics/g219_real_2010_iOS_StateTrack_GetEvent_full_ARM_return_and_Actor_consumer.py
          python3 -m pip install -q capstone gdown
      - name: Read authentic user owned 2010 iOS game file in ephemeral private runner
        run: |
          set -euo pipefail
          mkdir -p /tmp/g219_original_private
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g219_original_private/owner.ipa ||
            gdown '131--LA4lrPKxpieS6LFKftIpkMY8YWsA' -O /tmp/g219_original_private/owner.ipa
          test "$(wc -c </tmp/g219_original_private/owner.ipa)" -eq 248613763
      - name: Verify original 2010 native StateTrack GetEvent full opcode body plus Actor UpdateStateAttack consumer and third field reads NO guessed damage
        run: |
          set -euo pipefail
          python3 research/b24_unified/g219_original_statetrack_event_semantics/g219_real_2010_iOS_StateTrack_GetEvent_full_ARM_return_and_Actor_consumer.py \
            --ipa /tmp/g219_original_private/owner.ipa \
            --out /tmp/g219_source/G219_ORIGINAL_2010_STATETRACK_GETEVENT_THIRD_FIELD_NATIVE_ARM.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('/tmp/g219_source/G219_ORIGINAL_2010_STATETRACK_GETEVENT_THIRD_FIELD_NATIVE_ARM.json').read_text())
          assert d['original_StateTrack_GetEvent_VM']=='0xa14f0'
          assert d['original_event_timeline_record_stride_12_bytes_proven']
          assert d['source_native_StateTrack_GetEvent_returns_overlapping_original_12byte_EVENT_INDEX_or_minus1_PROVEN']
          assert d['source_native_StateTrack_GetEvent_does_NOT_decode_3rd_u32_event_payload']
          assert d['source_native_original_third_u32_payload_remains_UNCLASSIFIED']
          assert d['real_native_original_methods_source']['event']['original_native_instruction_count']>=45
          assert not d['source_native_returned_Event_id_semantics_PROVEN']
          assert not d['original_attack_event_time_unit_ms_PROVEN']
          assert not d['original_native_weapon_or_melee_damage_use_of_event_id_proven']
          assert not d['G218_live_G8_G217_observer_changed']
          assert d['NO_VPK']
          print('G219 source actual 2010 original StateTrack Event third field inspect-only full ARM; G218 live Vita single animated source unchanged, no VPK')
          PY
          test -z "$(find . -name '*.vpk' -print -quit)"
      - name: Erase original licensed 2010 source IPA on every result
        if: always()
        run: rm -rf /tmp/g219_original_private
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: G219_ORIGINAL_2010_STATETRACK_GETEVENT_THIRD_FIELD_ARM_SOURCE_NO_VPK
          path: /tmp/g219_source/
          retention-days: 21
          if-no-files-found: error
