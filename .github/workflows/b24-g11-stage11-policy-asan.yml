name: G11 Original Gameplay Fire Stage Policy Host Test
on:
  workflow_dispatch:
  push:
    branches:
      - feature/b24-unified-gameplay
    paths:
      - .github/workflows/b24-g11-stage11-policy-asan.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C11 source stage shooting unit test
        run: |
          set -eu
          cc -std=c11 -O1 -Wall -Wextra -Werror -pedantic research/b24_unified/b24_g11_combat_stage_policy.c research/b24_unified/test_b24_g11_combat_stage_policy.c -lm -o /tmp/g11_stage_unit
          /tmp/g11_stage_unit
