name: G32 original 2010 C1L1 true BRES UV plus owner PVR texture WebGL2 source QA NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g32-original-2010-c1l1-real-textured-webgl2-source.yml"
      - "research/b24_unified/b24_g32_original_2010_BRES_PVR_UV_real_textured_WebGL2.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real_original_textured_scene:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install original PVR source codec and scene render dependencies
        run: python3 -m pip install -q numpy pillow texture2ddecoder gdown
      - name: Temporary owner source game
        run: |
          mkdir -p /tmp/g32
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g32/owner.ipa
          test "$(wc -c </tmp/g32/owner.ipa)" -eq 248613763
      - name: Integrate authentic C1L1 BRES UV float32 and native owner original PVR atlas pixels into WebGL2 source inspector
        run: |
          python3 research/b24_unified/b24_g32_original_2010_BRES_PVR_UV_real_textured_WebGL2.py --ipa /tmp/g32/owner.ipa --html /tmp/g32/G32_IOS2010_ORIJINAL_PVR_UV_3B_HARITA.html --report /tmp/g32/G32_ORIGINAL_PVR_UV_TRIANGLE_PROOF.json
      - name: Verify authentic source texel and material match, preserve unproven shader
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/g32/G32_ORIGINAL_PVR_UV_TRIANGLE_PROOF.json').read_text())
          assert d['source_meshes']==370
          assert d['triangles']==22919
          assert d['vertices']==37946
          assert d['native_original_2010_BRES_mesh_uv_float32_pairs']==37946
          assert d['original_source_PVR_textured_faces']==18774
          assert d['source_original_PVR_bank']['original_user_owner_C1L1_tga_atlases']==39
          assert d['source_original_PVR_bank']['original_user_owner_expo_tga_one_present']
          assert d['source_original_BRES_PVR_UV_atlases_rendered_when_WebGL2_enabled']
          assert not d['source_original_shader_lighting_alpha_blend_emissive_rebuilt']
          assert not d['source_world_parent_matrix_camera_motion_rebuilt']
          assert d['source_bare_unknown_material_not_fake_textured']
          assert d['NO_VPK']
          s=Path('/tmp/g32/G32_IOS2010_ORIJINAL_PVR_UV_3B_HARITA.html')
          assert s.stat().st_size>1000000
          print('PASS native owner original 2010 BRES geometry + PVR texture atlas RGBA + exact UV source staging no VPK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G32_2010_ORIGINAL_BRES_40_PVR_BANK_TRUE_UV_18774_FACES_WEBGL2_3D_HTML_NO_VPK
          path: |
            /tmp/g32/G32_IOS2010_ORIJINAL_PVR_UV_3B_HARITA.html
            /tmp/g32/G32_ORIGINAL_PVR_UV_TRIANGLE_PROOF.json
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: rm -rf /tmp/g32/owner.ipa
