name: Canonical source — host checks and full Vita ARM ELF
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: ['src/**', 'cmake/**', 'tests/**', 'tools/**', 'CMakeLists.txt', '.github/workflows/source-build.yml']
  pull_request:
    paths: ['src/**', 'cmake/**', 'tests/**', 'tools/**', 'CMakeLists.txt', '.github/workflows/source-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        sanitizers: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - name: Source-only host checks; synthetic data, no owner assets
        env:
          IM2_SANITIZERS: '${{ matrix.sanitizers }}'
        run: bash tools/test_host.sh
  vita-elf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned SDK only
        run: docker pull vitasdk/vitasdk@sha256:8227da1b596d981f4513cd9b36bda1e43857f6dae5bcf4312c1cd40167f7d9bb
      - name: Build the complete canonical source directly; no original assets or patchers
        run: bash tools/build_vita.sh
      - name: Confirm output and no package
        run: |
          set -euo pipefail
          file build-vita/im2_beta
          test -s build-vita/im2_beta
          test -z "$(find build-vita -type f -name '*.vpk' -print -quit)"
  source-check-receipt:
    if: ${{ always() && github.event_name == 'push' }}
    needs: [host, vita-elf]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Save bounded source-only CI results, without binaries or owner data
        env:
          IM2_HOST_RESULT: '${{ needs.host.result }}'
          IM2_VITA_RESULT: '${{ needs.vita-elf.result }}'
          IM2_SOURCE_SHA: '${{ github.sha }}'
          IM2_RUN_ID: '${{ github.run_id }}'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('/tmp/im2-ci-receipt.json')
          p.write_text(json.dumps(dict(source_commit=os.environ['IM2_SOURCE_SHA'],
            run_id=os.environ['IM2_RUN_ID'],host_with_and_without_sanitizers=os.environ['IM2_HOST_RESULT'],
            full_vita_arm_elf=os.environ['IM2_VITA_RESULT'],owner_data_used=False,
            package_created=False,device_tested=False),indent=2)+'\n')
          PY
          git checkout --orphan evidence/source-checks-${{ github.run_id }}
          git rm -rf --cached . >/dev/null
          mkdir -p diagnostics
          cp /tmp/im2-ci-receipt.json diagnostics/source-checks.json
          git add --force diagnostics/source-checks.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record source-only host and ARM build results'
          git push origin HEAD:refs/heads/evidence/source-checks-${{ github.run_id }}
