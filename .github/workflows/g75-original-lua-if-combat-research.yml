name: G75 Real 2010 Level1 Lua Conditional Combat and Mission Script Static Research No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g75-original-lua-if-combat-research.yml"
      - "research/b24_unified/g75_device_qa/g75_2010_lua_original_if_combat_probe.py"
      - "research/b24_unified/g75_device_qa/g75_2010_attack_conditions_opcode_context.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_bytecode:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install one native original LUA source decoder tool
        run: python3 -m pip install -q numpy pillow gdown
      - name: Retrieve user supplied original 2010 IPA for ephemeral source audit only
        run: |
          mkdir -p /tmp/g75_owner_lua
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g75_owner_lua/owned_original.ipa ||
           gdown '131--LA4lrPKxpieS6LFKftIpkMY8YWsA' -O /tmp/g75_owner_lua/owned_original.ipa
          test "$(wc -c </tmp/g75_owner_lua/owned_original.ipa)" -eq 248613763
      - name: Audit 2010 source mission conditional/callsite branch evidence
        run: |
          python3 research/b24_unified/g75_device_qa/g75_2010_lua_original_if_combat_probe.py \
           --ipa /tmp/g75_owner_lua/owned_original.ipa \
           --out /tmp/g75_owner_lua_results.json
          python3 research/b24_unified/g75_device_qa/g75_2010_attack_conditions_opcode_context.py \
           --ipa /tmp/g75_owner_lua/owned_original.ipa \
           --out /tmp/g75_owner_attack_conditions.json
          rm -rf /tmp/g75_owner_lua
      - uses: actions/upload-artifact@v4
        with:
          name: G75_Genuine_2010_Level1_71_LUA_If_Branches_Combat_Engine_Callsite_Metadata_NO_VPK
          path: |
            /tmp/g75_owner_lua_results.json
            /tmp/g75_owner_attack_conditions.json
          retention-days: 14
          if-no-files-found: error
      - name: Scrub owner original source file after fail
        if: always()
        run: rm -rf /tmp/g75_owner_lua
