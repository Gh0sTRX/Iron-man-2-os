name: MAP FIRST actual original 2010 64byte material tables property links to C1L1 textures NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/b24-map-first-2010-true-material-properties.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_real_materials:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: True Gameloft original 2010 BRES v778 64-byte material properties
        run: |
          python3 research/b24_unified/b24_map_first_2010_bres_real_material_properties.py \
            --out /tmp/MAP_FIRST_C1L1_GENUINE_MATERIAL_PROPERTY_RECORDS.json
      - name: Validate real user-owned ten BRES model files and shader material records
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/MAP_FIRST_C1L1_GENUINE_MATERIAL_PROPERTY_RECORDS.json').read_text())
          assert len(d['original_real_BRES_material_decl_tables'])==10
          assert sum(x['64byte_material_definitions'] for x in d['original_real_BRES_material_decl_tables'])>=45
          assert not d['material_to_exact_PVR_samplers_verified']
          print('PASS 2010 authentic material definitions independent of BRES mesh labels, still no texture claims')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MAP_FIRST_REAL_IOS_2010_Level1_BRES_Material_Properties_Pointer_Chain
          path: /tmp/MAP_FIRST_C1L1_GENUINE_MATERIAL_PROPERTY_RECORDS.json
          if-no-files-found: error
