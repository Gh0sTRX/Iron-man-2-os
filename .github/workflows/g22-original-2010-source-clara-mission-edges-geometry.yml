name: G22 REAL 2010 C1L1 original Deco fence actor event arrows and 370 mesh XY diagnostic NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/g22-original-2010-source-clara-mission-edges-geometry.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_event_target_world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q numpy pillow gdown
      - name: Temporary owner original IPA for private original byte validation
        run: |
          mkdir -p /tmp/g22
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g22/owner.ipa
          test "$(wc -c </tmp/g22/owner.ipa)" -eq 248613763
      - name: Draw only source-authored real 2010 C1L1 BRES triangles with exact CLARA event target positions
        run: |
          python3 research/b24_unified/b24_g22_original_C1L1_event_target_fence_source_world_render.py --ipa /tmp/g22/owner.ipa --out /tmp/g22/scene.json --png /tmp/g22/scene.png --html /tmp/g22/scene.html
      - name: Check original owner source and no gameplay claims
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          d=json.loads(Path('/tmp/g22/scene.json').read_text())
          assert d['source_real_2010_clara_event_edges']==3
          assert d['source_fence_typed_transform_records']==2
          assert d['original_authored_BRES_city_meshes']==370 and d['original_authored_BRES_city_triangles']==22919
          assert all(x['both_endpoints_native_source_transform_typed'] for x in d['three_native_source_onDestroy_Enable_Disable_links_with_both_authored_positions'])
          assert not d['original_2010_trigger_runtime_execution_verified']
          assert not d['original_player_start_confirmed']
          assert d['no_gameplay_or_VPK_build']
          assert Image.open('/tmp/g22/scene.png').size==(1400,920)
          assert Path('/tmp/g22/scene.html').stat().st_size>10000
          print('PASS original source exact event arrows + true authored mesh, no VPK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G22_2010_REAL_CITY_16_SPAWNS_2_FENCE_ACTORS_3_AUTHENTIC_EVENT_ARROWS_HTML_PNG_NO_VPK
          path: |
            /tmp/g22/scene.json
            /tmp/g22/scene.png
            /tmp/g22/scene.html
          retention-days: 14
          if-no-files-found: error
      - name: Delete owner IPA
        if: always()
        run: rm -rf /tmp/g22/owner.ipa
