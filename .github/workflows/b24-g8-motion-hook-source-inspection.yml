name: G8 motion hook source inspection no VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths: [".github/workflows/b24-g8-motion-hook-source-inspection.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct active gameplay C files without game build or owner IPA
        run: |
          set -euo pipefail
          mkdir -p work
          for zip in source/IronMan2_Vita_GitHub_Ready_CI_R2.zip flight_b4/flight_b4_overlay.zip performance_b5/b5_optimized_renderer.zip skinning_b7/b7_vita_overlay.zip combat_b8/b8_overlay.zip armor_b9/b9_overlay.zip profile_b10/b10_overlay.zip; do unzip -oq "$zip" -d work; done
          cat animation_b13/b13-overlay.part?? >/tmp/b13-overlay.zip
          echo 'ec9b66b9b48ecf223fddd0b33e8c3889027de36be789516e721c9e1cc1fb0c13  /tmp/b13-overlay.zip' | sha256sum -c -
          unzip -oq /tmp/b13-overlay.zip -d work
          unzip -oq third_person_b14/b14_overlay.zip -d work
          unzip -oq mechanics_b15/b15_overlay.zip -d work
          for i in 00 01 02 03 04 05; do cat "combat_b16/b16-overlay.part${i}"; done >/tmp/b16-overlay.zip
          echo 'c6d8393fd0cf5e93302fffe0351319bb9b9a2bc41ff185d021e32163ad39993b  /tmp/b16-overlay.zip' | sha256sum -c -
          unzip -oq /tmp/b16-overlay.zip -d work
          python3 research/b17/apply_b17.py
          python3 research/b24_unified/assemble_b24_modules.py
          python3 research/b24_unified/apply_b24.py
          python3 research/b24_unified/apply_b24_c1.py
          python3 research/b24_unified/apply_b24_c2_fix.py
          python3 research/b24_unified/apply_b24_right_arm_source_only.py
          python3 research/b24_unified/apply_b24_gpu_main_source_only.py
          python3 research/b24_unified/apply_b24_g5_gameplay_source_only.py
          python3 research/b24_unified/apply_b24_g6_controls_source_only.py
          python3 research/b24_unified/apply_b24_g7_original_collisions_source_only.py
          python3 research/b24_unified/apply_b24_g8_original_world_bounds_source_only.py
      - name: Print focused real source pose/load/control call sites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks={
            'main.c':['static int load','running=load(idx)','b14_world_tick','b14_pose','b16_attack','b24_unified_tick','b24_gpu_runtime_draw','im2_camera','SDL_GetTicks','SDL_CONTROLLERBUTTON','float now','b16_action_apply','motion13','b7_'],
            'b14_pose.c':['void b14','int b14','B14_','b13','b7','pose'],
            'b14_world.h':['typedef struct','B14_','int flying','flight_stage'],
            'b16_action.c':['void b16','int b16','b16_action','b16_attack'],
            'main.h':['IM2Model']}
          for name,keys in checks.items():
            p=Path('work/src')/name
            if not p.exists():continue
            lines=p.read_text().splitlines()
            indexes=[i for i,x in enumerate(lines) if any(key in x for key in keys)]
            windows=set()
            for i in indexes:
                before,after=(max(0,i-8),min(len(lines),i+13))
                if name=='main.c':
                    before,after=(max(0,i-5),min(len(lines),i+13))
                windows.update(range(before,after))
            print('### REAL SOURCE',name,'TOTAL',len(lines),'FOCUSED_LINES',min(len(windows),290))
            shown=0
            for i in sorted(windows):
                if shown>=290:break
                print(f'{i+1:04} {lines[i][:185]}')
                shown+=1
          PY

      - name: Enumerate original CPU 3D preview and asset API for true host screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("work/src")
          print("HOST_3D_SOURCES",[p.name for p in src.glob("*.c") if "preview" in p.name or "render" in p.name or "model" in p.name])
          for name in ("renderer.h","renderer.c","preview.c","im2_preview.c","model.h","model.c"):
              p=src/name
              if not p.exists():continue
              print("ORIGINAL_G8_HOST_MODULE",name)
              lines=p.read_text().splitlines()
              for i,line in enumerate(lines[:115],1):
                  if name=="renderer.c" and i>65:break
                  print(f"API:{name}:{i:03} {line[:210]}")
          cm=Path("work/CMakeLists.txt").read_text().splitlines()
          print("G8_HOST_CMAKE_LINES")
          for line in cm:
              if any(w in line for w in ("preview","renderer","model","SDL","im2_beta","target_include","add_executable")):print(line[:210])
          PY

      - name: Inspect real G8 CPU raster projection matrices and model camera positioning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('renderer.h','renderer.c','b14_world.h','b14_world.c'):
              p=Path('work/src')/name
              if p.exists():
                  lines=p.read_text().splitlines()
                  print('G8_PROJECTION_SOURCE',name,'TOTAL',len(lines))
                  if name.startswith('renderer'):
                      for i,line in enumerate(lines[:600],1):print(f'G8PROJ {name}:{i:03} {line[:180]}')
                  elif name=='b14_world.h':
                      for i,line in enumerate(lines[:145],1):print(f'G8B14 {name}:{i:03} {line[:180]}')
          PY

      - name: Locate exact G8 foot-to-ground B14 pose root and L-lock observation assignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("b14_world.c","b14_pose.c","main.c"):
              p=Path("work/src")/name
              if not p.is_file():continue
              lines=p.read_text().splitlines()
              if name=="b14_world.c":
                  for i,line in enumerate(lines): print(f"G10B14:{i+1:03} {line[:195]}")
              else:
                  terms=("b14_world_tick","b14_pose_tick_ex","b24_obs.target_",
                         "b24_unified_tick(","b24_obs.weapon_index",
                         "b24_obs.target_visible","world.z","camera.hover_bob",
                         "b24_gpu_runtime_draw")
                  indices={j for i,line in enumerate(lines) if any(t in line for t in terms)
                           for j in range(max(0,i-6),min(len(lines),i+7))}
                  for i in sorted(indices):print(f"G10FLOW:{name}:{i+1:03} {lines[i][:195]}")
          PY
