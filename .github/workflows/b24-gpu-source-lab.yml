name: B24 GPU C1L1 Source Lab - No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/b24-gpu-source-lab.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu_static_mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout recovered private C1L1 assets and GPU sources
        uses: actions/checkout@v4
      - name: Inspect original glTF mesh node transforms before coordinate baking
        run: |
          python3 - <<'PY'
          import zipfile
          from research.b24_unified.export_b24_c1_gpu_mesh import SOURCE,MEMBER,decode_glb
          with zipfile.ZipFile(SOURCE) as z: d,_=decode_glb(z.read(MEMBER))
          for i,n in enumerate(d['nodes'][:8]):
            print('C1L1 NODE',i,repr(n)[:950])
          trans={}
          for n in d['nodes'][1:]:
            if 'mesh' in n:
              keys=tuple(k for k in ('matrix','translation','rotation','scale') if k in n)
              trans[keys]=trans.get(keys,0)+1
          print('TRANSFORM PROFILE',trans)
          PY
      - name: Convert authentic C1L1 indexed GLB to GPU draw-data
        run: |
          set -euo pipefail
          python3 research/b24_unified/export_b24_c1_gpu_mesh.py \
            --out /tmp/C1L1_original_gpu.c1g2 --manifest /tmp/C1L1_gpu_manifest.json
          python3 - <<'PY'
          import json,struct,pathlib
          m=json.loads(pathlib.Path('/tmp/C1L1_gpu_manifest.json').read_text())
          assert m['vertices']==37946 and m['indices']==68757
          assert m['triangles']==22919
          assert len(m['batches'])==4 and sum(b['indices'] for b in m['batches'])==68757
          assert not m['has_uv0'] and not m['has_real_textures']
          assert m['vita_context_attached'] is False
          assert m['vita_armor_mesh_attached'] is False
          print('PASS 370 original C1L1 source submeshes -> 4 indexed GPU-ready batches')
          PY
      - name: Test native GPU scene reader and mock vitaGL draw calls
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iresearch/b24_unified/mock_gpu -Iresearch/b24_unified \
            research/b24_unified/b24_c1_gpu_mesh.c \
            research/b24_unified/b24_c1_gpu_vitagl.c \
            research/b24_unified/test_b24_c1_gpu_mock.c \
            -lm -o /tmp/b24-gpu-test
          /tmp/b24-gpu-test /tmp/C1L1_original_gpu.c1g2
      - name: B24 Z-up camera and single VitaGL owner frame graph host gates
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            research/b24_unified/b24_gpu_camera.c \
            research/b24_unified/test_b24_gpu_camera.c \
            -lm -o /tmp/b24-gpu-camera
          /tmp/b24-gpu-camera
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iresearch/b24_unified/mock_gpu -Iresearch/b24_unified \
            research/b24_unified/b24_gpu_camera.c \
            research/b24_unified/b24_gpu_owner_vitagl.c \
            research/b24_unified/b24_c1_gpu_mesh.c \
            research/b24_unified/b24_c1_gpu_vitagl.c \
            research/b24_unified/test_b24_gpu_owner_mock.c \
            -lm -o /tmp/b24-owner
          /tmp/b24-owner /tmp/C1L1_original_gpu.c1g2
      - name: Original five-suit dynamic IM2V GPU vertex and UV atlas regression
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iresearch/b24_unified/mock_gpu -Iresearch/b24_unified \
            research/b24_unified/b24_gpu_suit_vitagl.c \
            research/b24_unified/test_b24_gpu_suit_mock.c \
            -lm -o /tmp/b24-suit-gpu
          /tmp/b24-suit-gpu
      - name: Native GPU HUD 20k randomized scene and zero texture upload regression
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iresearch/b24_unified/mock_gpu -Iresearch/b24_unified \
            -Iresearch/b22_flight -Iresearch/b22_camera \
            -Iresearch/b19/host_gameplay -Iresearch/b21_controls \
            -Iresearch/b22_hud -Iresearch/b23_missile_lock \
            -Iresearch/b22_4_6 \
            research/b24_unified/b24_gpu_hud_native.c \
            research/b24_unified/b24_gpu_hud_native_vitagl.c \
            research/b24_unified/test_b24_gpu_hud_native_mock.c \
            -lm -o /tmp/b24-gpu-native-hud
          /tmp/b24-gpu-native-hud
      - name: CPU vs GPU submission timing - six phase source regression
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            research/b24_unified/b24_gpu_cpu_profile.c \
            research/b24_unified/test_b24_gpu_cpu_profile.c \
            -lm -o /tmp/b24-gpu-profile
          /tmp/b24-gpu-profile
      - name: Native B24 world-space right repulsor / chest Unibeam regression
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            research/b24_unified/b24_weapon_aim.c \
            research/b24_unified/test_b24_weapon_aim.c \
            -lm -o /tmp/b24-weapon-aim
          /tmp/b24-weapon-aim
      - name: Compile real GPU scene adapter against VitaSDK headers - object files ONLY
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            vitasdk/vitasdk:2026.08 sh -lc '
              set -eu
              arm-vita-eabi-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -D__vita__ \
                -Iresearch/b24_unified \
                -c research/b24_unified/b24_c1_gpu_mesh.c -o /tmp/b24_c1_gpu_mesh_vita.o
              arm-vita-eabi-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -D__vita__ \
                -Iresearch/b24_unified \
                -c research/b24_unified/b24_c1_gpu_vitagl.c -o /tmp/b24_c1_gpu_vitagl_vita.o
              arm-vita-eabi-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -D__vita__ \
                -Iresearch/b24_unified \
                -c research/b24_unified/b24_weapon_aim.c -o /tmp/b24_weapon_aim_vita.o
              arm-vita-eabi-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -D__vita__ \
                -Iresearch/b24_unified \
                -c research/b24_unified/b24_gpu_camera.c -o /tmp/b24_gpu_camera.o
              arm-vita-eabi-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -D__vita__ \
                -Iresearch/b24_unified \
                -c research/b24_unified/b24_gpu_owner_vitagl.c -o /tmp/b24_gpu_owner.o
              arm-vita-eabi-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -D__vita__ \
                -Iresearch/b24_unified \
                -c research/b24_unified/b24_gpu_suit_vitagl.c -o /tmp/b24_gpu_suit.o
              arm-vita-eabi-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -D__vita__ \
                -Iresearch/b24_unified -Iresearch/b22_flight -Iresearch/b22_camera \
                -Iresearch/b19/host_gameplay -Iresearch/b21_controls \
                -Iresearch/b22_hud -Iresearch/b23_missile_lock -Iresearch/b22_4_6 \
                -c research/b24_unified/b24_gpu_hud_native.c -o /tmp/b24_gpu_hud_native.o
              arm-vita-eabi-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -D__vita__ \
                -Iresearch/b24_unified -Iresearch/b22_flight -Iresearch/b22_camera \
                -Iresearch/b19/host_gameplay -Iresearch/b21_controls \
                -Iresearch/b22_hud -Iresearch/b23_missile_lock -Iresearch/b22_4_6 \
                -c research/b24_unified/b24_gpu_hud_native_vitagl.c -o /tmp/b24_gpu_hud_native_vitagl.o
              arm-vita-eabi-gcc -std=gnu11 -O2 -Wall -Wextra -Werror -D__vita__ \
                -Iresearch/b24_unified \
                -c research/b24_unified/b24_gpu_cpu_profile.c -o /tmp/b24_gpu_cpu_profile.o
              echo "PASS real VitaSDK GPU CPU-side profiler + native HUD objects: GPU busy not invented, no VPK"
            '
      - name: Inspect authentic original B11 mesh vertex UV and material records
        run: |
          set -euo pipefail
          python3 -m pip install -q numpy
          python3 research/b24_unified/audit_b11_uv_source.py
      - name: Publish diagnostics only - no original 2010 game data exported
        uses: actions/upload-artifact@v4
        with:
          name: B24_C1L1_GPU_Source_Manifest_JSON_ONLY
          path: /tmp/C1L1_gpu_manifest.json
          if-no-files-found: error

# Original 2010 C1L1 node coordinate audit in host runner, no Vita VPK.
# B24 G2: recheck authentic Z-up GPU suit pose Stage2/RUSH pitch/bank root matrix, strict source + arm-vita-eabi-gcc only.

# B11 mesh-node presentation rotation validated: source Z-up must remain Z-up.

# Source-only GPU owner/projection tests; no Vita package output.

# Re-run after completing GL_TRUE in the source-only vitaGL mock.

# Native one-batch GPU HUD replaces full 480x272 upload: fuzz includes offscreen GPU clipping.

# Recheck strict signed enum profile phase and valid waveform test, source-only no VPK.

# Re-run real VitaSDK strict-Werror CPU profile after unsigned enum bounds fix; no package.
