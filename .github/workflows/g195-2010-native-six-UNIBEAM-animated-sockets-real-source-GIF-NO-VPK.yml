name: G195 source-original 2010 Mark VI six UniBeam animations BDAE moving sockets and real GIF NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g195-2010-native-six-UNIBEAM-animated-sockets-real-source-GIF-NO-VPK.yml"
      - "research/b24_unified/g195_original_2010_animated_unibeam_nodes/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_2010_native_beam_chest_foot_per_frame:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - name: Check G195 original B13 source animation socket and authentic skinned mesh renderer API
        run: |
          set -euo pipefail
          python3 -m py_compile research/b24_unified/g195_original_2010_animated_unibeam_nodes/g195_source_original_MarkVI_3phase_animated_dummy_sockets_GIF.py
          python3 -m pip install -q numpy scipy matplotlib pillow gdown
      - uses: actions/download-artifact@v4
        with:
          name: G193_GENUINE_2010_UNIBEAM_DUMMY14_CHEST_33_FOOT_NATIVE_ARM_NO_VPK
          run-id: 39119194834
          github-token: ${{ github.token }}
          path: /tmp/g195_proven_native_names
      - name: Read original owner 2010 game assets privately only in ephemeral runner
        run: |
          set -euo pipefail
          mkdir -p /tmp/g195_owner_PRIVATE
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g195_owner_PRIVATE/owner.ipa ||
            gdown '131--LA4lrPKxpieS6LFKftIpkMY8YWsA' -O /tmp/g195_owner_PRIVATE/owner.ipa
          test "$(wc -c </tmp/g195_owner_PRIVATE/owner.ipa)" -eq 248613763
      - name: Bake all original 2010 MarkVI UniBeam ground hover real BRES skin/source socket 14 33 animation GIFs and PNG NO VPK
        run: |
          set -euo pipefail
          python3 research/b24_unified/g195_original_2010_animated_unibeam_nodes/g195_source_original_MarkVI_3phase_animated_dummy_sockets_GIF.py \
            --ipa /tmp/g195_owner_PRIVATE/owner.ipa \
            --g193 /tmp/g195_proven_native_names/G193_ORIGINAL_2010_UNIBEAM_NATIVE_DUMMY14_CHEST_33_FOOT_L_ARM_PROOF.json \
            --out /tmp/g195_public_source
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/g195_public_source')
          d=json.loads((p/'G195_REAL_2010_MARKVI_UNIBEAM_ANIMATED_CHEST_FOOT_SOURCE_MANIFEST.json').read_text())
          assert d['source_phase_timeline_ms']=={'ground':1800,'hover':2266}
          assert d['source_original_skin_vertices']==802
          assert d['source_original_inverse_rest_bind_residual']<2e-4
          assert len(d['source_original_sampled_sequences']['ground'])>=18
          assert len(d['source_original_sampled_sequences']['hover'])>=23
          assert not d['original_game_or_Vita_scene_world_actor_transform_PROVEN']
          assert not d['Vita_real_UNIBEAM_hit_detection_or_damage_changed']
          assert d['NO_VPK']
          for f in ['G195_REAL_2010_MARKVI_GROUND_UNIBEAM_ANIMATED_DUMMY14_33.gif',
                    'G195_REAL_2010_MARKVI_HOVER_UNIBEAM_ANIMATED_DUMMY14_33.gif',
                    'G195_ORIGINAL_2010_MARKVI_GROUND_HOVER_DUMMY14_33_SOURCE_MOTION_TRAJECTORIES.png']:
            data=(p/f).read_bytes()
            assert len(data)>10000
            assert data.startswith(b'GIF8') if f.endswith('.gif') else data.startswith(bytes.fromhex('89504e470d0a1a0a'))
          print('PASS G195 user-owned genuine 2010 6 UniBeam B13 skin sampled 3-phase socket matrices GIF ground hover and PNG, no Vita/VPK claim')
          PY
          test -z "$(find . -type f -name '*.vpk' -print -quit)"
      - name: Destroy original proprietary iOS 2010 IPA from temporary runner on every outcome
        if: always()
        run: rm -rf /tmp/g195_owner_PRIVATE
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: G195_REAL_2010_MARKVI_6_UNIBEAM_SKINNED_CHEST_FOOT_SOURCE_GIFS_PNG_NO_VPK
          path: /tmp/g195_public_source/
          retention-days: 30
          if-no-files-found: error
