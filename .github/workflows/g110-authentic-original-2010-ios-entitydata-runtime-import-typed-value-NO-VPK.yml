name: G110 2010 EntityData Native Getter Original libc Symbol Identification NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g110-authentic-original-2010-ios-entitydata-runtime-import-typed-value-NO-VPK.yml"
      - "research/b24_unified/g109_original_native_mechanics/g110_*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner_original_2010_EntityData_runtime_symbol_resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: User-owned authentic original 2010 IPA transiently read for native typed getter import metadata
        run: |
          set -euo pipefail
          python3 -m pip install -q gdown
          mkdir -p /tmp/g110_private
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O /tmp/g110_private/owner.ipa ||
            gdown '131--LA4lrPKxpieS6LFKftIpkMY8YWsA' -O /tmp/g110_private/owner.ipa
          test "$(wc -c </tmp/g110_private/owner.ipa)" -eq 248613763
      - name: Parse 2010 actual iOS MachO dyld LC_DYSYMTAB imported GetParamValue int/bool strcmp and raw typed-data conversion
        run: |
          set -euo pipefail
          python3 research/b24_unified/g109_original_native_mechanics/g110_original_2010_macho_dyld_stub_real_string_and_int_value_dispatch.py \
            --ipa /tmp/g110_private/owner.ipa --out /tmp/g110_out
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/g110_out/G110_ACTUAL_2010_CPLUSPLUS_EntityData_GetParamValue_GetInt_GetBool_SOURCE_IMPORTED_STUBS.json').read_text())
          assert len(j['real_imported_CPP_libc_lookup_functions'])==2
          assert all(x['source_resolution_unique'] for x in j['real_imported_CPP_libc_lookup_functions'])
          assert not j['C1L1_26_real_Attack_instance_Damage_values_typed_by_this_stage']
          assert j['NO_VPK'] is True
          print('PASS G110 real 2010 iOS Source native Getter imported functions fully identified')
          PY
          test -z "$(find . /tmp/g110_out -type f -name '*.vpk' -print -quit)"
      - name: Remove private user-owned original game from worker even on failure
        if: always()
        run: rm -rf /tmp/g110_private
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: G110_ORIGINAL_2010_EntityData_GetParamValue_TRUE_LIBC_Native_Dispatch_Provenance_NO_VPK
          path: /tmp/g110_out/G110_ACTUAL_2010_CPLUSPLUS_EntityData_GetParamValue_GetInt_GetBool_SOURCE_IMPORTED_STUBS.json
          retention-days: 14
          if-no-files-found: error
