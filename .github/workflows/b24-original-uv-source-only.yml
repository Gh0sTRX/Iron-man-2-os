name: B24 Original C1L1 UV Source Audit - No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/b24-original-uv-source-only.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore_original_uv:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout private original 2010 BDAE source (never upload assets)
        uses: actions/checkout@v4
      - name: Install B11 parser dependency
        run: python3 -m pip install -q numpy
      - name: Decode and independently verify 370 original meshes UV
        run: |
          set -euo pipefail
          python3 research/b24_unified/recover_c1l1_original_uv.py \
            --out /tmp/original_C1L1_uv.c1uv \
            --manifest /tmp/original_C1L1_uv_manifest.json
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          path=Path('/tmp/original_C1L1_uv.c1uv')
          magic,ver,verts,meshes=struct.unpack_from('<4sIII',path.read_bytes())
          assert (magic,ver,verts,meshes)==(b'C1UV',1,37946,370)
          assert path.stat().st_size==16+370+37946*8
          d=json.loads(Path('/tmp/original_C1L1_uv_manifest.json').read_text())
          assert d['counts']['vehicle_meshes']==22
          assert d['counts']['mesh_count']==370
          assert d['exact_world_face_alignment']
          assert not d['fully_textured_C1L1']
          print('PASS 2010 C1L1 original UV recovery: 370 meshes in exact B24 C1G2 draw ordering')
          PY
      - name: Recover per-triangle original C1L1 material labels WITHOUT guessing atlas bindings
        run: |
          set -euo pipefail
          python3 research/b24_unified/recover_c1l1_triangle_materials.py \
            --out /tmp/C1L1_original_materials.c1ma \
            --manifest /tmp/C1L1_original_materials_manifest.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('/tmp/C1L1_original_materials_manifest.json').read_text())
          assert d['vertices']==37946 and d['triangles']==22919
          assert d['meshes']==370 and d['all_source_glb_faces_and_material_ranges_verified']
          assert d['unique_file_scoped_materials']>0
          assert not d['diffuse_texture_links_proven']
          print('PASS source original C1L1 material mapping to every triangle, no made-up textures')
          PY
      - name: Original C1L1 file-scoped material source C11 loading and corruption guards
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            research/b24_unified/b24_c1_material_source.c \
            research/b24_unified/test_b24_c1_material_source.c \
            -o /tmp/b24-material-original-source-test
          /tmp/b24-material-original-source-test /tmp/C1L1_original_materials.c1ma
      - name: Native C11 original UV sidecar decoding and corruption guards
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            research/b24_unified/b24_c1_gpu_uv.c \
            research/b24_unified/test_b24_c1_gpu_uv.c \
            -lm -o /tmp/b24-c1uv-test
          /tmp/b24-c1uv-test /tmp/original_C1L1_uv.c1uv
      - name: Source-verified GPU material gate - original vehicles ONLY
        run: |
          set -euo pipefail
          python3 research/b24_unified/export_b24_c1_gpu_mesh.py \
            --out /tmp/original_C1L1_gpu.c1g2 \
            --manifest /tmp/uv_gpu_scene_manifest.json
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iresearch/b24_unified/mock_gpu -Iresearch/b24_unified \
            research/b24_unified/b24_c1_gpu_mesh.c \
            research/b24_unified/b24_c1_gpu_uv.c \
            research/b24_unified/b24_gpu_c1_material_vitagl.c \
            research/b24_unified/test_b24_gpu_c1_material_mock.c \
            -lm -o /tmp/b24-mesh-materials
          /tmp/b24-mesh-materials /tmp/original_C1L1_gpu.c1g2 /tmp/original_C1L1_uv.c1uv
      - name: Validate 512x512 vehicle atlas one-time GPU upload and corrupt input guards
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iresearch/b24_unified/mock_gpu -Iresearch/b24_unified \
            research/b24_unified/b24_gpu_c1_vehicle_texture_vitagl.c \
            research/b24_unified/test_b24_gpu_c1_vehicle_texture_mock.c \
            -lm -o /tmp/b24-vehicle-atlas-gpu
          /tmp/b24-vehicle-atlas-gpu
      - name: Upload METADATA ONLY, never copyrighted atlas, UV, models
        uses: actions/upload-artifact@v4
        with:
          name: B24_Original_C1L1_UV_Metadata_No_Game_Data
          path: |
            /tmp/original_C1L1_uv_manifest.json
            /tmp/C1L1_original_materials_manifest.json
          if-no-files-found: error

# Rerun corrected original 512 atlas width corruption fixture; source-only, no VPK.
