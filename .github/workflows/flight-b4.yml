name: Build Iron Man 2 Vita Flight Beta B4
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/flight-b4.yml"
      - "flight_b4/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare original assets and B4 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          unzip -oq source/IronMan2_Vita_GitHub_Ready_CI_R2.zip -d work
          unzip -oq flight_b4/flight_b4_overlay.zip -d work
          python3 work/tools/check_assets.py
          sed -i             -e 's/IronMan2_Asset_Beta\.vpk/IronMan2_Flight_B4.vpk/g'             -e 's/IM2A00001/IM2B00002/g'             -e 's/VERSION 01.01/VERSION 01.02/g'             -e 's/Iron Man 2 - Asset Beta/Iron Man 2 - Flight B4/g'             work/CMakeLists.txt
          printf '\nif(DEFINED ENV{VITASDK})\n  target_link_libraries(im2_beta stdc++ mathneon taihen_stub SceKernelDmacMgr_stub)\nendif()\n' >> work/CMakeLists.txt
          grep -q IM2B00002 work/CMakeLists.txt
      - name: Test software rasterizer on Linux
        shell: bash
        run: |
          set -euo pipefail
          cmake -S work -B work/build-local -DCMAKE_BUILD_TYPE=Release
          cmake --build work/build-local --parallel 4
          work/build-local/im2_preview work/models/mark6.im2t work/b4-preview.ppm 3.1 0 1
          test -s work/b4-preview.ppm
      - name: Build PS Vita VPK
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE/work:/workspace" -w /workspace vitasdk/vitasdk:2026.08 sh -lc 'cmake -S . -B build-vita -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release && cmake --build build-vita --parallel 4'
      - name: Verify VPK
        shell: bash
        run: |
          set -euo pipefail
          test -s work/build-vita/IronMan2_Flight_B4.vpk
          unzip -t work/build-vita/IronMan2_Flight_B4.vpk | tail -1
          unzip -Z1 work/build-vita/IronMan2_Flight_B4.vpk | grep -Fx eboot.bin
      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronMan2_Flight_B4_VPK
          path: work/build-vita/IronMan2_Flight_B4.vpk
          if-no-files-found: error
