name: B24 Underwater Genuine B13 811 Vertex Skin Pose Verification - No VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/b24-underwater-true-skin-b13-811.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner_source_inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout vetted inventory tools
        uses: actions/checkout@v4
      - name: Retrieve exactly owner-provided original IPA via share URL into ephemeral runner
        run: |
          set -euo pipefail
          python3 -m pip install -q gdown
          mkdir -p /tmp/ironman-owner-ipa
          cd /tmp/ironman-owner-ipa
          # Only explicit owner-supplied 2026-10-14 exact Drive file ID.
          gdown '1bjkPiM9WvU_WrzIaUUnx-Lq3bnyJTE0I' -O source_v1.0.0.ipa
          test "$(wc -c < source_v1.0.0.ipa)" -eq 248613763
          echo "PASS exact owner-supplied original archive length; original archive NEVER uploaded as artifact"
      - name: Run original B13 2010 skin parser on true 811-vertex underwater player mesh
        run: |
          set -euo pipefail
          python3 -m pip install -q numpy scipy
          python3 - <<'PY'
          import zipfile,struct,sys,os
          import numpy as np
          from pathlib import Path
          sys.path.insert(0,'research/b24_unified')
          from b24_owner_pack_extract import decode,get_exact
          import tempfile
          with zipfile.ZipFile('/tmp/ironman-owner-ipa/source_v1.0.0.ipa') as z:
              models=z.read('Payload/IronMan2.app/models')
              anims=z.read('Payload/IronMan2.app/anims')
          raw=get_exact(models,decode(models,'.bdae'),'LC_MC_UnderWater.bdae')
          b=Path('/tmp/b24_b13_underwater')
          b.mkdir(exist_ok=True)
          with zipfile.ZipFile('animation_b13/B13_Reproducible_Source.zip') as z:
              z.extract('tools/b13_bake.py',b)
              z.extract('tools/anim_decoder_b6.py',b)
          # Source BRES contains three 'Bip01-node' ASCII occurrences:
          # two are prefix '#Bip01-node' unrelated strings and exactly ONE
          # real pointer-backed skeletal root. B13's old .find() chose the
          # first false text occurrence. Choose the unique referenced offset.
          src=(b/'tools/b13_bake.py').read_text()
          old="target=raw.find(b'Bip01-node\\0');assert target>0"
          new="hits=[i for i in range(0,len(raw)-11) if raw[i:i+11]==b'Bip01-node\\0']\n    refs=[i for i in hits if sum(raw[k:k+4]==struct.pack('<I',i)\n                        for k in range(32,len(raw)-72,4))==1]\n    assert len(refs)==1,refs\n    target=refs[0]"
          assert src.count(old)==1
          src=src.replace(old,new)
          # Original Underwater source descriptor: 26 bone palette, 192 unique
          # positive weights, 811 vertex influence lists. The B13 archive
          # hardcoded nw<=128 for early Mark VI/WM shapes. Broaden the *count*
          # only; B13 still rejects invalid arrays and nonunit weight sums.
          assert src.count('1<=nw<=128')==1
          src=src.replace('1<=nw<=128','1<=nw<=512')
          (b/'tools/b13_bake.py').write_text(src)
          sys.path.insert(0,str(b/'tools'))
          import b13_bake as original
          nodes=original.parse_rig(raw)
          print('UNDERWATER_NATIVE_RIG_NODE_COUNT',len(nodes),
                'first_nodes',[(n['name'],n['parent']) for n in nodes[:6]])
          # Source file 840v = 811 skinned model mesh + 29 separate static part.
          offset,names,inv,idx,w=original.parse_skin(raw,811)
          print('UNDERWATER_TRUE_SOURCE_SKIN',hex(offset),
               'bone_palette_count',len(names),'skinned_vertices',len(idx),
               'max_influences',int(np.count_nonzero(w,axis=1).max()))
          mapped={}
          for node in nodes:
              at=struct.unpack_from('<I',raw,node['offset']+8)[0]
              if at<len(raw):
                  label=raw[at:raw.index(b'\0',at)].decode('latin1')
                  if label in names:
                      if label in mapped:raise ValueError('duplicate original BoneNN mapping')
                      mapped[label]=node['name']
          print('UNDERWATER_PALETTE_MAPPING',len(mapped),'of',len(names))
          assert len(mapped)==len(names),'original model inverse bind mapping incomplete'
          world=original.worlds(nodes)
          joints=[mapped[x] for x in names]
          maxerr=max(float(np.max(np.abs(world[j]@inv[i]-np.eye(4)))) for i,j in enumerate(joints))
          print('UNDERWATER_ORIGINAL_SKIN_REST_BIND_ERROR',maxerr)
          assert maxerr<2e-4
          with zipfile.ZipFile('research/B11_C1L1_Source_Parser.zip') as z:
              parser=z.read('bdae_scene_parser.py')
          mod={'__name__':'underwater_b11_mesh','__file__':'bdae_scene_parser.py'}
          exec(compile(parser,'bdae_scene_parser.py','exec'),mod)
          meshes,_=mod['parse'](raw)
          assert [len(m['positions']) for m in meshes]==[811,29]
          coords=np.asarray(meshes[0]['positions'],dtype=np.float64)
          assert coords.shape==(811,3)
          data={'nodes':nodes,'joints':joints,'inv':inv,'indexes':idx,
                'weights':w,'verts':np.column_stack([coords,np.zeros((811,2))])}
          clipraw=get_exact(anims,decode(anims,'.anim'),'Underwater_Swim_F.anim')
          clip=original.decode_anim(clipraw)
          assert len(clip.names)==38
          a=original.bake_pose(data,clip,0)
          mid=original.bake_pose(data,clip,max(1,clip.duration_ms//2))
          assert a.shape==mid.shape==(811,3) and np.isfinite(a).all() and np.isfinite(mid).all()
          diff=float(np.max(np.abs(mid-a)))
          print('UNDERWATER_TRUE_ORIGINAL_SWIM_F_811V_DEFORMATION',diff)
          assert diff>1e-5 and diff<1000,'invalid or static genuine underwater animation'
          print('PASS genuine 2010 UNDERWATER 811-v skin bind matrices & live source Swim_F vertex skinning from original 38-track motion. Remaining 29 vertices NOT YET RIGGED; NO VPK')
          PY
      - name: Delete private original source files in temporary CI runner
        if: always()
        run: rm -rf /tmp/ironman-owner-ipa /tmp/b24_b13_underwater
