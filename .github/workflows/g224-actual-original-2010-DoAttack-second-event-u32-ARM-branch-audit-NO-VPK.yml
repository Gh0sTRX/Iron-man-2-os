name: G224 original 2010 native DoAttack second AttackType event u32 646 ARM source audit NO VPK
on:
  push:
    branches: [feature/b24-unified-gameplay]
    paths:
      - ".github/workflows/g224-actual-original-2010-DoAttack-second-event-u32-ARM-branch-audit-NO-VPK.yml"
      - "research/b24_unified/g224_original_AttackType_eventArg_paths/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact_owner_2010_DoAttack_second_event_argument_ARM:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate 2010 original complete native 646 opcode input branch audit syntax
        run: |
          set -euo pipefail
          python3 -m py_compile research/b24_unified/g224_original_AttackType_eventArg_paths/g224_exact_owner_2010_DoAttack_second_event_parameter_register_source.py
      - uses: actions/download-artifact@v4
        with:
          name: G196_ORIGINAL_2010_NATIVE_UNIBEAM_14_33_GUARD_CFG_SOURCE_PNG_NO_VPK
          run-id: 39124662533
          github-token: ${{ github.token }}
          path: /tmp/g224_original_owner_ARM
      - uses: actions/download-artifact@v4
        with:
          name: G221_ORIGINAL_2010_ATTACKTYPE_STATETRACK_THIRD_U32_ACTOR_VCALL_SOURCE_NO_VPK
          run-id: 39141125765
          github-token: ${{ github.token }}
          path: /tmp/g224_original_owner_Event
      - name: Map only genuine 2010 ARM DoAttack r1 r2 state event payload comparisons, no fabricated 2010 button firing
        run: |
          set -euo pipefail
          python3 research/b24_unified/g224_original_AttackType_eventArg_paths/g224_exact_owner_2010_DoAttack_second_event_parameter_register_source.py \
            --g196 /tmp/g224_original_owner_ARM/G196_ORIGINAL_2010_UNIBEAM_CHEST_FOOT_NATIVE_DISPATCH_CFG.json \
            --g221 /tmp/g224_original_owner_Event/G221_TRUE_2010_ATTACKTYPE_NATIVE_EVENT_THIRD_U32_VIRTUAL_CALL_SOURCE.json \
            --out /tmp/g224_result/G224_2010_OWNER_DOATTACK_ORIGINAL_SECOND_EVENT_ARG_ARM_COMPARE_SOURCE.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/g224_result/G224_2010_OWNER_DOATTACK_ORIGINAL_SECOND_EVENT_ARG_ARM_COMPARE_SOURCE.json').read_text())
          assert d['authentic_2010_original_DoAttack_ARM_VM']=='0xf64f8'
          assert d['source_original_DoAttack_opcode_count']==646
          assert len(d['source_original_4_armor_AttackType_eventPayload_values'])==4
          assert d['original_Cpp_Actor_Event_third_u32_passed_as_DoAttack_second_INT_proven']
          assert not d['source_native_event_third_u32_values_0_1_2_3_gameplay_semantics_PROVEN']
          assert not d['source_original_2010_touchgesture_button_full_equivalence_PROVEN']
          assert not d['source_G218_Vita_real_combat_physics_or_damage_modified']
          assert d['NO_VPK']
          print('PASS G224 source real 2010 exact DoAttack opcode register and second event argument audit without invented weapon semantics/VPK')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: G224_2010_REAL_DOATTACK_SECOND_EVENT_ARG_646_ARM_SOURCE_NO_VPK
          path: /tmp/g224_result/
          retention-days: 21
          if-no-files-found: error
